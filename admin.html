                                    >
                                        삭제
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // 8. Logs Module (Realtime DB Integration)
        const LogsModule = () => {
            const [dateFrom, setDateFrom] = useState('');
            const [dateTo, setDateTo] = useState('');
            const [filterType, setFilterType] = useState('All');
            const [logs, setLogs] = useState([]); // 실제 데이터 사용

            // [HELPER] DB Row -> UI Log Object 변환
            const transformLog = (dbRow) => {
                const typeMap = {
                    'game_mole_whack': '수업',
                    'game_stroop': '수업',
                    'game_custom': '수업',
                    'consultation_start': '상담',
                    'consultation_end': '상담',
                    'student_add': '학생관리',
                    'client_add': '학생관리',
                    'login': '시스템',
                    'logout': '시스템'
                };

                // teacher 정보 결합
                const teacherName = dbRow.teacher?.name || (dbRow.teacher_id ? '정보 없음' : '-');
                const centerName = dbRow.teacher?.center || '';

                return {
                    id: dbRow.id,
                    teacher: teacherName,
                    teacherId: dbRow.teacher_id,
                    center: centerName,
                    // 매핑되지 않은 타입은 원본 그대로 표시하여 디버깅 지원
                    type: typeMap[dbRow.action_type] || dbRow.action_type || '기타',
                    // [DEBUG] 전체 데이터 덤프
                    action: dbRow.title || dbRow.action_type || 'No Title',
                    details: JSON.stringify(dbRow), // 전체 데이터 확인용
                    time: new Date(dbRow.created_at).toLocaleString('ko-KR'),
                    rawTime: dbRow.created_at
                };
            };

            useEffect(() => {
                // 1. 초기 데이터 로드
                const fetchLogs = async () => {
                    // teachers 테이블 조인 시도 (FK 필요)
                    const { data, error } = await supabase
                        .from('histories')
                        .select('*, teacher:teachers(name, center)')
                        .order('created_at', { ascending: false })
                        .limit(100);

                    if (!error && data) {
                        setLogs(data.map(transformLog));
                    } else {
                        console.error('Logs Fetch Error (fallback needed?):', error);
                        // 조인 실패 시 raw data라도 표시
                        if (error && error.code) { // PIGRST error code check if needed
                            const { data: rawData } = await supabase.from('histories').select('*').order('created_at', { ascending: false }).limit(50);
                            if (rawData) setLogs(rawData.map(r => transformLog(r)));
                        }
                    }
                };
                fetchLogs();

                // 2. Realtime 구독 (INSERT 이벤트)
                const channel = supabase
                    .channel('realtime-logs')
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'histories' }, async (payload) => {
                        const newRow = payload.new;

                        // 선생님 정보 추가 조회 (INSERT 이벤트에는 조인 데이터 없음)
                        let teacherInfo = {};
                        if (newRow.teacher_id) {
                            const { data } = await supabase.from('teachers').select('name, center').eq('id', newRow.teacher_id).single();
                            if (data) teacherInfo = data;
                        }

                        const newLog = transformLog({ ...newRow, teacher: teacherInfo });

                        // [Auto-Update] 최신 로그를 목록 최상단에 추가
                        setLogs(prev => [newLog, ...prev]);
                    })
                    .subscribe();

                return () => {
                    supabase.removeChannel(channel);
                };
            }, []);

            // Filter logs by date range and type
            // Filter logs by date range and type
            const filteredLogs = logs.filter(log => {
                // Date filter
                let matchDate = true;
                if (dateFrom || dateTo) {
                    const logT = new Date(log.rawTime || log.time);
                    const from = dateFrom ? new Date(dateFrom) : null;
                    const to = dateTo ? new Date(dateTo + 'T23:59:59') : null;

                    if (from && to) matchDate = logT >= from && logT <= to;
                    else if (from) matchDate = logT >= from;
                    else if (to) matchDate = logT <= to;
                }

                // Type filter
                const matchType = filterType === 'All' || log.type === filterType;

                return matchDate && matchType;
            });

            return (
                <div className="w-full h-full p-8 flex flex-col animate-fade-in">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-2xl font-black text-white">활동 로그 <span className="text-sm font-normal text-green-400 ml-2 animate-pulse">● 실시간 연동 중</span></h2>
                        <div className="flex gap-3 items-center">
                            <select
                                className="bg-gray-900 border border-gray-800 text-white rounded-lg px-3 py-2 text-sm focus:border-[#FEE500] outline-none"
                                value={filterType}
                                onChange={e => setFilterType(e.target.value)}
                            >
                                <option value="All">전체 유형</option>
                                <option value="수업">수업</option>
                                <option value="상담">상담</option>
                                <option value="학생관리">학생관리</option>
                                <option value="시스템">시스템</option>
                            </select>
                            <div className="h-6 w-[1px] bg-gray-700"></div>
                            <input
                                type="date"
                                value={dateFrom}
                                onChange={e => setDateFrom(e.target.value)}
                                className="bg-gray-900 border border-gray-800 text-white rounded-lg px-3 py-2 text-sm focus:border-[#FEE500] outline-none"
                            />
                            <span className="text-gray-500">~</span>
                            <input
                                type="date"
                                value={dateTo}
                                onChange={e => setDateTo(e.target.value)}
                                className="bg-gray-900 border border-gray-800 text-white rounded-lg px-3 py-2 text-sm focus:border-[#FEE500] outline-none"
                            />
                            {(dateFrom || dateTo || filterType !== 'All') && (
                                <button
                                    onClick={() => {
                                        setDateFrom('');
                                        setDateTo('');
                                        setFilterType('All');
                                    }}
                                    className="text-xs px-3 py-2 bg-gray-800 text-gray-400 rounded-lg hover:text-white"
                                >
                                    초기화
                                </button>
                            )}
                        </div>
                    </div>
                    <div className="flex-1 overflow-y-auto bg-gray-900 border border-gray-800 rounded-2xl">
                        <table className="w-full text-left border-collapse">
                            <thead className="bg-black text-gray-500 text-xs uppercase sticky top-0 z-10">
                                <tr>
                                    <th className="p-4 border-b border-gray-800">#</th>
                                    <th className="p-4 border-b border-gray-800">시간</th>
                                    <th className="p-4 border-b border-gray-800">선생님</th>
                                    <th className="p-4 border-b border-gray-800">유형</th>
                                    <th className="p-4 border-b border-gray-800">내용</th>
                                </tr>
                            </thead>
                            <tbody className="text-sm">
                                {filteredLogs.map((log, index) => (
                                    <tr key={log.id} className="border-b border-gray-800 hover:bg-gray-800/50 transition-colors duration-300">
                                        <td className="p-4 text-gray-500 font-bold">#{filteredLogs.length - index}</td> {/* index 계산 주의: 전체 length 기준 */}
                                        <td className="p-4 text-gray-400 font-mono text-xs whitespace-nowrap">{log.time}</td>
                                        <td className="p-4 text-gray-300 font-bold whitespace-nowrap">
                                            {log.teacher}
                                            {log.center && <span className="text-xs text-gray-500 ml-2">({log.center})</span>}
                                        </td>
                                        <td className="p-4 whitespace-nowrap">
                                            <span className={`px-2 py-1 rounded text-[10px] font-bold border ${log.type === '수업' ? 'border-blue-700 bg-blue-900/30 text-blue-400' :
                                                log.type === '상담' ? 'border-green-700 bg-green-900/30 text-green-400' :
                                                    log.type === '학생관리' ? 'border-purple-700 bg-purple-900/30 text-purple-400' :
                                                        log.type === '시스템' ? 'border-orange-700 bg-orange-900/30 text-orange-400' :
                                                            'border-gray-700 bg-gray-800 text-gray-400'
                                                }`}>{log.type}</span>
                                        </td>
                                        <td className="p-4 text-gray-300 w-full">{log.action} - {log.details}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                        {filteredLogs.length === 0 && (
                            <div className="text-center text-gray-500 py-10">
                                {dateFrom || dateTo ? '해당 기간의 로그가 없습니다.' : '로그가 없습니다.'}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // [NEW] Data Reset Components details
        const ResetConfirmModal = ({ isOpen, onClose, onConfirm, title, warningText }) => {
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            useEffect(() => {
                if (isOpen) {
                    setPassword('');
                    setError('');
                }
            }, [isOpen]);

            if (!isOpen) return null;

            const handleConfirm = () => {
                if (!verifyCredentials(password)) {
                    setError('비밀번호가 일치하지 않습니다.');
                    return;
                }
                onConfirm();
                onClose();
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm" onClick={onClose}>
                    <div className="bg-gray-900 border border-red-500/50 p-8 rounded-2xl w-full max-w-md shadow-2xl relative overflow-hidden" onClick={e => e.stopPropagation()}>
                        <div className="absolute top-0 left-0 w-full h-1 bg-red-500"></div>
                        <h3 className="text-2xl font-black text-white mb-2 flex items-center gap-2">
                            <span className="text-red-500">⚠️</span> {title}
                        </h3>
                        <p className="text-gray-300 mb-6 text-sm leading-relaxed">
                            {warningText}
                            <br />
                            <span className="text-red-400 font-bold block mt-2">이 작업은 절대 되돌릴 수 없습니다.</span>
                        </p>

                        <div className="mb-6">
                            <label className="block text-xs font-bold text-gray-500 mb-2">관리자 비밀번호 확인</label>
                            <input
                                type="password"
                                className="w-full bg-black border border-gray-700 text-white p-4 rounded-xl font-bold text-lg focus:border-red-500 focus:outline-none transition-colors"
                                placeholder="비밀번호 입력"
                                value={password}
                                onChange={(e) => { setPassword(e.target.value); setError(''); }}
                                autoFocus
                            />
                            {error && <p className="text-red-500 text-xs font-bold mt-2 animate-pulse">{error}</p>}
                        </div>

                        <div className="flex gap-3">
                            <button onClick={onClose} className="flex-1 py-4 bg-gray-800 text-gray-400 font-bold rounded-xl hover:bg-gray-700 transition">취소</button>
                            <button onClick={handleConfirm} className="flex-1 py-4 bg-red-600 text-white font-bold rounded-xl hover:bg-red-700 shadow-lg shadow-red-900/20 transition">초기화 실행</button>
                        </div>
                    </div>
                </div>
            );
        };

        // 9. Settings Module
        const SettingsModule = ({ showToast }) => {
            const [modalConfig, setModalConfig] = useState({ isOpen: false, type: '', title: '', warning: '' });

            const openModal = (type, title, warning) => {
                setModalConfig({ isOpen: true, type, title, warning });
            };

            const closeModal = () => {
                setModalConfig({ ...modalConfig, isOpen: false });
            };

            const handleReset = async () => {
                const { type } = modalConfig;

                try {
                    let successMsg = '';

                    if (type === 'ALL') {
                        // 전체 초기화: 순서 중요 (참조 무결성)
                        await supabase.from('histories').delete().neq('id', 0);
                        await supabase.from('notices').delete().neq('id', 0);
                        await supabase.from('play_contents').delete().neq('id', 0); // 콘텐츠도 삭제
                        await supabase.from('clients').delete().neq('id', 0);
                        const { error } = await supabase.from('teachers').delete().neq('id', 0);

                        if (error) throw error;
                        successMsg = '전체 데이터가 초기화되었습니다.';
                    }
                    else if (type === 'TEACHERS') {
                        // 선생님 초기화 (Cascade 설정에 따라 내담자/기록도 삭제될 수 있음)
                        const { error } = await supabase.from('teachers').delete().neq('id', 0);
                        if (error) throw error;
                        successMsg = '모든 선생님 데이터가 초기화되었습니다.';
                    }
                    else if (type === 'CLIENTS') {
                        // 내담자 초기화
                        const { error } = await supabase.from('clients').delete().neq('id', 0);
                        if (error) throw error;
                        successMsg = '모든 내담자 데이터가 초기화되었습니다.';
                    }
                    else if (type === 'CATEGORIES') {
                        // 카테고리별 초기화 -> 플레이랩 훈련 결과(histories)
                        const { error } = await supabase.from('histories').delete().neq('id', 0);
                        if (error) throw error;
                        successMsg = '플레이랩 훈련 결과가 초기화되었습니다.';
                    }
                    else if (type === 'NOTICES') {
                        // 공지사항 초기화
                        const { error } = await supabase.from('notices').delete().neq('id', 0);
                        if (error) throw error;
                        successMsg = '모든 공지사항이 삭제되었습니다.';
                    }

                    showToast(successMsg);
                } catch (err) {
                    console.error("Reset Error:", err);
                    showToast(`초기화 실패: ${err.message || '알 수 없는 오류'}`);
                }
            };

            return (
                <div className="w-full h-full p-8 overflow-y-auto animate-fade-in">
                    <h2 className="text-2xl font-black text-white mb-8">설정</h2>

                    {/* 기존 준비중 UI 대체 */}
                    <div className="bg-gray-900 border border-gray-800 rounded-2xl p-8 mb-8">
                        <h3 className="text-xl font-bold text-white mb-4 flex items-center gap-2">
                            {Settings && <Settings size={24} />} 일반 설정
                        </h3>
                        <p className="text-gray-500 text-sm">일반 설정 기능은 현재 준비 중입니다.</p>
                    </div>

                    {/* 데이터 관리 섹션 */}
                    <div className="bg-gray-900 border border-gray-800 rounded-2xl p-8">
                        <h3 className="text-xl font-bold text-white mb-6 flex items-center gap-2 text-red-500">
                            {AlertCircle && <AlertCircle size={24} />} 데이터 관리
                        </h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            <button onClick={() => openModal('TEACHERS', '선생님 초기화', '모든 선생님 계정과 프로필 데이터가 영구적으로 삭제됩니다.')} className="p-6 bg-black border border-gray-800 rounded-xl text-left hover:border-red-500/50 hover:bg-red-900/10 transition group">
                                <span className="block text-red-400 font-bold mb-1 group-hover:text-red-300">선생님 초기화</span>
                                <span className="text-xs text-gray-500">등록된 선생님 계정 전체 삭제</span>
                            </button>
                            <button onClick={() => openModal('CLIENTS', '내담자 초기화', '모든 내담자 정보와 활동 기록이 영구적으로 삭제됩니다.')} className="p-6 bg-black border border-gray-800 rounded-xl text-left hover:border-red-500/50 hover:bg-red-900/10 transition group">
                                <span className="block text-red-400 font-bold mb-1 group-hover:text-red-300">내담자 초기화</span>
                                <span className="text-xs text-gray-500">내담자 개인 정보 및 기록 삭제</span>
                            </button>
                            <button onClick={() => openModal('CATEGORIES', 'PLAYLAB 카테고리별 초기화', '플레이랩 인지/언어 재활 카테고리의 모든 결과 데이터가 초기화됩니다.')} className="p-6 bg-black border border-gray-800 rounded-xl text-left hover:border-red-500/50 hover:bg-red-900/10 transition group">
                                <span className="block text-red-400 font-bold mb-1 group-hover:text-red-300">카테고리별 초기화</span>
                                <span className="text-xs text-gray-500">플레이랩 훈련 결과 데이터 삭제</span>
                            </button>
                            <button onClick={() => openModal('NOTICES', '공지사항 초기화', '등록된 모든 공지사항이 삭제됩니다.')} className="p-6 bg-black border border-gray-800 rounded-xl text-left hover:border-red-500/50 hover:bg-red-900/10 transition group">
                                <span className="block text-red-400 font-bold mb-1 group-hover:text-red-300">공지사항 초기화</span>
                                <span className="text-xs text-gray-500">게시된 공지사항 전체 삭제</span>
                            </button>
                            <button onClick={() => openModal('ALL', '시스템 전체 초기화', '시스템 내 모든 데이터(선생님, 내담자, 공지, 콘텐츠, 결과 등)가 완전히 삭제됩니다.')} className="p-6 bg-red-900/20 border border-red-500/30 rounded-xl text-left hover:bg-red-900/40 hover:border-red-500 transition group col-span-1 md:col-span-2 lg:col-span-3">
                                <span className="block text-red-500 font-black mb-1 text-lg group-hover:text-red-400">⚠️ 전체 초기화</span>
                                <span className="text-sm text-red-400/70">모든 데이터를 삭제하고 시스템을 초기 상태로 되돌립니다.</span>
                            </button>
                        </div>
                    </div>

                    <ResetConfirmModal
                        isOpen={modalConfig.isOpen}
                        onClose={closeModal}
                        onConfirm={handleReset}
                        title={modalConfig.title}
                        warningText={modalConfig.warning}
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
