                    let duration = 0;
                    if (plannedTime && plannedTime.includes('~')) {
                        const [start, end] = plannedTime.split('~').map(t => t.trim());
                        if (start && end) {
                            const [sh, sm] = start.split(':').map(Number);
                            const [eh, em] = end.split(':').map(Number);
                            duration = (eh * 60 + em) - (sh * 60 + sm);
                        }
                    }

                    timeDisplay = `${eventDate} ${plannedTime} (${duration}분)`;
                    actionColor = 'red';

                } else if (h.action === '일정변경') {
                    const originalTime = details.original_time || '';
                    const changedTime = details.changed_time || '';
                    const eventDate = h.event_datetime ? h.event_datetime.substring(0, 10) : '';
                    const changedDate = details.changed_date || eventDate;

                    let originalDuration = 0;
                    let changedDuration = 0;

                    if (originalTime && originalTime.includes('~')) {
                        const [start, end] = originalTime.split('~').map(t => t.trim());
                        if (start && end) {
                            const [sh, sm] = start.split(':').map(Number);
                            const [eh, em] = end.split(':').map(Number);
                            originalDuration = (eh * 60 + em) - (sh * 60 + sm);
                        }
                    }

                    if (changedTime && changedTime.includes('~')) {
                        const [start, end] = changedTime.split('~').map(t => t.trim());
                        if (start && end) {
                            const [sh, sm] = start.split(':').map(Number);
                            const [eh, em] = end.split(':').map(Number);
                            changedDuration = (eh * 60 + em) - (sh * 60 + sm);
                        }
                    }

                    timeDisplay = `${eventDate} ${originalTime} (${originalDuration}분) → ${changedDate} ${changedTime} (${changedDuration}분)`;
                    actionColor = 'orange';

                } else if (h.action === '일정삭제') {
                    const plannedTime = details.planned_time || details.schedule_time || '';
                    const eventDate = h.event_datetime ? h.event_datetime.substring(0, 10) : '';

                    let duration = 0;
                    if (plannedTime && plannedTime.includes('~')) {
                        const [start, end] = plannedTime.split('~').map(t => t.trim());
                        if (start && end) {
                            const [sh, sm] = start.split(':').map(Number);
                            const [eh, em] = end.split(':').map(Number);
                            duration = (eh * 60 + em) - (sh * 60 + sm);
                        }
                    }

                    timeDisplay = `${eventDate} ${plannedTime} (${duration}분)`;
                    actionColor = 'slate';

                } else {
                    // Fallback for other action types
                    timeDisplay = formatDateTime(h.created_at || h.event_datetime);
                }

                const colorClasses = {
                    green: 'border-green-400 bg-green-50',
                    red: 'border-red-400 bg-red-50',
                    orange: 'border-orange-400 bg-orange-50',
                    blue: 'border-blue-400 bg-blue-50',
                    slate: 'border-slate-400 bg-slate-50'
                };

                const textColorClasses = {
                    green: 'text-green-700',
                    red: 'text-red-700',
                    orange: 'text-orange-700',
                    blue: 'text-blue-700',
                    slate: 'text-slate-700'
                };

                // Note from details
                const noteText = details.note || '';
                const eventDate = formatDateTime(h.created_at);

                return (
                    <div key={h.id} className={`border-l-4 ${colorClasses[actionColor]} px-3 py-2 rounded-r-lg transition-all hover:shadow-sm`}>
                        <div className="flex items-start gap-3 text-sm">
                            {/* Action Badge */}
                            <span className={`font-bold ${textColorClasses[actionColor]} min-w-[70px] text-xs whitespace-nowrap`}>
                                {h.action}
                            </span>

                            {/* Category Badge */}
                            {h.category === 'session_history' && <span className="text-[10px] bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded whitespace-nowrap">수업</span>}
                            {h.category === 'consultation_history' && <span className="text-[10px] bg-purple-100 text-purple-700 px-1.5 py-0.5 rounded whitespace-nowrap">상담</span>}

                            {/* Time Display */}
                            <div className="flex-1 min-w-0">
                                <span className="text-xs text-slate-600 break-words">{timeDisplay}</span>

                                {/* Note */}
                                {noteText && <div className="text-xs text-slate-500 bg-white/70 px-2 py-0.5 rounded mt-1">📝 {noteText}</div>}
                            </div>

                            {/* Event Date */}
                            <span className="text-xs text-slate-400 whitespace-nowrap">{eventDate}</span>
                        </div>
                    </div>
                );
            };

            const handleDelete = () => {
                if (verifyName !== client.name) return showToast('이름이 일치하지 않습니다.');
                // Direct call, no window.confirm
                onDelete(client.id);
            };

            const handleTerminate = () => {
                if (verifyName !== client.name) return showToast('이름이 일치하지 않습니다.');
                onUpdate({ ...client, status: 'terminated' });
                showToast(`수고하셨습니다 ${teacherName} 선생님`);
                setActionStep(null);
            };

            const handlePause = () => {
                if (verifyName !== client.name) return showToast('이름이 일치하지 않습니다.');
                onUpdate({ ...client, status: 'paused' });
                showToast('수업이 정지되었습니다.');
                setActionStep(null);
            };

            const handleResume = () => {
                onUpdate({ ...client, status: 'active' });
                showToast('수업이 재개되었습니다.');
                setActionStep(null);
            };

            const handleUnscheduledStart = async () => {
                if (checkIsMobile()) {
                    showToast("모바일에서는 수업이 불가능합니다.");
                    return;
                }

                const now = new Date();
                const startTime = now.toTimeString().slice(0, 5);
                const endDate = new Date(now.getTime() + (client.sessionTime || 50) * 60000);
                const endTime = endDate.toTimeString().slice(0, 5);

                const payload = {
                    teacher_id: client.teacherId,
                    client_id: client.id,
                    client_name: client.name,
                    type: client.type,
                    date: formatDateLocal(now),
                    start_time: startTime,
                    end_time: endTime,
                    status: 'scheduled'
                };

                const { data, error } = await supabase.from('schedules').insert([payload]).select();
                if (!error) {
                    const newSchedule = keysToCamel(data[0]);
                    setSchedules(prev => [...prev, newSchedule]);
                    onStartSession(newSchedule);
                    setShowStartModal(false);
                }
            };

            const tabs = [{ id: 'info', l: '정보' }];
            if (client.type === 'client') {
                tabs.push({ id: 'growth-report', l: '성장 리포트' });
                tabs.push({ id: 'history', l: '수업이력' });
            } else {
                tabs.push({ id: 'history', l: '상담이력' });
            }

            const getActionTitle = () => {
                switch (actionStep) {
                    case 'confirm_delete': return '삭제 확인:';
                    case 'confirm_pause': return '수업 정지 확인:';
                    case 'confirm_terminate': return '종결 확인:';
                    default: return '';
                }
            };

            const handleActionConfirm = async () => {
                if (verifyName !== client.name) return showToast('이름이 일치하지 않습니다.');

                if (actionStep === 'confirm_delete') {
                    handleDelete();
                    return;
                }

                // [MODIFIED] Use check box state instead of confirm dialog
                let deleteFuture = shouldDeleteFuture; // use state

                const newStatus = actionStep === 'confirm_terminate' ? 'terminated' : 'paused';

                // 1. Update Client Status
                await onUpdate({ ...client, status: newStatus });

                // 2. Delete Schedules if confirmed
                if (deleteFuture) {
                    const today = new Date().toISOString().split('T')[0];
                    const { error } = await supabase
                        .from('schedules')
                        .delete()
                        .eq('client_id', client.id)
                        .gte('date', today);

                    if (!error) {
                        // Update local schedule state
                        setSchedules(prev => prev.filter(s =>
                            !(s.clientId === client.id && s.date >= today)
                        ));
                        showToast('상태 변경 및 미래 일정이 삭제되었습니다.');
                    } else {
                        showToast('상태는 변경되었으나 일정 삭제 중 오류가 발생했습니다.');
                    }
                } else {
                    showToast('상태가 변경되었습니다.');
                }

                setActionStep(null);
                setVerifyName('');
            };

            return (
                <div className="flex flex-col h-full bg-white animate-fade-in relative">
                    <div className="p-6 border-b flex justify-between items-center sticky top-0 bg-white z-10">
                        <div className="flex items-center gap-4">
                            <button onClick={onClose}><ChevronLeft /></button>
                            <div className="flex items-center gap-2">
                                <h2 className={`text-2xl font-black ${(client.status === 'terminated' || client.status === 'paused') ? 'text-gray-400' : 'text-slate-900'}`}>{client.name}</h2>
                                {client.status === 'terminated' && <span className="bg-gray-200 text-gray-500 text-xs px-2 py-1 rounded font-bold">수업종결</span>}
                                {client.status === 'paused' && <span className="bg-orange-100 text-orange-600 text-xs px-2 py-1 rounded font-bold">수업정지</span>}
                            </div>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={onEdit} className="bg-slate-100 px-3 py-1.5 rounded-lg text-sm font-bold hover:bg-slate-200">수정</button>
                            <button onClick={onClose} className="p-1.5 hover:bg-slate-100 rounded-lg"><X size={20} /></button>
                        </div>
                    </div>
                    <div className="flex border-b px-6">{tabs.map(t => <button key={t.id} onClick={() => setActiveTab(t.id)} className={`px-6 py-4 font-bold border-b-2 ${activeTab === t.id ? 'border-[#FDE047]' : 'border-transparent text-slate-400'}`}>{t.l}</button>)}</div>
                    <div className="flex-1 overflow-y-auto p-8 pb-32">
                        {activeTab === 'info' && (
                            <div className="space-y-6">
                                <div className="bg-slate-50 p-6 rounded-2xl space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><span className="text-xs text-slate-400 font-bold block">연락처</span><p className="font-bold">{client.contact || '-'}</p></div>
                                        <div><span className="text-xs text-slate-400 font-bold block">생년월일 (나이)</span><p>{client.dob} (만 {client.age}세)</p></div>
                                        <div><span className="text-xs text-slate-400 font-bold block">기본 수업 시간</span><p>{client.sessionTime || 50}분</p></div>
                                        <div className="col-span-2"><span className="text-xs text-slate-400 font-bold block">주소</span><p>{client.address || '-'}</p></div>
                                    </div>
                                    <div className="border-t border-slate-200 pt-4">
                                        <span className="text-xs text-slate-400 font-bold block mb-2">보호자 정보</span>
                                        {client.guardians && client.guardians.map((g, i) => (
                                            <div key={i} className="flex gap-2 text-sm mb-1"><span className="font-bold w-16">{g.name}</span><span className="text-slate-500 w-10">({g.relation})</span><span>{g.contact}</span></div>
                                        ))}
                                    </div>
                                </div>
                                <div className="bg-slate-50 p-6 rounded-2xl space-y-4">
                                    <div className="flex justify-between border-b pb-2"><span className="text-slate-400 text-sm font-bold">진단명</span><span className="font-bold">{client.diagnosis}</span></div>
                                    <div className="border-b pb-2"><span className="text-slate-400 text-sm font-bold block mb-1">초기 상담</span><p className="text-sm">{client.initialConsult}</p></div>
                                    {client.areas && Object.entries(client.areas).map(([k, v]) => v.length > 0 && <div key={k} className="flex gap-2"><span className="font-bold text-sm w-10">{k}</span><div className="flex flex-wrap gap-1">{v.map(t => <span key={t} className="bg-white border px-2 rounded text-xs">{t}</span>)}</div></div>)}
                                    <div className="mt-4"><span className="text-slate-400 text-sm font-bold block mb-1">메모</span><p className="text-sm whitespace-pre-wrap">{client.memo}</p></div>
                                </div>

                                {/* Action Buttons Section - Fully custom UI, no window.confirm */}
                                <div className="pt-8 border-t border-slate-100">
                                    <div className="flex gap-2 items-center flex-wrap">
                                        {actionStep ? (
                                            <div className="flex items-center gap-2 w-full animate-fade-in bg-slate-50 p-2 rounded-lg border border-slate-200">
                                                <span className="text-sm font-bold text-slate-900 whitespace-nowrap">{getActionTitle()}</span>
                                                {(actionStep === 'confirm_terminate' || actionStep === 'confirm_pause') && (
                                                    <label className="flex items-center gap-2 text-xs font-bold text-slate-600 mx-2 cursor-pointer select-none">
                                                        <input type="checkbox" checked={shouldDeleteFuture} onChange={e => setShouldDeleteFuture(e.target.checked)} className="w-4 h-4 accent-slate-900 rounded" />
                                                        앞으로의 일정 삭제
                                                    </label>
                                                )}
                                                <input placeholder="이름 입력" value={verifyName} onChange={e => setVerifyName(e.target.value)} className="border p-2 rounded-lg text-sm flex-1 min-w-[100px]" />
                                                <button onClick={handleActionConfirm} className="bg-slate-900 text-white px-4 py-2 rounded-lg font-bold text-sm hover:bg-slate-700">확인</button>
                                                <button onClick={() => { setActionStep(null); setVerifyName('') }} className="bg-white border px-4 py-2 rounded-lg font-bold text-sm">취소</button>
                                            </div>
                                        ) : (
                                            <>
                                                <button onClick={() => setActionStep('confirm_delete')} className="bg-red-100 text-red-700 px-4 py-2 rounded-lg font-bold text-sm hover:bg-red-200">삭제</button>
                                                {client.type === 'client' && (
                                                    <>
                                                        {client.status === 'paused' || client.status === 'terminated' ? (
                                                            <button onClick={handleResume} className="bg-green-100 text-green-700 px-4 py-2 rounded-lg font-bold text-sm hover:bg-green-200">수업 재개</button>
                                                        ) : (
                                                            <button onClick={() => setActionStep('confirm_pause')} className="bg-orange-100 text-orange-700 px-4 py-2 rounded-lg font-bold text-sm hover:bg-orange-200">수업 정지</button>
                                                        )}

                                                        {client.status !== 'terminated' && (
                                                            <button onClick={() => setActionStep('confirm_terminate')} className="bg-slate-200 text-slate-700 px-4 py-2 rounded-lg font-bold text-sm hover:bg-slate-300">수업 종결</button>
                                                        )}
                                                    </>
                                                )}
                                                {client.type === 'reserve' && (
                                                    <button onClick={() => onConvert(client)} className="bg-purple-100 text-purple-700 px-4 py-2 rounded-lg font-bold text-sm hover:bg-purple-200">정규 내담자로 등록</button>
                                                )}
                                            </>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* GROWTH REPORT TAB */}
                        {activeTab === 'growth-report' && client.type === 'client' && (
                            <GrowthReportTab client={client} user={user} />
                        )}

                        {activeTab === 'history' && (
                            <div className="space-y-6">
                                {/* Session Time Stats (for regular clients only) */}
                                {client.type === 'client' && (
                                    <div className="bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-200 rounded-xl p-6">
                                        <h3 className="font-bold text-lg text-slate-800 mb-4">수업시간 통계</h3>
                                        <div className="grid grid-cols-3 gap-4">
                                            <div className="text-center">
                                                <p className="text-sm text-slate-600 mb-1">주간 수업시간</p>
                                                <p className="font-bold text-xl text-blue-600">{formatMinutes(sessionStats.weeklyMinutes || 0)}</p>
                                            </div>
                                            <div className="text-center">
                                                <p className="text-sm text-slate-600 mb-1">월간 수업시간</p>
                                                <p className="font-bold text-xl text-indigo-600">{formatMinutes(sessionStats.monthlyMinutes || 0)}</p>
                                            </div>
                                            <div className="text-center">
                                                <p className="text-sm text-slate-600 mb-1">총 수업시간</p>
                                                <p className="font-bold text-xl text-purple-600">{formatMinutes(sessionStats.totalMinutes || 0)}</p>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* History List */}
                                {/* History List UI - Enhanced */}
                                <div className="space-y-4">
                                    {/* Month Navigation & Filters */}
                                    <div className="bg-slate-50 p-4 rounded-xl flex flex-col gap-4">
                                        {/* Month Nav */}
                                        <div className="flex items-center justify-between bg-white p-2 rounded-lg border shadow-sm">
                                            <button
                                                onClick={() => {
                                                    const newDate = new Date(historyYear, historyMonth - 2, 1);
                                                    setHistoryYear(newDate.getFullYear());
                                                    setHistoryMonth(newDate.getMonth() + 1);
                                                }}
                                                className="p-2 hover:bg-slate-50 rounded-lg text-slate-600"
                                            >
                                                <ChevronLeft size={20} />
                                            </button>
                                            <span className="font-black text-lg text-slate-800">{historyYear}년 {String(historyMonth).padStart(2, '0')}월</span>
                                            <button
                                                onClick={() => {
                                                    const newDate = new Date(historyYear, historyMonth, 1);
                                                    setHistoryYear(newDate.getFullYear());
                                                    setHistoryMonth(newDate.getMonth() + 1);
                                                }}
                                                className="p-2 hover:bg-slate-50 rounded-lg text-slate-600"
                                            >
                                                <ChevronRight size={20} />
                                            </button>
                                        </div>

                                        {/* Filters */}
                                        <div className="flex flex-col md:flex-row gap-3">
                                            <div className="flex-1">
                                                <select
                                                    value={historyCategory}
                                                    onChange={e => setHistoryCategory(e.target.value)}
                                                    className="w-full p-2 border rounded-lg text-sm bg-white font-bold text-slate-700"
                                                >
                                                    <option value="all">전체 카테고리</option>
                                                    <option value="session">수업 이력</option>
                                                    <option value="consultation">상담 이력</option>
                                                </select>
                                            </div>
                                            <div className="flex-[2] relative">
                                                <Search className="absolute left-3 top-2.5 text-slate-400" size={16} />
                                                <input
                                                    type="text"
                                                    placeholder="내용 검색 (제목, 메모 등)"
                                                    value={historyFilterTitle}
                                                    onChange={e => setHistoryFilterTitle(e.target.value)}
                                                    className="w-full pl-9 pr-3 py-2 border rounded-lg text-sm"
                                                />
                                            </div>
                                        </div>
                                    </div>

                                    {/* List */}
                                    <div className="space-y-3 pb-20">
                                        {(() => {
                                            let list = client.type === 'client' ? displayAllHistories : displayConsultationHistories;

                                            // Additional Category Filter here (since displayAllHistories is already merged)
                                            if (historyCategory === 'session') list = list.filter(h => h.category === 'session_history');
                                            if (historyCategory === 'consultation') list = list.filter(h => h.category === 'consultation_history');

                                            if (list.length === 0) {
                                                return (
                                                    <div className="text-center py-10 bg-slate-50 rounded-xl border border-dashed border-slate-300">
                                                        <p className="text-slate-400 mb-2">이력이 없습니다.</p>
                                                        <p className="text-xs text-slate-400">{historyYear}년 {historyMonth}월 활동이 없습니다.</p>
                                                    </div>
                                                );
                                            }
                                            return list.map(renderHistoryItem);
                                        })()}
                                    </div>
                                </div>

                                {/* Floating Start Button for History Tab */}
                                {client.status !== 'terminated' && client.status !== 'paused' && client.status !== 'deleted' && (
                                    <button
                                        onClick={() => setShowStartModal(true)}
                                        className="absolute bottom-10 right-8 bg-[#FDE047] text-slate-900 px-6 py-3 rounded-full font-bold shadow-lg flex items-center gap-2 hover:scale-105 transition z-20"
                                    >
                                        <Play size={20} fill="#1e293b" /> {client.type === 'reserve' ? '상담 시작' : '수업 시작'}
                                    </button>
                                )}
                            </div>
                        )}
                    </div>

                    {/* Floating Action Button */}
                    {client.status !== 'terminated' && client.status !== 'paused' && client.status !== 'deleted' && (
                        <button
                            onClick={() => setShowStartModal(true)}
                            className="absolute bottom-10 right-8 bg-[#FDE047] text-slate-900 px-6 py-3 rounded-full font-bold shadow-lg flex items-center gap-2 hover:scale-105 transition z-20"
                        >
                            <Play size={20} fill="#1e293b" /> {client.type === 'reserve' ? '상담 시작' : '수업 시작'}
                        </button>
                    )}

                    {/* Unscheduled Start Modal */}
                    {showStartModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4" onClick={() => setShowStartModal(false)}>
                            <div className="bg-white rounded-2xl w-full max-w-[400px] p-6 shadow-2xl animate-fade-in text-center" onClick={e => e.stopPropagation()}>
                                <div className="w-12 h-12 bg-yellow-100 text-yellow-600 rounded-full flex items-center justify-center mx-auto mb-4"><Play size={24} fill="#ca8a04" /></div>
                                <h3 className="font-bold text-xl mb-2">{client.type === 'reserve' ? '상담 바로 시작' : '수업 바로 시작'}</h3>
                                <p className="text-slate-500 text-sm mb-6">스케줄에 없는 {client.type === 'reserve' ? '상담' : '수업'}을 시작하시겠습니까?<br />확인 시 {client.type === 'reserve' ? '상담' : '수업'} 이력에 자동으로 기록됩니다.</p>
                                <div className="flex gap-2">
                                    <button onClick={() => setShowStartModal(false)} className="flex-1 py-3 border rounded-xl font-bold text-slate-600">취소</button>
                                    <button onClick={handleUnscheduledStart} className="flex-1 py-3 bg-[#FDE047] rounded-xl font-bold text-slate-900">시작하기</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            )
        }

        // [REFACTOR v1.0.5] PlanInfoModal 컴포넌트 제거

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
