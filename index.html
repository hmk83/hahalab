        const toCamel = (s) => s.replace(/([-_][a-z])/ig, ($1) => $1.toUpperCase().replace('-', '').replace('_', ''));
        const toSnake = (s) => s.replace(/[A-Z]/g, letter => `_${letter.toLowerCase()}`);

        const keysToCamel = (o) => {
            if (o === Object(o) && !Array.isArray(o) && typeof o !== 'function') {
                const n = {};
                Object.keys(o).forEach((k) => {
                    n[toCamel(k)] = keysToCamel(o[k]);
                });
                return n;
            } else if (Array.isArray(o)) {
                return o.map((i) => keysToCamel(i));
            }
            return o;

            const days = ['일', '월', '화', '수', '목', '금', '토'];

        };

        const calculateDuration = (start, end) => {
            const [sh, sm] = start.split(':').map(Number);
            const [eh, em] = end.split(':').map(Number);
            return (eh * 60 + em) - (sh * 60 + sm);
        };

        const formatDateLocal = (date) => {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const calculateAge = (dob) => {
            if (!dob) return '';
            const today = new Date();
            const birthDate = new Date(dob);
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            return age;
        };

        const getChosung = (str) => {
            const CHO = [
                'ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ',
                'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'
            ];
            if (!str) return '#';
            const code = str.charCodeAt(0) - 44032;
            if (code > -1 && code < 11172) return CHO[Math.floor(code / 588)];
            return '#';
        };

                        const parsedUser = JSON.parse(stored);

                        console.error("Session Parse Error", e);
                        localStorage.removeItem('haha_lab_session');
                    }
                }

                // 2. Real-time Subscription for reduced latency security

                    .channel('public:teachers')
                    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'teachers' }, (payload) => {
                        // Check if update is for current user
                        setUser(currentUser => {
                            if (currentUser && payload.new.id === currentUser.id) {
                                // 계정 정지/삭제 처리
                                if (payload.new.status === 'suspended' || payload.new.status === 'deleted') {

                                }

                                // 다른 모든 필드 변경 실시간 반영 (grade, plan 등)
                                const updatedUser = keysToCamel(payload.new);
                                localStorage.setItem('haha_lab_session', JSON.stringify(updatedUser));
                                console.log('✅ 선생님 정보 실시간 업데이트:', updatedUser);
                                return updatedUser;
                            }
                            return currentUser;
                        });
                    })
                    .subscribe();

                // [NEW] 3. Heartbeat - Update last_seen every 60 seconds
                const heartbeatInterval = setInterval(() => {
                    const currentStored = localStorage.getItem('haha_lab_session');
                    if (currentStored) {
                        try {
                            const currentUser = JSON.parse(currentStored);
                            supabase.from('teachers').update({ last_seen: new Date().toISOString() }).eq('id', currentUser.id);
                        } catch (e) {
                            console.error("Heartbeat Error", e);
                        }
                    }
                }, 60000); // 60 seconds

                return () => {
                    supabase.removeChannel(subscription);
                    clearInterval(heartbeatInterval);
                };
            }, []);

            // [REFACTOR v1.0.5] 내담자 수 제한 체크 (max_client_limit 기반)
            const [showOverLimitModal, setShowOverLimitModal] = useState(null);
            const [initialDashboardView, setInitialDashboardView] = useState(null);

            useEffect(() => {
                const checkClientLimit = async () => {
                    const stored = localStorage.getItem('haha_lab_session');
                    if (!stored) return;

                    try {
                        const currentUser = JSON.parse(stored);

                        // 최신 선생님 정보 조회
                        const { data: teacher, error: teacherError } = await supabase
                            .from('teachers')
                            .select('*')
                            .eq('id', currentUser.id)
                            .single();

                        if (teacherError || !teacher) {
                            console.error('선생님 정보 조회 실패:', teacherError);
                            return;
                        }

                        // 실제 활성 내담자 수 조회 (정지 제외)
                        const { count: actualCount, error: countError } = await supabase
                            .from('clients')
                            .select('*', { count: 'exact', head: true })
                            .eq('teacher_id', teacher.teacher_id)
                            .neq('status', 'deleted')
                            .neq('status', 'suspended'); // [REFACTOR v1.0.5] 정지 상태 제외

                        if (countError) {
                            console.error('내담자 수 조회 실패:', countError);
                            return;
                        }

                        // max_client_limit 기반 제한 수 (기본값 40)
                        const maxLimit = teacher.max_client_limit || 40;

                        console.log(`🔍 내담자 수 체크 - 현재: ${actualCount}명 / 제한: ${maxLimit}명`);

                        // 초과 여부 확인
                        if (actualCount > maxLimit) {
                            console.warn(`⚠️ 내담자 수 초과 감지: ${actualCount} > ${maxLimit}`);
                            setShowOverLimitModal({
                                show: true,
                                actualCount,
                                maxLimit
                            });
                        }

                        // localStorage 세션 업데이트
                        const updatedSession = {
                            ...currentUser,
                            max_client_limit: teacher.max_client_limit,
                            actual_client_count: actualCount
                        };
                        localStorage.setItem('haha_lab_session', JSON.stringify(updatedSession));

                    } catch (e) {
                        console.error('내담자 수 체크 오류:', e);
                    }
                };

                // 초기 체크 (로그인 시)
                if (user) {
                    checkClientLimit();
                }

                // 60분 타이머 설정
                const interval = setInterval(() => {
                    if (user) {
                        checkClientLimit();
                    }
                }, 60 * 60 * 1000); // 60분

                return () => clearInterval(interval);
            }, [user]);

            // Data fetching for User-Specific Data
            useEffect(() => {
                if (user && view === 'dashboard') {
                    fetchClients();
                    fetchSchedules();

                    // Clients 실시간 구독
                    const clientsChannel = supabase
                        .channel(`clients:teacher_${user.teacherId}`)
                        .on('postgres_changes', {
                            event: '*',
                            schema: 'public',
                            table: 'clients',
                            filter: `teacher_id=eq.${user.teacherId}`
                        }, (payload) => {
                            if (payload.eventType === 'INSERT') {
                                setClients(prev => [...prev, keysToCamel(payload.new)].sort((a, b) => a.name.localeCompare(b.name)));
                                console.log('✅ 내담자 추가:', payload.new);
                            } else if (payload.eventType === 'UPDATE') {
                                setClients(prev => prev.map(c => c.id === payload.new.id ? keysToCamel(payload.new) : c));
                                console.log('✅ 내담자 수정:', payload.new);
                            } else if (payload.eventType === 'DELETE') {
                                setClients(prev => prev.filter(c => c.id !== payload.old.id));
                                console.log('✅ 내담자 삭제:', payload.old);
                            }
                        })
                        .subscribe();

                    // Schedules 실시간 구독
                    const schedulesChannel = supabase
                        .channel(`schedules:teacher_${user.teacherId}`)
                        .on('postgres_changes', {
                            event: '*',
                            schema: 'public',
                            table: 'schedules',
                            filter: `teacher_id=eq.${user.teacherId}`
                        }, (payload) => {
                            if (payload.eventType === 'INSERT') {
                                setSchedules(prev => [...prev, keysToCamel(payload.new)].sort((a, b) => a.date.localeCompare(b.date)));
                                console.log('✅ 일정 추가:', payload.new);
                            } else if (payload.eventType === 'UPDATE') {
                                setSchedules(prev => prev.map(s => s.id === payload.new.id ? keysToCamel(payload.new) : s));
                                console.log('✅ 일정 수정:', payload.new);
                            } else if (payload.eventType === 'DELETE') {
                                setSchedules(prev => prev.filter(s => s.id !== payload.old.id));
                                console.log('✅ 일정 삭제:', payload.old);
                            }
                        })
                        .subscribe();

                    return () => {
                        supabase.removeChannel(clientsChannel);
                        supabase.removeChannel(schedulesChannel);
                    };
                }
            }, [user, view]);

            const fetchClients = async () => {
                const { data, error } = await supabase
                    .from('clients')
                    .select('*')
                    .eq('teacher_id', user.teacherId)
                    .order('name', { ascending: true });
                if (!error) setClients(keysToCamel(data) || []); // [FIX] Defensive null check
            };

            const fetchSchedules = async () => {
                const { data, error } = await supabase
                    .from('schedules')
                    .select('*')
                    .eq('teacher_id', user.teacherId)
                    .order('date', { ascending: true });
                if (!error) setSchedules(keysToCamel(data) || []); // [FIX] Defensive null check
            };

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            const showToast = (message) => {
                setToast(message);
                setTimeout(() => setToast(null), 3000);
            };

            const handleSessionEndRequest = () => {
                setShowExitConfirm(true);
            };

            const confirmSessionEnd = async () => {
                if (currentSession) {
                    try {
                        const now = new Date();
                        const nowStr = now.toTimeString().slice(0, 5);

                        // Calculate duration
                        let duration = 0;
                        const startStr = currentSession.actualStartTime || currentSession.startTime;
                        if (startStr) {
                            const [h, m] = startStr.split(':').map(Number);
                            const startDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m);
                            duration = Math.floor((now - startDate) / 60000);
                            if (duration < 0) duration = 0;
                        }

                        // 1. Update Schedule Status
                        const { error: scheduleError } = await supabase.from('schedules').update({
                            status: 'completed',
                            actual_end_time: nowStr
                        }).eq('id', currentSession.id);

                        if (scheduleError) throw scheduleError;

                        // 2. Insert History Record
                        const historyPayload = {
                            client_id: currentSession.clientId,
                            teacher_id: user.teacherId,
                            category: currentSession.type === 'client' ? 'session_history' : 'consultation_history',
                            action: currentSession.type === 'client' ? '수업완료' : '상담완료',
                            details: JSON.stringify({
                                schedule_id: currentSession.id,
                                planned_time: `${currentSession.startTime} ~ ${currentSession.endTime}`,
                                actual_start_time: startStr,
                                actual_end_time: nowStr,
                                duration_minutes: duration
                            }),
                            event_datetime: `${formatDateLocal(now)} ${nowStr}`,
                            duration_minutes: duration, // Use correct column name
                            client_name: currentSession.clientName, // [FIX] Add client_name
                            type: currentSession.type // [FIX] Add type
                        };

                        const { error: historyError } = await supabase.from('histories').insert([historyPayload]);

                        if (historyError) {
                            throw historyError;
                        }

                        // 3. Update UI State (Sync)
                        setSchedules(prev => prev.map(s => s.id === currentSession.id ? { ...s, status: 'completed', actualEndTime: nowStr } : s));
                        showToast('세션이 종료되고 이력이 저장되었습니다.');

                    } catch (err) {
                        console.error('Session End Error:', err);
                        showToast('세션 종료 처리 중 오류 발생: ' + err.message);
                    }
                }
                setCurrentSession(null);
                setView('dashboard');
                setShowExitConfirm(false);
            };

            const handleUpdateClientWrapper = (updatedClient) => {
                setClients(prev => prev.map(c => c.id === updatedClient.id ? updatedClient : c));
            };

            const handleDeleteSchedule = (id) => {
                setConfirmModal({
                    message: "일정을 삭제하시겠습니까?",
                    onConfirm: async () => {
                        const { error } = await supabase.from('schedules').delete().eq('id', id);
                        if (!error) {
                            setSchedules(prev => prev.filter(s => s.id !== id));
                            showToast('일정이 삭제되었습니다(기록 보존)');
                        } else {
                            showToast('일정 삭제 실패: ' + error.message);
                        }
                    }
                });
            };

            const handleLogout = () => {
                // [MODIFIED] Clear session from localStorage
                localStorage.removeItem('haha_lab_session');
                setShowProfileModal(false);
                setUser(null);
                setView('intro');
            };

            const handleLoginSuccess = (loggedInUser) => {
                // [MODIFIED] Save session to localStorage
                localStorage.setItem('haha_lab_session', JSON.stringify(loggedInUser));
                setUser(loggedInUser);
                setView('dashboard');
                showToast(`안녕하세요 ${loggedInUser.name} 선생님. 오늘도 좋은 하루보내세요.`);
            };

            if (view === 'intro') return <IntroView onLogin={handleLoginSuccess} />;

            return (
                <div className="w-full h-screen bg-[#FDE047] text-slate-900 font-sans overflow-hidden flex flex-col relative">
                    <GNB
                        user={user}
                        isSession={view === 'session' && currentSession?.type === 'client'}
                        sessionData={currentSession}
                        onExitSession={handleSessionEndRequest}
                        onOpenSettings={() => setShowSettings(true)}
                        onLogoClick={() => {
                            if (view === 'session' && currentSession?.type === 'client') handleSessionEndRequest();
                            else {
                                setView('dashboard');
                                setDashboardKey(prev => prev + 1);
                                setCurrentSession(null);
                            }
                        }}
                        onNoticeClick={() => setView('notice')}
                        onProfileClick={() => setShowProfileModal(true)}
                    />

                    <div className="flex-1 flex overflow-hidden relative bg-white">
                        {view === 'dashboard' ? (
                            <Dashboard
                                key={dashboardKey}
                                clients={clients}
                                setClients={setClients}
                                schedules={schedules}
                                setSchedules={setSchedules}
                                currentTime={currentTime}
                                settings={settings}
                                initialView={initialDashboardView}
                                onInitialViewHandled={() => setInitialDashboardView(null)}
                                onStartSession={async (schedule) => {
                                    // [NEW] Date Blocking Logic
                                    const todayStr = formatDateLocal(new Date());
                                    const scheduleDateStr = schedule.date; // "YYYY-MM-DD"

                                    if (scheduleDateStr !== todayStr) {
                                        showToast("상담은 당일에만 시작할 수 있습니다.");
                                        return;
                                    }

                                    // [MODIFIED] Update DB status to 'in-progress' and set actual_start_time
                                    const nowStr = new Date().toTimeString().slice(0, 5);
                                    await supabase.from('schedules').update({
                                        status: 'in-progress',
                                        actual_start_time: nowStr
                                    }).eq('id', schedule.id);

                                    setCurrentSession({ ...schedule, actualStartTime: nowStr });
                                    setView('session');
                                }}
                                showToast={showToast}
                                user={user}
                                onDeleteSchedule={handleDeleteSchedule}
                                setConfirmModal={setConfirmModal}
                            />
                        ) : view === 'session' ? (
                            currentSession?.type === 'reserve' ? (
                                <ConsultationMode
                                    session={currentSession}
                                    client={clients.find(c => c.id === currentSession.clientId)}
                                    onExit={handleSessionEndRequest}
                                    onUpdateClient={handleUpdateClientWrapper}
                                    showToast={showToast}
                                />
                            ) : (
                                <SessionMode
                                    session={currentSession}
                                    onExit={handleSessionEndRequest}
                                />
                            )
                        ) : view === 'notice' ? (
                            <NoticePage onBack={() => setView('dashboard')} />
                        ) : null}
                    </div>

                    {showSettings && <SettingsModal settings={settings} setSettings={setSettings} onClose={() => setShowSettings(false)} />}

                    {showProfileModal && (
                        <ProfileModal
                            user={user}
                            onClose={() => setShowProfileModal(false)}
                            onLogout={handleLogout}
                        />
                    )}

                    {/* [REFACTOR v1.0.5] 내담자 수 제한 초과 모달 - 간결하게 수정 */}
                    {showOverLimitModal?.show && (
                        <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-black/50 p-4" onClick={() => setShowOverLimitModal(null)}>
                            <div className="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl relative" onClick={e => e.stopPropagation()}>
                                <div className="flex items-start gap-4 mb-6">
                                    <div className="bg-red-100 p-3 rounded-full">
                                        <svg className="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                                        </svg>
                                    </div>
                                    <div className="flex-1">
                                        <h3 className="text-2xl font-bold mb-2 text-gray-900">내담자 수 제한 초과</h3>
                                        <p className="text-gray-600 mb-4">
                                            현재 등록된 활성 내담자 수가 최대 등록 가능 수를 초과했습니다.
                                        </p>
                                        <div className="bg-gray-100 p-4 rounded-xl mb-4">
                                            <div className="flex justify-between items-center">
                                                <span className="text-sm text-gray-600">활성 내담자 수:</span>
                                                <span className="text-2xl font-black text-red-600">{showOverLimitModal.actualCount}명</span>
                                            </div>
                                            <div className="flex justify-between items-center mt-2">
                                                <span className="text-sm text-gray-600">최대 등록 가능 수:</span>
                                                <span className="text-2xl font-black text-gray-900">{showOverLimitModal.maxLimit}명</span>
                                            </div>
                                            <div className="flex justify-between items-center mt-2 pt-2 border-t border-gray-300">
                                                <span className="text-sm font-bold text-gray-900">초과 인원:</span>
                                                <span className="text-2xl font-black text-red-600">+{showOverLimitModal.actualCount - showOverLimitModal.maxLimit}명</span>
                                            </div>
                                        </div>
                                        <p className="text-sm text-gray-700 mb-4">
                                            ⚠️ 초과한 내담자를 <span className="font-bold">정지 처리</span>하거나 관리자에게 문의해주세요.
                                            <br />
                                            관리자 문의: <span className="font-bold">010-8416-3323</span> (카톡/문자)
                                        </p>
                                    </div>
                                </div>
                                <div className="flex gap-3">
                                    <button
                                        onClick={() => setShowOverLimitModal(null)}
                                        className="flex-1 py-3 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-bold transition"
                                    >
                                        확인
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showExitConfirm && (
                        <SessionExitModal
                            onClose={() => setShowExitConfirm(false)}
                            onConfirm={confirmSessionEnd}
                            sessionType={currentSession?.type}
                            correctPassword={user?.password}
                        />
                    )}

                    {toast && <ToastNotification message={toast} />}

                    {confirmModal && (
                        <ConfirmModal
                            isOpen={true}
                            message={confirmModal.message}
                            onConfirm={() => {
                                if (confirmModal.onConfirm) confirmModal.onConfirm();
                                setConfirmModal(null);
                            }}
                            onCancel={() => setConfirmModal(null)}
                            isAlert={confirmModal.isAlert}
                        />
                    )}
                </div>
            );
        }

        // [NEW] Confirm Modal Component
        function ConfirmModal({ isOpen, message, onConfirm, onCancel, isAlert }) {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4 animate-fade-in" onClick={onCancel}>
                    <div className="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl" onClick={e => e.stopPropagation()}>
                        <h3 className="font-bold text-lg mb-2">확인</h3>
                        <p className="text-slate-600 text-sm mb-6 whitespace-pre-wrap">{message}</p>
                        <div className="flex gap-2">
                            {!isAlert && <button onClick={onCancel} className="flex-1 py-3 border rounded-xl font-bold text-slate-600 hover:bg-slate-50">취소</button>}
                            <button onClick={onConfirm} className="flex-1 py-3 bg-slate-900 text-white rounded-xl font-bold hover:bg-slate-800">확인</button>
                        </div>
                    </div>
                </div>
            );
        }

        // 4. Toast Notification Component
        function ToastNotification({ message }) {
            return (
                <div className="fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-4 rounded-xl shadow-2xl animate-fade-in z-50 flex items-center gap-3 min-w-[300px] max-w-[90vw]">
                    <div className="bg-[#FDE047] p-2 rounded-full text-slate-900 shrink-0">
                        <Bell size={18} />
                    </div>
                    <div>
                        <p className="font-bold text-sm">알림</p>
                        <p className="text-sm text-slate-300 break-words">{message}</p>
                    </div>
                </div>
            );
        }

        // 1. INTRO & LOGIN INTEGRATED (Modified)
        function IntroView({ onLogin }) {
            const [progress, setProgress] = useState(0);
            const [showLogin, setShowLogin] = useState(false);
            const [showSignUp, setShowSignUp] = useState(false);
            const [toast, setToast] = useState(null);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3000);
            };

            // Login State
            const [id, setId] = useState(() => localStorage.getItem('haha_remember_id') || '');
            const [pw, setPw] = useState('');
            const [remember, setRemember] = useState(() => !!localStorage.getItem('haha_remember_id'));
            const [error, setError] = useState(false);
            const [loading, setLoading] = useState(false);
            const [suspendMsg, setSuspendMsg] = useState(null);

            // Intro Animation
            useEffect(() => {
                const timer = setInterval(() => setProgress(p => p >= 100 ? 100 : p + 2), 30);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                if (progress >= 100) {
                    setTimeout(() => setShowLogin(true), 500);
                }
            }, [progress]);

            const handleAuth = async () => {
                if (!id || !pw) return;
                setLoading(true);
                setError(false);
                setSuspendMsg(null);

                try {
                    const { data, error } = await supabase
                        .from('teachers')
                        .select('*')
                        .eq('teacher_id', id)
                        .eq('password', pw)
                        .maybeSingle();

                    if (error || !data) {
                        setError(true);
                        setPw('');
                    } else {
                        if (data.status === 'suspended' || data.status === 'paused') {
                            setSuspendMsg({
                                title: "사용 정지된 계정입니다.",
                                desc: "관리자에 문의하세요.\n010-8416-3323 카톡 또는 문자로 문의 부탁드립니다."
                            });
                        } else {
                            // Remember ID Logic
                            if (remember) {
                                localStorage.setItem('haha_remember_id', id);
                            } else {
                                localStorage.removeItem('haha_remember_id');
                            }
                            onLogin(keysToCamel(data));
                        }
                    }
                } catch (e) {
                    console.error(e);
                    setError(true);
                } finally {
                    setLoading(false);
                }
            };

            if (showSignUp) {
                return <SignUpView onCancel={() => setShowSignUp(false)} showToast={showToast} />;
            }

            return (
                <div className="w-full h-screen bg-[#FDE047] flex flex-col items-center justify-center animate-fade-in relative transition-all duration-500">
                    {toast && <ToastNotification message={toast} />}
                    <div className={`flex flex-col items-center transition-all duration-500 ${showLogin ? 'mb-8' : 'mb-12'}`}>
                        <div className="text-5xl md:text-6xl font-black mb-4 tracking-tighter animate-bounce-custom cursor-default select-none">HAHA LAB</div>
                        <p className="text-lg md:text-xl font-medium animate-pulse text-center px-4 cursor-default select-none">즐거운 배움이 시작되는 곳</p>
                    </div>

                    {!showLogin ? (
                        <>
                            <div className="w-48 md:w-64 h-1 bg-yellow-600/20 rounded-full overflow-hidden mb-2">
                                <div className="h-full bg-slate-900 transition-all duration-100 ease-linear" style={{ width: `${progress}%` }} />
                            </div>
                            <p className="text-sm font-bold text-slate-900">{progress}%</p>
                        </>
                    ) : (
                        <div className="w-full max-w-xs animate-fade-in px-4">
                            {suspendMsg ? (
                                <div className="bg-red-50 border border-red-200 rounded-xl p-4 mb-6 text-left animate-fade-in shadow-lg">
                                    <div className="flex items-center gap-2 mb-2 text-red-600 font-bold">
                                        <AlertCircle size={20} />
                                        <span>{suspendMsg.title}</span>
                                    </div>
                                    <p className="text-sm text-slate-600 whitespace-pre-wrap leading-relaxed">
                                        {suspendMsg.desc}
                                    </p>
                                    <button onClick={() => setSuspendMsg(null)} className="mt-4 w-full py-2 bg-red-100 text-red-700 font-bold rounded-lg text-sm hover:bg-red-200">확인</button>
                                </div>
                            ) : (
                                <div className="bg-white/20 backdrop-blur-sm p-6 rounded-2xl shadow-xl border border-white/30">
                                    <div className="space-y-4">

        // 3. GNB (with real-time session timer)
        function GNB({ user, isSession, sessionData, onExitSession, onOpenSettings, onLogoClick, onNoticeClick, onProfileClick }) {
            const [elapsedTime, setElapsedTime] = useState(0);

            useEffect(() => {
                if (!isSession || !sessionData) {
                    setElapsedTime(0);
                    return;
                }

                // Calculate session start time
                // [MODIFIED] Use actualStartTime if available for 0-based counting from start
                const baseTime = sessionData.actualStartTime || sessionData.startTime;
                const startTime = new Date(`${sessionData.date}T${baseTime}`);

                // Update elapsed time every second
                const timer = setInterval(() => {
                    const now = new Date();
                    const elapsed = Math.floor((now - startTime) / 1000); // in seconds
                    setElapsedTime(elapsed >= 0 ? elapsed : 0);
                }, 1000);

                return () => clearInterval(timer);
            }, [isSession, sessionData]);

            const formatElapsedTime = (seconds) => {
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = seconds % 60;
                return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            return (
                <header className="h-16 bg-[#FDE047] border-b border-yellow-500/30 flex items-center justify-between px-4 md:px-6 shrink-0 z-20 shadow-sm">

                                <span className="font-mono font-black text-sm md:text-lg text-red-600">
                                    {formatElapsedTime(elapsedTime)}
                                </span>
                            </div>
                        )}
                    </div>
                    <div className="flex items-center gap-2 md:gap-4">
                        {isSession ?
                            null
                            :
                            <>
                                <div onClick={onProfileClick} className="flex items-center gap-2 bg-white/30 px-3 py-1.5 rounded-full cursor-pointer hover:bg-white/50 transition">

        // 4. DASHBOARD
        function Dashboard({ clients, setClients, schedules, setSchedules, currentTime, settings, onStartSession, showToast, user, onDeleteSchedule, setConfirmModal, initialView, onInitialViewHandled }) {
            // [CRITICAL FIX] Ensure schedules and clients are always arrays to prevent crashes
            const safeSchedules = Array.isArray(schedules) ? schedules : [];
            const safeClients = Array.isArray(clients) ? clients : [];

            const [rightPanel, setRightPanel] = useState({ type: 'calendar' });
            const [dragItem, setDragItem] = useState(null);
            const [showScheduleModal, setShowScheduleModal] = useState(false);
            const [selectedDateForSchedule, setSelectedDateForSchedule] = useState(null);
            const [prefilledData, setPrefilledData] = useState(null);
            const [conflictData, setConflictData] = useState(null);
            const [mobileTab, setMobileTab] = useState('schedule');
            // [REFACTOR v1.0.5] showPlanModal 제거

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape') {
                        if (showScheduleModal) setShowScheduleModal(false);
                        else if (conflictData) setConflictData(null);
                        else if (rightPanel.type !== 'calendar') setRightPanel({ type: 'calendar' });
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [showScheduleModal, conflictData, rightPanel]);

            // [NEW] Handle initialView prop
            useEffect(() => {
                if (initialView) {
                    setRightPanel({ type: initialView });
                    if (onInitialViewHandled) {
                        onInitialViewHandled();
                    }
                }
            }, [initialView]);

            // Create Client in DB
            const handleCreateClient = async (data) => {
                const payload = {
                    ...data,
                    teacher_id: user.teacherId,
                    // Ensure all numeric fields are valid integers or null (fix: "invalid input syntax for type integer")
                    session_time: data.sessionTime ? parseInt(data.sessionTime) : 50,
                    age: data.age ? parseInt(data.age) : null
                };

                // Remove empty strings from payload to prevent DB errors
                Object.keys(payload).forEach(key => {
                    if (payload[key] === '') {
                        payload[key] = null;
                    }
                });

                // keysToSnake를 사용하여 DB 컬럼명에 맞게 변환
                const dbPayload = keysToSnake(payload);

                const { data: inserted, error } = await supabase.from('clients').insert([dbPayload]).select();
                if (!error) {
                    setClients([...clients, keysToCamel(inserted[0])]);
                    setRightPanel({ type: 'calendar' });
                    showToast('내담자가 등록되었습니다.');
                } else {
                    console.error("Supabase Error:", error);
                    showToast('등록 실패: ' + error.message);
                }
            };

            // Update Client in DB
            const handleUpdateClient = async (updatedClient) => {
                const payload = keysToSnake(updatedClient);
                const { error } = await supabase.from('clients').update(payload).eq('id', updatedClient.id);
                if (!error) {
                    setClients(clients.map(c => c.id === updatedClient.id ? updatedClient : c));
                    setRightPanel({ type: 'detail', client: updatedClient });
                    showToast('정보가 수정되었습니다.');
                }
            };

            const handleSaveClient = (data) => {
                if (data.id) {
                    handleUpdateClient(data);
                } else {
                    handleCreateClient(data);
                }
            };

            const handleConvertClient = (client) => {
                setConfirmModal({
                    message: `${client.name}님을 정규 내담자로 전환하시겠습니까?`,
                    onConfirm: async () => {
                        const { error } = await supabase.from('clients').update({ type: 'client' }).eq('id', client.id);
                        if (!error) {
                            const updatedClient = { ...client, type: 'client' };
                            setClients(prev => prev.map(c => c.id === client.id ? updatedClient : c));

                            // [FIX] Update Right Panel to reflect change immediately without closing
                            setRightPanel(prev => prev && prev.client.id === client.id ? { ...prev, client: updatedClient } : prev);

                            showToast(`${client.name}님이 정규 내담자로 전환되었습니다.`);
                            setConfirmModal(null); // Close modal
                        } else {
                            showToast(`전환 실패: ${error.message}`);
                        }
                    }
                });
            };

            const handleGoToHistory = (schedule) => {
                // [FIXED] Use string comparison to safely find client ID
                const client = clients.find(c => String(c.id) === String(schedule.clientId));
                if (client) {
                    setRightPanel({ type: 'detail', client, initialTab: 'history' });
                }
            };

            const resolveConflict = async (method) => {
                if (!conflictData) return;

                const { newSchedule, conflicts, originalSchedule } = conflictData;

                if (method === 'push') {
                    // 전체 시간 밀기: 충돌된 스케줄들을 newSchedule 종료 시간 이후로 이동
                    const newEndTime = newSchedule.endTime;
                    const sortedConflicts = [...conflicts].sort((a, b) => a.startTime.localeCompare(b.startTime));

                    let currentTime = newEndTime;
                    const updates = [];

                    for (const conflict of sortedConflicts) {
                        const [h, m] = conflict.startTime.split(':').map(Number);
                        const [eh, em] = conflict.endTime.split(':').map(Number);
                        const duration = (eh * 60 + em) - (h * 60 + m);

                        const [ch, cm] = currentTime.split(':').map(Number);
                        const newStart = currentTime;
                        const endDate = new Date();
                        endDate.setHours(ch, cm + duration);
                        const newEnd = endDate.toTimeString().slice(0, 5);

                        updates.push({ id: conflict.id, startTime: newStart, endTime: newEnd });
                        currentTime = newEnd;
                    }

                    // DB 업데이트
                    for (const update of updates) {
                        await supabase.from('schedules').update({ start_time: update.startTime, end_time: update.endTime }).eq('id', update.id);

                    // 새 스케줄 추가

                    const sortedConflicts = [...conflicts].sort((a, b) => a.startTime.localeCompare(b.startTime));
