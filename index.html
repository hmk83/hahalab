          { id: 'art', title: '아트 플레이', sub: '미술', desc: '소근육 운동 조절 능력 향상과 심리적 정서 안정을 유도하는 창의 미술 활동입니다.', color: 'bg-pink-100 text-pink-800', border: 'border-pink-200' }
        ];

        /**
         * MAIN APP COMPONENT
         */
        function App() {
          const [user, setUser] = useState(() => {
              try {
                  const saved = localStorage.getItem('haha_lab_session');
                  return saved ? JSON.parse(saved) : null;
              } catch (e) { return null; }
          });
          
          const [view, setView] = useState(() => {
              return localStorage.getItem('haha_lab_session') ? 'dashboard' : 'intro';
          });

          const [currentTime, setCurrentTime] = useState(new Date());
          const [toast, setToast] = useState(null); 
          const [dashboardKey, setDashboardKey] = useState(0); 
          const [showProfileModal, setShowProfileModal] = useState(false);
           
          const [settings, setSettings] = useState({
            defaultSessionTime: 50, 
            alertBefore5: true,
            alertAfter5: true,
            showPausedClients: false, // Default hidden
            showTerminatedClients: false // Default hidden
          });
          const [showSettings, setShowSettings] = useState(false);
          const [showExitConfirm, setShowExitConfirm] = useState(false);

          // Data State
          const [clients, setClients] = useState([]);
          const [schedules, setSchedules] = useState([]);
          const [currentSession, setCurrentSession] = useState(null);
          
          // Data fetching for User-Specific Data
          useEffect(() => {
              if (user && view === 'dashboard') {
                  fetchClients();
                  fetchSchedules();
              }
          }, [user, view]);

          const fetchClients = async () => {
              const { data, error } = await supabase
                .from('clients')
                .select('*')
                .eq('teacher_id', user.teacherId)
                .order('name', { ascending: true });
              if (!error) setClients(keysToCamel(data));
          };

          const fetchSchedules = async () => {
              const { data, error } = await supabase
                .from('schedules')
                .select('*')
                .eq('teacher_id', user.teacherId)
                .order('date', { ascending: true });
              if (!error) setSchedules(keysToCamel(data));
          };
           
          useEffect(() => {
            const timer = setInterval(() => setCurrentTime(new Date()), 1000);
            return () => clearInterval(timer);
          }, []);

          const showToast = (message) => {
            setToast(message);
            setTimeout(() => setToast(null), 3000);
          };

          const handleSessionEndRequest = () => {
            setShowExitConfirm(true);
          };

          const confirmSessionEnd = async () => {
            if (currentSession) {
              const { error } = await supabase.from('schedules').update({ status: 'completed' }).eq('id', currentSession.id);
              if(!error) {
                 setSchedules(prev => prev.map(s => s.id === currentSession.id ? { ...s, status: 'completed' } : s));
              }
            }
            setCurrentSession(null);
            setView('dashboard');
            setShowExitConfirm(false);
          };

          const handleUpdateClientWrapper = (updatedClient) => {
              setClients(prev => prev.map(c => c.id === updatedClient.id ? updatedClient : c));
          };

          const handleDeleteSchedule = async (id) => {
              const { error } = await supabase.from('schedules').delete().eq('id', id);
              if (!error) {
                  setSchedules(prev => prev.filter(s => s.id !== id));
                  showToast('일정이 삭제되었습니다.');
              } else {
                  showToast('일정 삭제 실패: ' + error.message);
              }
          };

          const handleLogout = () => {
              // [MODIFIED] Clear session from localStorage
              localStorage.removeItem('haha_lab_session');
              setShowProfileModal(false);
              setUser(null);
              setView('login');
          };

          if (view === 'intro') return <IntroView onFinish={() => setView('login')} />;
          if (view === 'login') return <LoginView onLogin={(loggedInUser) => {
              // [MODIFIED] Save session to localStorage
              localStorage.setItem('haha_lab_session', JSON.stringify(loggedInUser));
              setUser(loggedInUser);
              setView('dashboard');
              showToast(`안녕하세요 ${loggedInUser.name} 선생님. 오늘도 좋은 하루보내세요.`);
          }} />;

          return (
            <div className="w-full h-screen bg-[#FDE047] text-slate-900 font-sans overflow-hidden flex flex-col relative">
              <GNB 
                user={user} 
                isSession={view === 'session' && currentSession?.type === 'client'}
                sessionData={currentSession}
                onExitSession={handleSessionEndRequest}
                onOpenSettings={() => setShowSettings(true)}
                onLogoClick={() => {
                  if (view === 'session' && currentSession?.type === 'client') handleSessionEndRequest();
                  else {
                      setView('dashboard');
                      setDashboardKey(prev => prev + 1);
                      setCurrentSession(null);
                  }
                }}
                onNoticeClick={() => setView('notice')}
                onProfileClick={() => setShowProfileModal(true)}
              />

              <div className="flex-1 flex overflow-hidden relative bg-white">
                {view === 'dashboard' ? (
                  <Dashboard 
                    key={dashboardKey}
                    clients={clients} 
                    setClients={setClients}
                    schedules={schedules}
                    setSchedules={setSchedules}
                    currentTime={currentTime}
                    settings={settings}
                    onStartSession={(schedule) => {
                      setCurrentSession(schedule);
                      setView('session');
                    }}
                    showToast={showToast}
                    user={user}
                    onDeleteSchedule={handleDeleteSchedule}
                  />
                ) : view === 'session' ? (
                  currentSession?.type === 'reserve' ? (
                      <ConsultationMode 
                          session={currentSession}
                          client={clients.find(c => c.id === currentSession.clientId)}
                          onExit={handleSessionEndRequest}
                          onUpdateClient={handleUpdateClientWrapper}
                          showToast={showToast}
                      />
                  ) : (
                      <SessionMode 
                        session={currentSession}
                        onExit={handleSessionEndRequest}
                      />
                  )
                ) : view === 'notice' ? (
                  <NoticePage onBack={() => setView('dashboard')} />
                ) : null}
              </div>

              {showSettings && <SettingsModal settings={settings} setSettings={setSettings} onClose={() => setShowSettings(false)} />}
              
              {showProfileModal && (
                  <ProfileModal 
                      user={user} 
                      onClose={() => setShowProfileModal(false)} 
                      onLogout={handleLogout}
                  />
              )}
               
              {showExitConfirm && (
                <SessionExitModal 
                  onClose={() => setShowExitConfirm(false)}
                  onConfirm={confirmSessionEnd}
                  sessionType={currentSession?.type}
                />
              )}

              {toast && (
                <div className="absolute bottom-8 right-8 bg-slate-800 text-white px-6 py-4 rounded-xl shadow-2xl animate-fade-in z-50 flex items-center gap-3 min-w-[300px] max-w-[90vw]">
                  <div className="bg-[#FDE047] p-2 rounded-full text-slate-900 shrink-0">
                    <Bell size={18} />
                  </div>
                  <div>
                    <p className="font-bold text-sm">알림</p>
                    <p className="text-sm text-slate-300 break-words">{toast}</p>
                  </div>
                </div>
              )}
            </div>
          );
        }

        // 1. INTRO
        function IntroView({ onFinish }) {
            const [progress, setProgress] = useState(0);
            useEffect(() => {
                const timer = setInterval(() => setProgress(p => p >= 100 ? 100 : p + 2), 30);
                return () => clearInterval(timer);
            }, []);
            useEffect(() => { if (progress >= 100) setTimeout(onFinish, 500); }, [progress, onFinish]);
            return (
                <div className="w-full h-screen bg-[#FDE047] flex flex-col items-center justify-center animate-fade-in relative">
                    <div className="flex flex-col items-center mb-12">
                        <div className="text-5xl md:text-6xl font-black mb-4 tracking-tighter animate-bounce-custom">HAHA LAB</div>
                        <p className="text-lg md:text-xl font-medium animate-pulse text-center px-4">즐거운 배움이 시작되는 곳</p>
                    </div>
                    <div className="w-48 md:w-64 h-1 bg-yellow-600/20 rounded-full overflow-hidden mb-2">
                        <div className="h-full bg-slate-900 transition-all duration-100 ease-linear" style={{ width: `${progress}%` }} />
                    </div>
                    <p className="text-sm font-bold text-slate-900">{progress}%</p>
                    <p className="absolute bottom-10 text-[10px] md:text-xs text-slate-500 font-medium">© 2026 HAHA LAB Corp.</p>
                </div>
            );
        }

        // 2. LOGIN (Supabase Connected)
        function LoginView({ onLogin }) {
          const [id, setId] = useState('');
          const [pw, setPw] = useState('');
          const [remember, setRemember] = useState(true);
          const [error, setError] = useState(false);
          const [loading, setLoading] = useState(false);
          const [suspendMsg, setSuspendMsg] = useState(null); // suspended message

          const handleAuth = async () => {
            setLoading(true);
            setError(false);
            setSuspendMsg(null);
            
            try {
                // Verify against teachers table
                const { data, error } = await supabase
                    .from('teachers')
                    .select('*')
                    .eq('teacher_id', id)
                    .eq('password', pw) // In production, use hashing
                    .maybeSingle();

                if (error || !data) {
                    setError(true);
                    setPw('');
                } else {
                    if (data.status === 'suspended' || data.status === 'paused') {
                        setSuspendMsg({
                            title: "사용 정지된 계정입니다.",
                            desc: "관리자에 문의하세요.\n010-8416-3323 카톡 또는 문자로 문의 부탁드립니다."
                        });
                    } else {
                        onLogin(keysToCamel(data));
                    }
                }
            } catch (e) {
                console.error(e);
                setError(true);
            } finally {
                setLoading(false);
            }
          };

          return (
            <div className="w-full h-screen bg-slate-800/90 flex items-center justify-center fixed inset-0 z-50 backdrop-blur-sm p-4">
              <div className="bg-white p-6 md:p-8 rounded-2xl shadow-2xl w-full max-w-md text-center relative">
                <h2 className="text-3xl font-black text-slate-900 mb-8">HAHA LAB</h2>
                
                {suspendMsg ? (
                    <div className="bg-red-50 border border-red-200 rounded-xl p-4 mb-6 text-left animate-fade-in">
                        <div className="flex items-center gap-2 mb-2 text-red-600 font-bold">
                            <AlertCircle size={20}/>
                            <span>{suspendMsg.title}</span>
                        </div>
                        <p className="text-sm text-slate-600 whitespace-pre-wrap leading-relaxed">
                            {suspendMsg.desc}
                        </p>
                        <button onClick={() => setSuspendMsg(null)} className="mt-4 w-full py-2 bg-red-100 text-red-700 font-bold rounded-lg text-sm hover:bg-red-200">확인</button>
                    </div>
                ) : (
                    <>
                        <div className="flex flex-col gap-4 mb-6 text-left">
                          <div>
                              <label className="text-xs font-bold text-slate-500 mb-1 block pl-1">아이디</label>
                              <input 
                                type="text" 
                                value={id} 
                                onChange={(e) => { setId(e.target.value); setError(false); }} 
                                className={`w-full text-lg font-bold p-3 border-2 rounded-xl focus:outline-none transition ${error ? 'border-red-500 bg-red-50' : 'border-slate-200 focus:border-[#FDE047]'}`} 
                                placeholder="아이디 입력"
                              />
                          </div>
                          <div>
                              <label className="text-xs font-bold text-slate-500 mb-1 block pl-1">비밀번호</label>
                              <input 
                                type="password" 
                                value={pw} 
                                onChange={(e) => { setPw(e.target.value); setError(false); }} 
                                onKeyDown={(e) => e.key === 'Enter' && handleAuth()} 
                                className={`w-full text-lg font-bold p-3 border-2 rounded-xl focus:outline-none transition ${error ? 'border-red-500 bg-red-50' : 'border-slate-200 focus:border-[#FDE047]'}`} 
                                placeholder="비밀번호 입력"
                                maxLength={6}
                              />
                          </div>
                          <div className="flex items-center gap-2 pl-1">
                              <input type="checkbox" checked={remember} onChange={e=>setRemember(e.target.checked)} className="w-4 h-4 accent-slate-900" id="remember"/>
                              <label htmlFor="remember" className="text-sm font-bold text-slate-500 cursor-pointer">아이디 저장</label>
                          </div>
                          {error && <p className="text-red-500 text-xs font-bold text-center mt-2">아이디 또는 비밀번호를 확인해주세요.</p>}
                        </div>

                        <button onClick={handleAuth} disabled={loading} className="w-full bg-[#FDE047] text-slate-900 font-bold py-4 rounded-xl hover:bg-yellow-300 transition shadow-lg disabled:opacity-50">
                            {loading ? '확인 중...' : '접속하기'}
                        </button>
                    </>
                )}
                
                <p className="mt-8 text-xs text-slate-400 font-medium">© 2026 HAHA LAB Corp. All rights reserved.</p>
              </div>
            </div>
          );
        }

        // 3. GNB
        function GNB({ user, isSession, sessionData, onExitSession, onOpenSettings, onLogoClick, onNoticeClick, onProfileClick }) {
          return (
            <header className="h-16 bg-[#FDE047] border-b border-yellow-500/30 flex items-center justify-between px-4 md:px-6 shrink-0 z-20 shadow-sm">
              <div className="flex items-center gap-4 md:gap-6">
                <div className="flex items-center gap-2 cursor-pointer" onClick={onLogoClick}>
                  <div className="bg-slate-900 text-[#FDE047] font-black p-1.5 rounded text-sm">HL</div>
                  <span className="font-black text-lg md:text-xl tracking-tight">HAHA LAB</span>
                </div>
                {isSession && <div className="flex items-center gap-2 md:gap-4 bg-white/40 px-3 py-1.5 rounded-full"><span className="font-bold text-xs md:text-base text-slate-900">수업 진행 중</span></div>}
              </div>
              <div className="flex items-center gap-2 md:gap-4">
                {isSession ? 
                  null 
                  : 
                  <>
                    <div onClick={onProfileClick} className="flex items-center gap-2 bg-white/30 px-3 py-1.5 rounded-full cursor-pointer hover:bg-white/50 transition">
                        <User size={14}/>
                        <span className="font-bold text-xs md:text-sm whitespace-nowrap">{user?.name} <span className="hidden md:inline">선생님</span></span>
                    </div>
                    <button onClick={onOpenSettings} className="p-2 hover:bg-white/20 rounded-full transition"><Settings size={20}/></button>
                    <button onClick={onNoticeClick} className="p-2 hover:bg-white/20 rounded-full transition relative">
                        <Megaphone size={20}/>
                        <span className="absolute top-1 right-1 w-2 h-2 bg-red-50 rounded-full border border-[#FDE047]"></span>
                    </button>
                  </>
                }
              </div>
            </header>
          );
        }

        // Profile Modal
        function ProfileModal({ user, onClose, onLogout }) {
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4" onClick={onClose}>
                    <div className="bg-white rounded-2xl w-full max-w-[360px] shadow-2xl overflow-hidden animate-fade-in relative" onClick={e => e.stopPropagation()}>
                        <button onClick={onClose} className="absolute top-4 right-4 text-white hover:opacity-80"><X size={24}/></button>
                        <div className="bg-slate-900 p-6 text-center pt-10">
                            <div className="w-20 h-20 bg-[#FDE047] rounded-full mx-auto flex items-center justify-center mb-3">
                                <User size={40} className="text-slate-900"/>
                            </div>
                            <h3 className="text-white font-bold text-xl">{user.name} 선생님</h3>
                            <p className="text-slate-400 text-xs mt-1">{user.center}</p>
                        </div>
                        <div className="p-6 space-y-4">
                            <div className="flex justify-between items-center text-sm border-b border-slate-100 pb-3">
                                <span className="text-slate-500 font-bold">센터명</span>
                                <span className="font-bold">{user.center}</span>
                            </div>
                            <div className="flex justify-between items-center text-sm border-b border-slate-100 pb-3">
                                <span className="text-slate-500 font-bold">이름</span>
                                <span className="font-bold">{user.name}</span>
                            </div>
                            <div className="flex justify-between items-center text-sm border-b border-slate-100 pb-3">
                                <span className="text-slate-500 font-bold">성별</span>
                                <span className="font-bold">{user.gender}</span>
                            </div>
                            <div className="flex justify-between items-center text-sm border-b border-slate-100 pb-3">
                                <span className="text-slate-500 font-bold">나이</span>
                                <span className="font-bold">만 {user.age}세</span>
                            </div>
                            <div className="flex justify-between items-center text-sm border-b border-slate-100 pb-3">
                                <span className="text-slate-500 font-bold">연락처</span>
                                <span className="font-bold">{user.contact}</span>
                            </div>
                            <div className="flex justify-between items-center text-sm border-b border-slate-100 pb-3">
                                <span className="text-slate-500 font-bold">이메일</span>
                                <span className="font-bold">{user.email}</span>
                            </div>
                            <div className="flex justify-between items-center text-sm border-b border-slate-100 pb-3">
                                <span className="text-slate-500 font-bold">요금제</span>
                                <span className="font-bold text-blue-600">{user.plan}</span>
                            </div>
                            <div className="flex justify-center mt-6">
                                <button onClick={onLogout} className="text-xs px-3 py-1.5 bg-slate-100 text-slate-500 rounded-lg hover:bg-slate-200 transition font-bold">로그아웃</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Notice Page Component - Supabase
        function NoticePage({ onBack }) {
            const [notices, setNotices] = useState([]);
            const [expandedId, setExpandedId] = useState(null);
            const [filter, setFilter] = useState('all');

            useEffect(() => {
                const fetchNotices = async () => {
                    const { data } = await supabase.from('notices').select('*').order('created_at', { ascending: false });
                    if(data) setNotices(keysToCamel(data));
                }
                fetchNotices();
            }, []);

            const toggleExpand = (id) => {
                setExpandedId(expandedId === id ? null : id);
            };

            const getBadgeStyle = (type) => {
                switch(type) {
                    case '업데이트': return 'bg-blue-100 text-blue-700';
                    case '점검': return 'bg-red-100 text-red-700';
                    case '이벤트': return 'bg-purple-100 text-purple-700';
                    default: return 'bg-slate-100 text-slate-700';
                }
            };

            const filteredNotices = filter === 'all' ? notices : notices.filter(n => n.type === filter);

            return (
                <div className="w-full h-full bg-slate-50 flex flex-col animate-fade-in relative overflow-hidden">
                    {/* Header */}
                    <div className="bg-white px-6 py-5 border-b border-slate-200 flex items-center gap-4 sticky top-0 z-10 shrink-0">
                        <button onClick={onBack} className="p-2 hover:bg-slate-100 rounded-full transition"><ChevronLeft size={24}/></button>
                        <div>
                            <h2 className="text-2xl font-black text-slate-900">공지사항</h2>
                            <p className="text-xs text-slate-500 font-medium">HAHA LAB의 새로운 소식과 업데이트를 확인하세요.</p>
                        </div>
                    </div>

                    {/* Filter */}
                    <div className="px-6 py-4 flex gap-2 overflow-x-auto scrollbar-hide shrink-0">
                        {[{id:'all', l:'전체'}, {id:'업데이트', l:'업데이트'}, {id:'점검', l:'점검'}, {id:'이벤트', l:'이벤트'}, {id:'일반', l:'일반'}].map(f => (
                            <button 
                                key={f.id} 
                                onClick={() => setFilter(f.id)} 
                                className={`px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap transition ${filter === f.id ? 'bg-slate-900 text-white shadow-md' : 'bg-white text-slate-500 border border-slate-200 hover:bg-slate-100'}`}
                            >
                                {f.l}
                            </button>
                        ))}
                    </div>

                    {/* List */}
                    <div className="flex-1 overflow-y-auto px-6 pb-20 space-y-4">
                        {filteredNotices.length === 0 && (
                            <div className="text-center py-20 text-slate-400">
                                <Info size={48} className="mx-auto mb-4 opacity-50"/>
                                <p>해당하는 공지사항이 없습니다.</p>
                            </div>
                        )}
                        {filteredNotices.map(notice => (
                            <div 
                                key={notice.id} 
                                onClick={() => toggleExpand(notice.id)}
                                className={`bg-white rounded-2xl p-5 shadow-sm border border-slate-100 cursor-pointer transition-all duration-300 hover:shadow-md ${expandedId === notice.id ? 'ring-2 ring-[#FDE047]' : 'hover:-translate-y-0.5'}`}
                            >
                                <div className="flex justify-between items-start gap-4">
                                    <div className="flex-1">
                                        <div className="flex items-center gap-2 mb-2">
                                            <span className={`px-2 py-0.5 rounded text-[10px] font-black ${getBadgeStyle(notice.type)}`}>
                                                {notice.type}
                                            </span>
                                            <span className="text-xs text-slate-400 font-medium">{notice.date}</span>
                                        </div>
                                        <h3 className={`font-bold text-lg leading-tight ${expandedId === notice.id ? 'text-slate-900' : 'text-slate-700'}`}>{notice.title}</h3>
                                    </div>
                                    <div className={`transition-transform duration-300 ${expandedId === notice.id ? 'rotate-180' : ''}`}>
                                        <ChevronDown size={20} className="text-slate-400"/>
                                    </div>
                                </div>
                                 
                                <div 
                                    className={`overflow-hidden transition-all duration-300 ease-in-out ${expandedId === notice.id ? 'max-h-96 opacity-100 mt-4' : 'max-h-0 opacity-0'}`}
                                >
                                    <div 
                                        className="pt-4 border-t border-slate-100 text-slate-600 text-sm leading-relaxed whitespace-pre-wrap"
                                        dangerouslySetInnerHTML={{__html: notice.content}}
                                    />
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // Settings Modal
        function SettingsModal({ settings, setSettings, onClose }) {
          return (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50" onClick={onClose}>
              <div className="bg-white rounded-2xl w-[90%] max-w-[400px] shadow-2xl overflow-hidden" onClick={e => e.stopPropagation()}>

        // 4. DASHBOARD
        function Dashboard({ clients, setClients, schedules, setSchedules, currentTime, settings, onStartSession, showToast, user, onDeleteSchedule }) {
          const [rightPanel, setRightPanel] = useState({ type: 'calendar' }); 
          const [dragItem, setDragItem] = useState(null); 
          const [showScheduleModal, setShowScheduleModal] = useState(false);
          const [selectedDateForSchedule, setSelectedDateForSchedule] = useState(null);
          const [prefilledData, setPrefilledData] = useState(null);
          const [conflictData, setConflictData] = useState(null); 
          const [mobileTab, setMobileTab] = useState('schedule'); 

          // Create Client in DB
          const handleCreateClient = async (data) => {
             const payload = {
                 ...data,
                 teacher_id: user.teacherId
             };
             
             // keysToSnake를 사용하여 DB 컬럼명에 맞게 변환
             const dbPayload = keysToSnake(payload);
             
             const { data: inserted, error } = await supabase.from('clients').insert([dbPayload]).select();
             if (!error) {
                 setClients([...clients, keysToCamel(inserted[0])]);
                 setRightPanel({ type: 'calendar' });
                 showToast('내담자가 등록되었습니다.');
             } else {
                 console.error("Supabase Error:", error);
                 alert('등록 실패: ' + error.message);
             }
          };

          // Update Client in DB
          const handleUpdateClient = async (updatedClient) => {
             const payload = keysToSnake(updatedClient);
             const { error } = await supabase.from('clients').update(payload).eq('id', updatedClient.id);
             if (!error) {
                 setClients(clients.map(c => c.id === updatedClient.id ? updatedClient : c));
                 setRightPanel({ type: 'detail', client: updatedClient });
                 showToast('정보가 수정되었습니다.');
             }
          };

          const handleSaveClient = (data) => {
              if (data.id) {
                  handleUpdateClient(data);
              } else {
                  handleCreateClient(data);
              }
          };

          const handleConvertClient = async (client) => {
            if (confirm(`${client.name}님을 정규 내담자로 전환하시겠습니까?`)) {
                const updated = { ...client, type: 'client' }; 
                await handleUpdateClient(updated);
                showToast(`${client.name}님이 정규 내담자로 등록되었습니다.`);
            }
          };

          const handleGoToHistory = (schedule) => {
              // [FIXED] Use string comparison to safely find client ID
              const client = clients.find(c => String(c.id) === String(schedule.clientId));
              if (client) {
                  setRightPanel({ type: 'detail', client, initialTab: 'history' });
              }
          };

          const resolveConflict = async (method) => {
            if (!conflictData) return;
            
            const { newSchedule, conflicts, originalSchedule } = conflictData;
            
            if (method === 'push') {
                // 전체 시간 밀기: 충돌된 스케줄들을 newSchedule 종료 시간 이후로 이동
                const newEndTime = newSchedule.endTime;
                const sortedConflicts = [...conflicts].sort((a, b) => a.startTime.localeCompare(b.startTime));
                
                let currentTime = newEndTime;
                const updates = [];
                
                for (const conflict of sortedConflicts) {
                    const [h, m] = conflict.startTime.split(':').map(Number);
                    const [eh, em] = conflict.endTime.split(':').map(Number);
                    const duration = (eh * 60 + em) - (h * 60 + m);
                    
                    const [ch, cm] = currentTime.split(':').map(Number);
                    const newStart = currentTime;
                    const endDate = new Date();
                    endDate.setHours(ch, cm + duration);
                    const newEnd = endDate.toTimeString().slice(0, 5);
                    
                    updates.push({ id: conflict.id, startTime: newStart, endTime: newEnd });
                    currentTime = newEnd;
                }
                
                // DB 업데이트
                for (const update of updates) {
                    await supabase.from('schedules').update({ start_time: update.startTime, end_time: update.endTime }).eq('id', update.id);
                }
                
                // 새 스케줄 추가
                const payload = keysToSnake({ ...newSchedule, teacherId: user.teacherId });
                const { data, error } = await supabase.from('schedules').insert([payload]).select();
                if (!error) {
                    // 전체 스케줄 다시 불러오기
                    const { data: allSchedules } = await supabase.from('schedules').select('*').eq('teacher_id', user.teacherId);
                    setSchedules(keysToCamel(allSchedules));
                    showToast('일정이 등록되고 기존 일정들이 조정되었습니다.');
                }
            } else if (method === 'adjust') {
                // 시간 자동 단축: newSchedule의 종료 시간을 첫 번째 충돌 직전으로 단축
                const sortedConflicts = [...conflicts].sort((a, b) => a.startTime.localeCompare(b.startTime));
                const firstConflict = sortedConflicts[0];
                const adjustedSchedule = { ...newSchedule, endTime: firstConflict.startTime };
                
                const payload = keysToSnake({ ...adjustedSchedule, teacherId: user.teacherId });
                const { data, error } = await supabase.from('schedules').insert([payload]).select();
                if (!error) {
                    setSchedules(prev => [...prev, keysToCamel(data[0])]);
                    showToast('일정이 자동 단축되어 등록되었습니다.');
                }
            } else if (method === 'manual') {
                // 직접 설정: 스케줄 모달 열기

                    clientId: newSchedule.clientId,

                    startTime: newSchedule.startTime
                });
                setSelectedDateForSchedule(new Date(newSchedule.date));
                setShowScheduleModal(true);
            }
            
            setConflictData(null);
          };

        }

        // ClientManager
        function ClientManager({ clients, setDragItem, onNewClick, onClientClick, forcedTab, settings }) {
          const [tab, setTab] = useState(forcedTab || 'client'); 
          const [searchTerm, setSearchTerm] = useState('');
          
          useEffect(() => {
              if (forcedTab) setTab(forcedTab);
          }, [forcedTab]);
           
          // Count only active clients (exclude paused/terminated/deleted)
          const clientCount = clients.filter(c => c.type === 'client' && c.status === 'active').length;
          const reserveCount = clients.filter(c => c.type === 'reserve' && c.status !== 'deleted').length;

          // Filter logic for Display List (Includes Settings Toggle)
          const filteredClients = clients.filter(c => {
            if (c.type !== tab) return false;
            if (c.status === 'deleted') return false;
            
            // Toggle Logic for Paused/Terminated
            if (c.status === 'paused' && !settings?.showPausedClients) return false;
            if (c.status === 'terminated' && !settings?.showTerminatedClients) return false;
            
            return c.name.includes(searchTerm);
          });

          const groupedClients = useMemo(() => {
              const groups = {};
              const sorted = [...filteredClients].sort((a, b) => a.name.localeCompare(b.name));
              sorted.forEach(c => {
                  const initial = getChosung(c.name);
                  if (!groups[initial]) groups[initial] = [];
                  groups[initial].push(c);
              });
              return groups;
          }, [filteredClients]);

          const initials = Object.keys(groupedClients).sort();

          const scrollToInitial = (initial) => {
              const el = document.getElementById(`group-${initial}`);
              if (el) el.scrollIntoView({ behavior: 'smooth' });
          };

          return (
            <div className="flex flex-col h-full relative">
              {!forcedTab && (
                  <div className="flex border-b border-slate-200 bg-white shrink-0">
                    <button onClick={() => setTab('client')} className={`flex-1 py-4 font-bold text-sm transition-colors ${tab === 'client' ? 'text-slate-900 border-b-2 border-[#FDE047]' : 'text-slate-400'}`}>내담자 ({clientCount})</button>
                    <button onClick={() => setTab('reserve')} className={`flex-1 py-4 font-bold text-sm transition-colors ${tab === 'reserve' ? 'text-slate-900 border-b-2 border-[#FDE047]' : 'text-slate-400'}`}>상담예약자 ({reserveCount})</button>
                  </div>
              )}
              {forcedTab && (
                  <div className="p-4 bg-white border-b border-slate-100 font-black text-lg">
                      {forcedTab === 'client' ? `내담자 목록 (${clientCount})` : `상담 예약자 목록 (${reserveCount})`}
                  </div>
              )}

              <div className="p-4 border-b border-slate-100 space-y-3 bg-white shrink-0">
                <div className="relative">
                  <Search className="absolute left-3 top-2.5 text-slate-400" size={16} />
                  <input type="text" placeholder="이름 검색" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full bg-slate-100 pl-9 pr-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#FDE047]"/>
                </div>
                <button onClick={onNewClick} className="w-full bg-slate-900 text-white py-2 rounded-lg text-sm font-bold hover:bg-slate-700 transition flex items-center justify-center gap-2"><Plus size={16} /> 신규 등록</button>
              </div>

              <div className="flex-1 flex overflow-hidden">
                  <div className="flex-1 overflow-y-auto p-2 bg-slate-50 relative scroll-smooth no-scrollbar">
                     {initials.length === 0 && <div className="text-center text-slate-400 mt-10 text-sm">등록된 목록이 없습니다.</div>}
                     {initials.map(initial => (
                         <div key={initial} id={`group-${initial}`} className="mb-4">
                             <div className="text-xs font-bold text-slate-400 px-2 mb-1 sticky top-0 bg-slate-50 z-10">{initial}</div>
                             <div className="space-y-2">
                                {groupedClients[initial].map(client => (
                                    <div key={client.id} draggable onDragStart={(e) => { setDragItem({ type: 'client', data: client }); e.dataTransfer.setData('text/plain', JSON.stringify({ type: 'client', data: client })); }} onClick={() => onClientClick(client)} className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 hover:border-[#FDE047] cursor-pointer hover:shadow-md transition group">
                                        <div className="flex justify-between items-start mb-2">
                                            <div>
                                                <span className={`text-xs font-bold px-1.5 py-0.5 rounded text-white mr-2 ${client.gender === '남' ? 'bg-blue-500' : 'bg-pink-500'}`}>{client.gender}</span>
                                                <span className={`font-bold text-lg ${(client.status === 'terminated' || client.status === 'paused') ? 'text-gray-400' : 'text-slate-900'}`}>{client.name}</span>
                                                {client.status === 'terminated' && <span className="ml-2 text-[10px] bg-gray-200 text-gray-500 px-1.5 py-0.5 rounded font-bold">수업종결</span>}
                                                {client.status === 'paused' && <span className="ml-2 text-[10px] bg-orange-100 text-orange-600 px-1.5 py-0.5 rounded font-bold">수업정지</span>}
                                            </div>
                                        </div>
                                        <div className="text-xs text-slate-500 space-y-1"><p>{client.dob} (만 {client.age}세)</p></div>
                                    </div>
                                ))}
                             </div>
                         </div>
                     ))}
                  </div>

                  <div className="w-8 flex flex-col justify-center items-center py-2 bg-white border-l border-slate-100">
                      <div className="flex flex-col gap-1 w-full text-center h-full justify-between">

                              <button key={char} onClick={() => scrollToInitial(char)} className="text-[10px] font-bold text-slate-400 hover:text-slate-900 hover:scale-125 transition py-0.5">{char}</button>

                      </div>
                  </div>
              </div>
            </div>
          );
        }

        function CalendarManager({ schedules, setSchedules, clients, dragItem, currentTime, onStartSession, onAddClick, showToast, onConflict, user, onDeleteSchedule, onGoToHistory }) {
          const [viewMode, setViewMode] = useState('month'); 
          const [currentDate, setCurrentDate] = useState(new Date());
          const [selectedSchedule, setSelectedSchedule] = useState(null); 
          const scrollRef = useRef(null);

          const todayStr = formatDateLocal(new Date());
           
          const upcomingSchedules = useMemo(() => {
              const allToday = schedules
                .filter(s => s.date === todayStr && s.status !== 'deleted')
                .sort((a,b) => new Date(a.date+'T'+a.startTime) - new Date(b.date+'T'+b.startTime));
              
              if (window.innerWidth < 768) {
                  const completed = allToday.filter(s => s.status === 'completed' || s.status === 'noshow').pop(); 
                  const upcoming = allToday.find(s => s.status === 'scheduled' || s.status === 'in-progress'); 
                  const list = [];
                  if (completed) list.push(completed);
                  if (upcoming) list.push(upcoming);
                  if (list.length < 2 && !completed) {
                      const nextUpcoming = allToday.filter(s => s.status === 'scheduled').slice(0, 2);
                      return nextUpcoming;
                  }
                  return list;
              }
              return allToday;
          }, [schedules, todayStr]);

          const handleToday = () => setCurrentDate(new Date());

          const handleMoreClick = () => {
              setViewMode('day');
              setCurrentDate(new Date());
              setTimeout(() => {
                  if (scrollRef.current) {
                      const now = new Date();
                      const offset = (now.getHours() - 9) * 80;
                      scrollRef.current.scrollTop = Math.max(0, offset);
                  }
              }, 100);
          };

          const handleScheduleClick = (sch) => setSelectedSchedule(sch);

          const handleStatusChange = async (id, status, memo = '') => {
              const { error } = await supabase.from('schedules').update({ status, memo }).eq('id', id);
              if(!error) {
                 setSchedules(prev => prev.map(s => s.id === id ? { ...s, status, memo: memo || s.memo } : s));
                 setSelectedSchedule(null);
              }
          };

          const handleReschedule = async (id, date, time) => {
              const { error } = await supabase.from('schedules').update({ date, start_time: time }).eq('id', id);
              if(!error) {
                  setSchedules(prev => prev.map(s => s.id === id ? { ...s, date, startTime: time } : s));
                  setSelectedSchedule(null);
              }
          };

          const calculateEndTime = (start, duration) => {
              const [h, m] = start.split(':').map(Number);
              const d = new Date(); d.setHours(h, m + duration);
              return d.toTimeString().slice(0, 5);
          };

          const handleDrop = async (targetDate, targetTime) => {
            if (!dragItem) return;

            if (!targetTime) {
                const now = new Date();
                targetTime = now.toTimeString().slice(0, 5);
            }

            if (dragItem.type === 'client') {
               const client = dragItem.data;
               const newEndTime = calculateEndTime(targetTime, client.sessionTime || 50);
               
               const conflicts = schedules.filter(s => 
                   s.date === targetDate && s.status !== 'deleted' && s.status !== 'noshow' &&
                   checkTimeOverlap(targetTime, newEndTime, s.startTime, s.endTime)
               );

               if (conflicts.length > 0) {
                   const newSch = {
                     clientId: client.id, clientName: client.name, type: client.type,
                     date: targetDate, startTime: targetTime, endTime: newEndTime, status: 'scheduled'
                   };
                   onConflict({ newSchedule: newSch, conflicts });
               } else {
                   const payload = {
                     teacher_id: user.teacherId,
                     client_id: client.id, client_name: client.name, type: client.type,
                     date: targetDate, start_time: targetTime, end_time: newEndTime, status: 'scheduled'
                   };
                   const { data, error } = await supabase.from('schedules').insert([payload]).select();
                   if(!error) setSchedules(prev => [...prev, keysToCamel(data[0])]);
               }
            } else if (dragItem.type === 'schedule') {
               const schedule = dragItem.data;
               const [oldH, oldM] = schedule.startTime.split(':').map(Number);
               const [oldEH, oldEM] = schedule.endTime.split(':').map(Number);
               const durationMins = (oldEH * 60 + oldEM) - (oldH * 60 + oldM);
               
               const [newH, newM] = targetTime.split(':').map(Number);
               const newEndDate = new Date(); newEndDate.setHours(newH, newM + durationMins);
               const newEndTime = newEndDate.toTimeString().slice(0, 5);

               const conflicts = schedules.filter(s => 
                   s.id !== schedule.id && s.date === targetDate && s.status !== 'deleted' && s.status !== 'noshow' &&
                   checkTimeOverlap(targetTime, newEndTime, s.startTime, s.endTime)
               );

               if (conflicts.length > 0) {
                   const newSch = { ...schedule, date: targetDate, startTime: targetTime, endTime: newEndTime };
                   onConflict({ newSchedule: newSch, conflicts, originalSchedule: schedule });
               } else {
                   const { error } = await supabase.from('schedules').update({ date: targetDate, start_time: targetTime, end_time: newEndTime }).eq('id', schedule.id);
                   if(!error) setSchedules(prev => prev.map(s => s.id === schedule.id ? { ...s, date: targetDate, startTime: targetTime, endTime: newEndTime } : s));
               }
            }
          };

          return (
            <div className="flex flex-col h-full animate-fade-in">
              <div className="bg-slate-50 border-b border-slate-100 p-4 flex gap-4 overflow-x-auto shrink-0 items-stretch">
                {upcomingSchedules.length === 0 && <div className="text-slate-400 font-medium p-4 flex items-center">금일 예정된 수업이 없습니다.</div>}
                {upcomingSchedules.map(sch => (
                   <div 
                     key={sch.id} 
                     onClick={() => sch.status === 'completed' ? onGoToHistory(sch) : handleScheduleClick(sch)}
                     className={`bg-white rounded-xl shadow-sm p-4 min-w-[240px] border-l-4 relative group transition-all flex flex-col justify-center ${sch.status === 'noshow' ? 'border-red-400 opacity-80' : sch.status === 'completed' ? 'border-slate-400 bg-slate-50' : 'border-[#FDE047] cursor-pointer hover:shadow-md hover:-translate-y-0.5'}`}
                   >
                      <div className="flex justify-between items-start mb-2">
                          <div className="flex-1">
                              <p className={`text-xs font-bold mb-1 ${sch.status==='noshow'?'text-red-500': sch.status==='completed'?'text-slate-400':'text-orange-500'}`}>{sch.status === 'noshow' ? '미출석' : sch.status === 'completed' ? '완료됨' : (sch.type === 'reserve' ? '상담' : 'TODAY')}</p>
                              <div className="flex items-center gap-2">
                                  <p className={`font-black text-lg ${sch.status === 'completed' ? 'text-slate-400' : 'text-slate-900'}`}>{sch.clientName}</p>

                              </div>
                          </div>
                      </div>
                      <p className={`text-xs font-mono ${sch.status === 'completed' ? 'text-slate-400' : 'text-slate-600'}`}>{sch.startTime} ~ {sch.endTime}</p>
                   </div>
                ))}
                <button onClick={handleMoreClick} className="bg-white rounded-xl shadow-sm p-4 min-w-[100px] flex flex-col items-center justify-center hover:bg-slate-100 transition"><CalendarDays size={24} className="text-slate-400 mb-1"/><span className="text-xs font-bold text-slate-500">더보기</span></button>
              </div>

              <div className="p-4 flex justify-between items-center bg-white border-b border-slate-100">
                <div className="flex items-center gap-4">
                   <div className="flex bg-slate-100 rounded-lg p-1">
                     <button onClick={() => setCurrentDate(new Date(currentDate.setMonth(currentDate.getMonth()-1)))} className="p-1 hover:bg-white rounded"><ChevronLeft size={20}/></button>
                     <button onClick={handleToday} className="px-3 text-xs font-bold hover:bg-white rounded">오늘</button>
                     <button onClick={() => setCurrentDate(new Date(currentDate.setMonth(currentDate.getMonth()+1)))} className="p-1 hover:bg-white rounded"><ChevronRight size={20}/></button>
                   </div>
                   <h2 className="text-2xl font-black">{currentDate.getFullYear()}년 {currentDate.getMonth() + 1}월 {viewMode === 'day' && ` ${currentDate.getDate()}일`}</h2>
                </div>
                <div className="flex gap-2">
                    <button onClick={() => onAddClick(new Date())} className="bg-[#FDE047] px-4 py-2 rounded-lg font-bold flex items-center gap-2 hover:bg-yellow-300 shadow-sm">
                        <Plus size={16}/> 
                        <span className="hidden md:inline">수업 등록</span>
                        <span className="md:hidden">수업</span>
                    </button>
                    <div className="flex bg-slate-100 p-1 rounded-lg">
                        {['month', 'week', 'day'].map(m => (<button key={m} onClick={() => setViewMode(m)} className={`px-4 py-1.5 rounded-md text-sm font-bold capitalize ${viewMode === m ? 'bg-white shadow' : 'text-slate-500'}`}>{m === 'month' ? '월간' : m === 'week' ? '주간' : '일간'}</button>))}
                    </div>
                </div>
              </div>

              <div className="flex-1 overflow-hidden relative flex flex-col">
                {viewMode === 'month' ? (
                     <MonthView currentDate={currentDate} schedules={schedules} onCellClick={onAddClick} onScheduleClick={handleScheduleClick} onDrop={handleDrop} onGoToHistory={onGoToHistory} />
                ) : (
                     <TimeGridView mode={viewMode} currentDate={currentDate} schedules={schedules} onCellClick={onAddClick} onScheduleClick={handleScheduleClick} scrollRef={scrollRef} onDrop={handleDrop} onGoToHistory={onGoToHistory} />
                )}
              </div>

              <footer className="bg-slate-50 border-t p-3 text-center text-xs text-slate-400 font-medium">© 2026 HAHA LAB Corp. All rights reserved.</footer>

              {selectedSchedule && <ScheduleActionModal schedule={selectedSchedule} onClose={() => setSelectedSchedule(null)} onStart={() => { onStartSession(selectedSchedule); setSelectedSchedule(null); }} onNoShow={() => handleStatusChange(selectedSchedule.id, 'noshow')} onChange={handleReschedule} showToast={showToast} onDelete={() => onDeleteSchedule(selectedSchedule.id)} />}
            </div>
          );
        }

        // Updated Month View
        function MonthView({ currentDate, schedules, onCellClick, onScheduleClick, onDrop, onGoToHistory }) {
          const { days, weeks } = useMemo(() => {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const first = new Date(year, month, 1);
            const last = new Date(year, month + 1, 0);
            const result = [];
             
            for (let i = 0; i < first.getDay(); i++) result.push({ date: null }); 
            for (let i = 1; i <= last.getDate(); i++) result.push({ date: new Date(year, month, i), isCurrent: true });
            
            const totalDays = result.length;
            const remaining = (7 - (totalDays % 7)) % 7;
            for (let i = 1; i <= remaining; i++) result.push({ date: null });

            const numWeeks = Math.ceil(result.length / 7);
            return { days: result, weeks: numWeeks };
          }, [currentDate]);

          const todayStr = formatDateLocal(new Date());

          return (
            <div className="flex-1 grid grid-cols-7 h-full" style={{ gridTemplateRows: `auto repeat(${weeks}, 1fr)` }}>
              {['일','월','화','수','목','금','토'].map(d => (<div key={d} className="bg-slate-50 p-2 text-center text-xs font-bold text-slate-500 border-b border-r border-slate-200">{d}</div>))}
              {days.map((day, idx) => {
                  if (!day.date) return <div key={idx} className="bg-slate-50/20 border-b border-r border-slate-100"></div>;

                  const dateStr = formatDateLocal(day.date);
                  const daySch = schedules
                    .filter(s => s.date === dateStr)
                    .sort((a, b) => a.startTime.localeCompare(b.startTime));
                  const isToday = dateStr === todayStr;
                  
                  return (
                    <div 
                      key={idx}
                      onDragOver={(e) => e.preventDefault()}
                      onDrop={() => onDrop(dateStr)}
                      onClick={() => onCellClick(day.date)}
                      className={`border-b border-r border-slate-100 p-1 relative hover:bg-yellow-50/30 transition-colors cursor-pointer flex flex-col bg-white ${isToday ? 'bg-yellow-50 ring-2 ring-inset ring-[#FDE047]' : ''}`}
                    >
                      <div className="flex justify-between items-start">
                          <span className={`text-sm font-bold ml-1 mt-1 flex items-center justify-center w-6 h-6 rounded-full ${isToday ? 'bg-slate-900 text-[#FDE047]' : day.date.getDay()===0 ? 'text-red-400' : ''}`}>{day.date.getDate()}</span>
                          {isToday && <span className="text-[10px] font-bold text-slate-400 mr-1 mt-1">오늘</span>}
                      </div>
                      <div className="flex-1 overflow-hidden space-y-1 mt-1">
                        {daySch.map(s => (
                          <div 
                            key={s.id} 
                            draggable
                            onDragStart={(e) => { e.dataTransfer.setData('text/plain', JSON.stringify({ type: 'schedule', data: s })); }}
                            onClick={(e) => { e.stopPropagation(); s.status === 'completed' ? onGoToHistory(s) : onScheduleClick(s); }}
                            className={`text-[10px] px-1 py-0.5 rounded truncate font-medium hover:scale-105 transition cursor-pointer ${s.status==='completed'?'bg-slate-200 text-slate-500': s.type==='reserve'?'bg-purple-100 text-purple-800': s.status==='noshow'?'bg-red-100 text-red-800 line-through':'bg-yellow-100 text-slate-900'}`}
                          >
                            {s.startTime} {s.type === 'reserve' ? (s.status === 'completed' ? '상담완료' : '상담') : (s.status === 'completed' ? '수업완료' : '')} {s.clientName}
                          </div>
                        ))}
                      </div>
                    </div>
                  );
              })}
            </div>
          );
        }

        // Time Grid View
        function TimeGridView({ mode, currentDate, schedules, onCellClick, onScheduleClick, scrollRef, onDrop, onGoToHistory }) {
          const hours = Array.from({ length: 14 }, (_, i) => i + 9);
          const days = useMemo(() => {
              if (mode === 'day') return [currentDate];
              const start = new Date(currentDate);
              start.setDate(currentDate.getDate() - currentDate.getDay());
              return Array.from({ length: 7 }, (_, i) => {
                  const d = new Date(start);
                  d.setDate(start.getDate() + i);
                  return d;
              });
          }, [mode, currentDate]);

          const todayStr = formatDateLocal(new Date());

          return (
              <div className="flex-1 flex flex-col overflow-hidden h-full">
                  <div className="flex border-b border-slate-200">
                      <div className="w-16 shrink-0 bg-slate-50 border-r border-slate-200"></div>
                      {days.map((d, i) => {
                          const dateStr = formatDateLocal(d);
                          const isToday = dateStr === todayStr;
                          return (
                              <div key={i} className={`flex-1 text-center py-2 border-r border-slate-100 last:border-0 ${isToday ? 'bg-yellow-50' : 'bg-white'}`}>
                                  <div className={`text-xs font-bold ${d.getDay()===0?'text-red-500':'text-slate-500'}`}>{['일','월','화','수','목','금','토'][d.getDay()]}</div>
                                  <div className={`text-lg font-black ${isToday ? 'text-slate-900' : ''}`}>{d.getDate()}</div>
                              </div>
                          );
                      })}
                  </div>
                  <div className="flex-1 overflow-y-auto relative bg-white" ref={scrollRef}>
                      {hours.map(h => (
                          <div key={h} className="flex h-20 border-b border-slate-100">
                              <div className="w-16 shrink-0 bg-slate-50 border-r border-slate-200 text-xs text-slate-400 text-center pt-2">{h}:00</div>
                              {days.map((d, i) => {
                                  const dateStr = formatDateLocal(d);
                                  const timeStr = `${h.toString().padStart(2,'0')}:00`;
                                  return (
                                      <div 
                                        key={i} 
                                        className="flex-1 border-r border-slate-100 relative group" 
                                        onClick={() => onCellClick(d)}
                                        onDragOver={(e) => e.preventDefault()}
                                        onDrop={() => onDrop(dateStr, timeStr)}
                                      >
                                          <div className="absolute top-1/2 w-full border-t border-slate-50 border-dashed"></div>
                                      </div>
                                  );
                              })}
                          </div>
                      ))}
                      
                      {days.map((d, colIndex) => {
                          const dateStr = formatDateLocal(d);
                          const daySchedules = schedules.filter(s => s.date === dateStr);
                          return daySchedules.map(s => {
                              const [h, m] = s.startTime.split(':').map(Number);
                              const [eh, em] = s.endTime.split(':').map(Number);
                              if (h < 9 || h > 22) return null; 
                              const top = ((h - 9) * 80) + (m / 60 * 80); 
                              const durationMins = ((eh * 60) + em) - ((h * 60) + m);
                              const height = (durationMins / 60) * 80;
                              return (
                                  <div 
                                      key={s.id}
                                      onClick={(e) => { e.stopPropagation(); s.status === 'completed' ? onGoToHistory(s) : onScheduleClick(s); }}
                                      draggable
                                      onDragStart={(e) => { e.dataTransfer.setData('text/plain', JSON.stringify({ type: 'schedule', data: s })); }}
                                      className={`absolute mx-1 rounded p-1 text-[10px] font-bold shadow-sm border-l-4 overflow-hidden hover:z-10 hover:scale-105 transition cursor-pointer ${s.status === 'completed' ? 'bg-slate-200 border-slate-400 text-slate-500' : s.status === 'noshow' ? 'bg-red-100 border-red-500 text-red-900 opacity-70' : s.type === 'reserve' ? 'bg-purple-100 border-purple-500 text-purple-900' : 'bg-yellow-100 border-yellow-500 text-slate-900'}`}
                                      style={{ top: `${top}px`, height: `${height}px`, left: `calc(4rem + ${(100 - 4)/days.length * colIndex}%)`, width: `calc((100% - 4rem) / ${days.length} - 8px)` }}
                                  >
                                      {s.startTime} {s.clientName} {s.status === 'completed' ? (s.type === 'reserve' ? '(상담완료)' : '(수업완료)') : ''}
                                  </div>
                              );
                          });
                      })}
                  </div>
              </div>
          );
        }

        // Add Schedule Modal
        function AddScheduleModal({ clients, schedules, initialDate, defaultDuration, onClose, onSubmit, showToast, onConflict, prefilledData, user }) {
            const [targetType, setTargetType] = useState('client');
            const [targetId, setTargetId] = useState('');
            const [mode, setMode] = useState('single'); 
            const [singleDate, setSingleDate] = useState(initialDate ? formatDateLocal(initialDate) : formatDateLocal(new Date()));
            const [singleTime, setSingleTime] = useState('14:00');
            const [weekDays, setWeekDays] = useState({ 1: false, 2: false, 3: false, 4: false, 5: false, 6: false, 0: false });
            const [weekTimes, setWeekTimes] = useState({ 1: '14:00', 2: '14:00', 3: '14:00', 4: '14:00', 5: '14:00', 6: '14:00', 0: '14:00' });
            const [selectedDates, setSelectedDates] = useState([]);
            const [monthlyTime, setMonthlyTime] = useState('14:00');
            const [isRepeat, setIsRepeat] = useState(false);
            const [endDate, setEndDate] = useState('');

            // [MODIFIED] Use loose or string comparison for finding target client to handle type mismatch
            const targetClient = clients.find(c => String(c.id) === String(targetId));

            useEffect(() => {
                if (prefilledData) {
                    setTargetType(prefilledData.clientType || 'client');
                    setTargetId(prefilledData.clientId || '');
                    setMode('single');
                    if (prefilledData.date) setSingleDate(prefilledData.date);
                    if (prefilledData.startTime) setSingleTime(prefilledData.startTime);
                }
            }, [prefilledData]);

            const toggleDate = (dateStr) => {
                if(selectedDates.includes(dateStr)) setSelectedDates(selectedDates.filter(d => d !== dateStr));
                else setSelectedDates([...selectedDates, dateStr]);
            };

            const handleRegister = async () => {
                if (!targetId) { showToast('대상을 선택해주세요.'); return; }
                if (mode === 'single' && !singleDate) { showToast('날짜를 입력해주세요.'); return; }
                if (mode === 'weekly') {
                    const days = Object.keys(weekDays).filter(d => weekDays[d]);
                    if(days.length === 0) { showToast('요일을 하나 이상 선택해주세요.'); return; }
                }
                if (mode === 'monthly' && selectedDates.length === 0) { showToast('날짜를 선택해주세요.'); return; }

                const newSchedules = [];
                // Check if targetClient exists. Since we filter drop-down, it should exist, but safety first.
                if (!targetClient) { showToast('유효하지 않은 대상입니다.'); return; }
                
                const baseClient = { teacher_id: user.teacherId, client_id: targetClient.id, client_name: targetClient.name, type: targetClient.type };

                const createSch = (dStr, tStr) => {
                    const [h, m] = tStr.split(':').map(Number);
                    const endTimeDate = new Date(); endTimeDate.setHours(h, m + (targetClient.sessionTime || defaultDuration));
                    return { 
                        ...baseClient, date: dStr, start_time: tStr, end_time: endTimeDate.toTimeString().slice(0, 5), status: 'scheduled' 
                    };
                };

                const generateList = [];

                if (mode === 'single') {
                    generateList.push({d: singleDate, t: singleTime});
                    if (isRepeat) {
                       for(let i=1; i<=4; i++) {
                           const d = new Date(singleDate); d.setDate(d.getDate() + (i*7));
                           const dStr = formatDateLocal(d);
                           if (endDate && d > new Date(endDate)) break;
                           generateList.push({d: dStr, t: singleTime});
                       }
                    }
                } else if (mode === 'weekly') {
                    const days = Object.keys(weekDays).filter(d => weekDays[d]).map(Number);
                    const limit = isRepeat ? 30 : 7;
                    const start = new Date();
                    for(let i=0; i<limit; i++) {
                        const d = new Date(start); d.setDate(d.getDate() + i);
                        if (endDate && d > new Date(endDate)) break;
                        if (days.includes(d.getDay())) {
                            generateList.push({d: formatDateLocal(d), t: weekTimes[d.getDay()]});
                        }
                    }
                } else if (mode === 'monthly') {
                    selectedDates.forEach(dStr => {
                        generateList.push({d: dStr, t: monthlyTime});
                        if (isRepeat) {
                            for(let i=1; i<=3; i++) { 
                                const d = new Date(dStr); d.setMonth(d.getMonth() + i);
                                const nextDStr = formatDateLocal(d);
                                if (endDate && d > new Date(endDate)) break;
                                generateList.push({d: nextDStr, t: monthlyTime});
                            }
                        }
                    });
                }

                // Insert to DB
                const { data, error } = await supabase.from('schedules').insert(generateList.map(item => createSch(item.d, item.t))).select();
                
                if (!error) {
                    onSubmit(keysToCamel(data));
                } else {
                    alert("등록 실패: " + error.message);
                }
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
                    <div className="bg-white rounded-2xl w-full max-w-[500px] p-6 shadow-2xl animate-fade-in max-h-[90vh] overflow-y-auto">
                        <div className="flex justify-between items-center mb-6"><h3 className="font-bold text-xl">수업 등록</h3><button onClick={onClose}><X size={20}/></button></div>
                        <div className="space-y-6">
                            <div className="bg-slate-50 p-4 rounded-xl">
                                <div className="flex gap-4 mb-3">
                                    <label className="flex items-center gap-2 cursor-pointer">
                                        <input 
                                            type="radio" 
                                            checked={targetType==='client'} 
                                            onChange={()=>{ setTargetType('client'); setTargetId(''); }} 
                                            className="accent-slate-900"
                                        /> 
                                        <span className="text-sm font-bold">내담자</span>
                                    </label>
                                    <label className="flex items-center gap-2 cursor-pointer">
                                        <input 
                                            type="radio" 
                                            checked={targetType==='reserve'} 
                                            onChange={()=>{ setTargetType('reserve'); setTargetId(''); }} 
                                            className="accent-slate-900"
                                        /> 
                                        <span className="text-sm font-bold">상담 예약자</span>
                                    </label>
                                </div>
                                <select className="w-full border p-2 rounded-lg bg-white" value={targetId} onChange={e=>setTargetId(e.target.value)}>
                                    <option value="">대상을 선택하세요</option>
                                    {clients.filter(c=>c.type===targetType && c.status !== 'terminated' && c.status !== 'paused').map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                                </select>
                            </div>
                            <div className="flex bg-slate-100 p-1 rounded-lg">
                                {[{id:'single',l:'하루 수업'},{id:'weekly',l:'요일 반복'},{id:'monthly',l:'날짜 지정'}].map(m=><button key={m.id} onClick={()=>setMode(m.id)} className={`flex-1 py-2 rounded-md text-sm font-bold transition ${mode===m.id?'bg-white shadow text-slate-900':'text-slate-400'}`}>{m.l}</button>)}
                            </div>
                            <div className="border p-4 rounded-xl">
                                {mode === 'single' && <div className="grid grid-cols-2 gap-4"><div><label className="text-xs font-bold text-slate-500 mb-1 block">날짜</label><input type="date" className="w-full border p-2 rounded-lg" value={singleDate} onChange={e=>setSingleDate(e.target.value)}/></div><div><label className="text-xs font-bold text-slate-500 mb-1 block">시작 시간</label><input type="time" className="w-full border p-2 rounded-lg" value={singleTime} onChange={e=>setSingleTime(e.target.value)}/></div></div>}
                                {mode === 'weekly' && <div className="space-y-3"><p className="text-xs font-bold text-slate-500">요일 선택 및 시간 설정</p>{['일','월','화','수','목','금','토'].map((d, i) => (<div key={i} className={`flex items-center gap-3 p-2 rounded-lg ${weekDays[i] ? 'bg-yellow-50 border border-yellow-200' : 'bg-slate-50'}`}><input type="checkbox" checked={weekDays[i]} onChange={e=>setWeekDays({...weekDays, [i]: e.target.checked})} className="w-4 h-4 accent-slate-900"/><span className={`w-8 text-sm font-bold ${i===0?'text-red-500':'text-slate-700'}`}>{d}</span><input type="time" disabled={!weekDays[i]} value={weekTimes[i]} onChange={e=>setWeekTimes({...weekTimes, [i]: e.target.value})} className="border p-1 rounded bg-white text-sm disabled:opacity-50"/></div>))}</div>}
                                {mode === 'monthly' && <div><div className="flex justify-between items-center mb-2"><span className="text-xs font-bold text-slate-500">날짜 다중 선택</span><input type="time" className="border p-1 rounded text-sm" value={monthlyTime} onChange={e=>setMonthlyTime(e.target.value)}/></div><div className="grid grid-cols-7 gap-1 text-center bg-slate-50 p-2 rounded-lg">{Array.from({length:30},(_,i)=>i+1).map(d=>{const dStr = formatDateLocal(new Date(new Date().setDate(d)));const isSel = selectedDates.includes(dStr);return <button key={d} onClick={()=>toggleDate(dStr)} className={`p-2 text-sm rounded ${isSel?'bg-slate-900 text-white':'hover:bg-slate-200'}`}>{d}</button>})}</div><p className="text-right text-xs text-slate-400 mt-2">{selectedDates.length}개 날짜 선택됨</p></div>}
                            </div>
                            <div className="bg-slate-50 p-4 rounded-xl space-y-3"><div className="flex justify-between items-center"><span className="font-bold text-sm">반복 설정</span><KakaoSwitch isOn={isRepeat} onToggle={()=>setIsRepeat(!isRepeat)} /></div>{isRepeat && <div className="animate-fade-in space-y-2"><div className="text-xs text-slate-500 font-bold">{mode === 'monthly' ? '매월 같은 날짜에 반복' : '매주 같은 요일에 반복'}</div><div className="flex items-center gap-2"><span className="text-sm">종료 날짜:</span><input type="date" className="border p-1 rounded bg-white text-sm" value={endDate} onChange={e=>setEndDate(e.target.value)} /><span className="text-xs text-slate-400">(미입력 시 계속)</span></div></div>}</div>
                        </div>
                        <button onClick={handleRegister} className="w-full mt-6 bg-[#FDE047] py-4 rounded-xl font-bold text-slate-900 hover:bg-yellow-300 shadow-lg">수업 등록 완료</button>
                    </div>
                </div>
            );
        }

        function ScheduleActionModal({ schedule, onClose, onStart, onNoShow, onChange, showToast, onDelete }) {
            const [mode, setMode] = useState('main'); 
            const [editData, setEditData] = useState({ date: schedule.date, time: schedule.startTime });

            const handleStart = () => {
                if (checkIsMobile()) {
                    showToast("모바일에서는 수업이 불가능합니다.");
                    return;
                }
                onStart();
            };

            const handleDelete = () => {
                const itemType = schedule.type === 'reserve' ? '상담' : '수업';
                showToast(`${itemType}이 삭제되었습니다.`);
                onDelete();
                onClose();
            };
            
            const handleComplete = async () => {
                const itemType = schedule.type === 'reserve' ? '상담' : '수업';
                const { error } = await supabase.from('schedules').update({ status: 'completed' }).eq('id', schedule.id);
                if (!error) {
                    showToast(`${itemType}이 완료되었습니다.`);
                    window.location.reload(); // 전체 새로고침하여 상태 반영
                }
                onClose();
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4" onClick={onClose}>
                    <div className="bg-white rounded-2xl w-full max-w-[400px] p-6 shadow-2xl animate-fade-in" onClick={e => e.stopPropagation()}>
                        {mode !== 'delete_confirm' && mode !== 'complete_confirm' && (
                            <div className="flex justify-between items-start mb-6">
                                <div><h3 className="text-2xl font-black">{schedule.clientName}</h3><p className="text-slate-500 text-sm">{schedule.date} {schedule.startTime} ~ {schedule.endTime}</p></div>
                                <button onClick={onClose}><X size={20}/></button>
                            </div>
                        )}
                        {mode === 'main' ? (
