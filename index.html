        function ClientFormPage({ type, defaultSessionTime, onClose, onSubmit, initialData, customTitle, customButtonText, isConsultationMode, showToast }) {
            const isReserve = type === 'reserve';
            const [form, setForm] = useState({ name: '', gender: '남', dob: '', age: '', contact: '', address: '', guardians: [{ name: '', relation: '', contact: '' }], sessionTime: defaultSessionTime, diagnosis: '', memo: '', initialConsult: '', areas: { lang: [], cogn: [], behv: [] }, reserveDate: '', reserveTime: '' });
            
            useEffect(() => {
                if (initialData) {
                    setForm({
                        ...initialData,
                        guardians: initialData.guardians || [{ name: '', relation: '', contact: '' }],
                        areas: initialData.areas || { lang: [], cogn: [], behv: [] }
                    });
                }
            }, [initialData]);

            // Auto calculate age if DOB changes
            useEffect(() => { if(form.dob) setForm(p => ({ ...p, age: calculateAge(p.dob) })); }, [form.dob]);
            
            const handleSubmit = (e) => { 
                e.preventDefault(); 
                if (!form.name || !form.gender) {
                    if (showToast) showToast('이름과 성별은 필수입니다.');
                    else alert('이름과 성별은 필수입니다.');
                    return;
                }
                
                // Final check before submit (e.g. valid DOB year)
                // If only year is entered (from UI), dob might be 'YYYY-01-01'.
                
                onSubmit({ ...form, type }); 
            };
            const addAreaTag = (area, value) => { if(!value.trim()) return; setForm(prev => ({ ...prev, areas: { ...prev.areas, [area]: [...prev.areas[area], value] } })); };

            return (
                <div className="flex flex-col h-full bg-white animate-fade-in overflow-hidden">
                    <div className="p-6 border-b flex justify-between items-center bg-white sticky top-0 z-10"><div className="flex items-center gap-4"><button onClick={onClose}><ChevronLeft/></button><h2 className="text-2xl font-black">{customTitle ? customTitle : (initialData ? '정보 수정' : (isReserve?'상담 예약자 등록':'내담자 등록'))}</h2></div><button onClick={onClose}>닫기</button></div>
                    <div className="flex-1 overflow-y-auto p-8 max-w-4xl mx-auto w-full space-y-8">
                        <section><h3 className="font-bold text-lg mb-4">기본 정보</h3><div className="grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-50 p-6 rounded-2xl">
                            <input placeholder="이름" value={form.name} onChange={e=>setForm({...form, name:e.target.value})} className="border p-3 rounded-xl"/>
                            <div className="flex gap-2">{['남','여'].map(g=><button key={g} type="button" onClick={()=>setForm({...form, gender:g})} className={`flex-1 border rounded-xl font-bold ${form.gender===g?'bg-[#FDE047]':'bg-white'}`}>{g}</button>)}</div>
                            <div className="flex gap-2 items-center">
                                <input 
                                    type="number" 
                                    placeholder="YYYY"
                                    className="w-24 border p-3 rounded-xl text-center outline-none focus:border-[#FDE047]"
                                    value={form.dob ? form.dob.split('-')[0] : ''}
                                    onChange={(e) => {
                                        const val = e.target.value;
                                        // If empty year, clear DOB
                                        if (!val) { setForm({...form, dob: ''}); return; }
                                        const parts = form.dob ? form.dob.split('-') : ['','',''];
                                        const m = parts[1] || '01'; // Default Month 01
                                        const d = parts[2] || '01'; // Default Day 01
                                        setForm({...form, dob: `${val}-${m}-${d}`});
                                    }}
                                />
                                <span className="text-slate-400 font-bold text-xs">년</span>
                                <select 
                                    className="flex-1 border p-3 rounded-xl text-center outline-none focus:border-[#FDE047] appearance-none bg-white"
                                    value={form.dob ? parseInt(form.dob.split('-')[1] || 1) : ''}
                                    onChange={(e) => {
                                        const val = e.target.value.toString().padStart(2, '0');
                                        const parts = form.dob ? form.dob.split('-') : [new Date().getFullYear(),'01','01'];
                                        const y = parts[0] || new Date().getFullYear();
                                        const d = parts[2] || '01';
                                        setForm({...form, dob: `${y}-${val}-${d}`});
                                    }}
                                >
                                    <option value="" disabled>월</option>
                                    {Array.from({length: 12},(_,i)=>i+1).map(v=><option key={v} value={v}>{v}</option>)}
                                </select>
                                <span className="text-slate-400 font-bold text-xs">월</span>
                                <select 
                                    className="flex-1 border p-3 rounded-xl text-center outline-none focus:border-[#FDE047] appearance-none bg-white"
                                    value={form.dob ? parseInt(form.dob.split('-')[2] || 1) : ''}
                                    onChange={(e) => {
                                        const val = e.target.value.toString().padStart(2, '0');
                                        const parts = form.dob ? form.dob.split('-') : [new Date().getFullYear(),'01','01'];
                                        const y = parts[0] || new Date().getFullYear();
                                        const m = parts[1] || '01';
                                        setForm({...form, dob: `${y}-${m}-${val}`});
                                    }}
                                >
                                    <option value="" disabled>일</option>
                                    {Array.from({length: 31},(_,i)=>i+1).map(v=><option key={v} value={v}>{v}</option>)}
                                </select>
                                <span className="text-slate-400 font-bold text-xs">일</span>
                                <input type="number" readOnly className="w-20 border p-3 rounded-xl text-center bg-slate-100 text-slate-500 ml-2" value={form.age} />
                                <span className="text-slate-400 font-bold text-xs">세</span>
                            </div>
                            <input placeholder="연락처" className="border p-3 rounded-xl" value={form.contact} onChange={e=>setForm({...form, contact:e.target.value})}/>
                            <input placeholder="주소" className="border p-3 rounded-xl md:col-span-2" value={form.address} onChange={e=>setForm({...form, address:e.target.value})}/>
                            {/* [RESTORED] Default Session Time */}
                            <div className="md:col-span-2">
                                <label className="text-xs font-bold text-slate-500 mb-1 block">기본 수업 시간 (분)</label>
                                <input type="number" className="border p-3 rounded-xl w-full" value={form.sessionTime} onChange={e=>setForm({...form, sessionTime: parseInt(e.target.value) || 0})}/>
                            </div>
                        </div></section>
                        <section>
                            <h3 className="font-bold text-lg mb-4">보호자 정보 (최대 3명)</h3>
                            <div className="bg-slate-50 p-6 rounded-2xl border border-slate-100 space-y-3">
                                {form.guardians.map((g, i) => (
                                    <div key={i} className="flex gap-2">
                                        <input placeholder="이름" className="flex-1 border p-2 rounded-lg" value={g.name} onChange={e=>{const newG=[...form.guardians]; newG[i].name=e.target.value; setForm({...form, guardians:newG})}} />
                                        <input placeholder="관계" className="w-20 border p-2 rounded-lg" value={g.relation} onChange={e=>{const newG=[...form.guardians]; newG[i].relation=e.target.value; setForm({...form, guardians:newG})}} />
                                        <input placeholder="연락처" className="flex-1 border p-2 rounded-lg" value={g.contact} onChange={e=>{const newG=[...form.guardians]; newG[i].contact=e.target.value; setForm({...form, guardians:newG})}} />
                                    </div>
                                ))}
                                {form.guardians.length < 3 && <button type="button" onClick={()=>setForm({...form, guardians:[...form.guardians, {name:'',relation:'',contact:''}]})} className="text-sm font-bold text-slate-500">+ 보호자 추가</button>}
                            </div>
                        </section>
                        <section><h3 className="font-bold text-lg mb-4">임상 정보</h3><div className="bg-slate-50 p-6 rounded-2xl space-y-4">
                            <input placeholder="진단명" className="w-full border p-3 rounded-xl" value={form.diagnosis} onChange={e=>setForm({...form, diagnosis:e.target.value})}/>
                            <textarea placeholder="초기 상담" className="w-full border p-3 rounded-xl h-24" value={form.initialConsult} onChange={e=>setForm({...form, initialConsult:e.target.value})}/>
                            <AreaInput label="언어" items={form.areas.lang} onAdd={v=>addAreaTag('lang',v)} onDelete={i=>{const n=[...form.areas.lang];n.splice(i,1);setForm({...form, areas:{...form.areas, lang:n}})}}/>
                            <AreaInput label="인지" items={form.areas.cogn} onAdd={v=>addAreaTag('cogn',v)} onDelete={i=>{const n=[...form.areas.cogn];n.splice(i,1);setForm({...form, areas:{...form.areas, cogn:n}})}}/>
                            <AreaInput label="행동" items={form.areas.behv} onAdd={v=>addAreaTag('behv',v)} onDelete={i=>{const n=[...form.areas.behv];n.splice(i,1);setForm({...form, areas:{...form.areas, behv:n}})}}/>
                             {/* [RESTORED] Memo */}
                             <div className="mt-2">
                                <label className="text-xs font-bold text-slate-500 mb-1 block">특이사항/메모</label>
                                <textarea placeholder="특이사항을 입력하세요." className="w-full border p-3 rounded-xl h-24" value={form.memo} onChange={e=>setForm({...form, memo:e.target.value})}/>
                            </div>
                        </div></section>
                    </div>
                    <div className="p-6 border-t flex justify-end"><button onClick={handleSubmit} className="px-8 py-3 bg-[#FDE047] rounded-xl font-bold">{customButtonText ? customButtonText : (initialData ? '수정 완료' : '등록 완료')}</button></div>
                </div>
            )
        }

        function AreaInput({ label, items, onAdd, onDelete }) {
            const [val, setVal] = useState('');
            return (<div><label className="text-sm font-bold mb-1 block">{label}</label><div className="flex gap-2 mb-2"><input className="flex-1 border p-2 rounded text-sm" value={val} onChange={e=>setVal(e.target.value)} onKeyDown={e=>e.key==='Enter'&&(onAdd(val),setVal(''))}/><button type="button" onClick={()=>{onAdd(val);setVal('')}} className="bg-slate-200 px-3 rounded font-bold text-sm">추가</button></div><div className="flex flex-wrap gap-1">{items.map((t,i)=><span key={i} className="bg-white border px-2 py-0.5 rounded text-xs flex items-center gap-1">{t}<button type="button" onClick={()=>onDelete(i)}><X size={10}/></button></span>)}</div></div>);
        }

        function ClientDetailPage({ client, schedules, setSchedules, onClose, onUpdate, onDelete, onConvert, showToast, teacherName, onStartSession, onEdit, initialTab }) {
            // [FIXED] Initialize activeTab with initialTab if present
            const [activeTab, setActiveTab] = useState(initialTab || 'info');
            const [actionStep, setActionStep] = useState(null); // 'confirm_delete', 'confirm_pause', 'confirm_terminate'
            const [verifyName, setVerifyName] = useState('');
            const [showStartModal, setShowStartModal] = useState(false); 

            useEffect(() => {
                // [FIXED] Reset to 'info' if initialTab is missing, otherwise set to initialTab
                if (initialTab) {
                    setActiveTab(initialTab);
                } else {
                    setActiveTab('info');
                }
            }, [initialTab, client.id]);

            const clientHistory = schedules.filter(s => s.clientId === client.id).sort((a,b) => new Date(b.date+'T'+b.startTime) - new Date(a.date+'T'+a.startTime));

            const handleDelete = () => {
                if (verifyName !== client.name) return showToast('이름이 일치하지 않습니다.');
                // Direct call, no window.confirm
                onDelete(client.id);
            };
            
            const handleTerminate = () => {
                if (verifyName !== client.name) return showToast('이름이 일치하지 않습니다.');
                onUpdate({ ...client, status: 'terminated' });
                showToast(`수고하셨습니다 ${teacherName} 선생님`);
                setActionStep(null);
            };
            
            const handlePause = () => {
                 if (verifyName !== client.name) return showToast('이름이 일치하지 않습니다.');
                 onUpdate({ ...client, status: 'paused' });
                 showToast('수업이 정지되었습니다.');
                 setActionStep(null);
            };

            const handleResume = () => {
                onUpdate({ ...client, status: 'active' }); 
                showToast('수업이 재개되었습니다.');
                setActionStep(null);
            };

            const handleUnscheduledStart = async () => {
                if (checkIsMobile()) {
                    showToast("모바일에서는 수업이 불가능합니다.");
                    return;
                }

                const now = new Date();
                const startTime = now.toTimeString().slice(0, 5);
                const endDate = new Date(now.getTime() + (client.sessionTime || 50) * 60000);
                const endTime = endDate.toTimeString().slice(0, 5);

                const payload = {
                    teacher_id: client.teacherId,
                    client_id: client.id,
                    client_name: client.name,
                    type: client.type,
                    date: formatDateLocal(now),
                    start_time: startTime,
                    end_time: endTime,
                    status: 'scheduled' 
                };

                const { data, error } = await supabase.from('schedules').insert([payload]).select();
                if(!error) {
                    const newSchedule = keysToCamel(data[0]);
                    setSchedules(prev => [...prev, newSchedule]);
                    onStartSession(newSchedule);
                    setShowStartModal(false);
                }
            };

            const tabs = [{id:'info',l:'정보'}];
            if (client.type === 'client') {
                tabs.push({id:'history',l:'수업이력'});
            } else {
                tabs.push({id:'history',l:'상담이력'});
            }

            const getActionTitle = () => {
                switch(actionStep) {
                    case 'confirm_delete': return '삭제 확인:';
                    case 'confirm_pause': return '수업 정지 확인:';
                    case 'confirm_terminate': return '종결 확인:';
                    default: return '';
                }
            };

            const handleActionConfirm = async () => {
                if (verifyName !== client.name) return showToast('이름이 일치하지 않습니다.');

                if (actionStep === 'confirm_delete') {
                    handleDelete();
                    return;
                }

                let shouldDeleteFuture = false;
                if (actionStep === 'confirm_terminate' || actionStep === 'confirm_pause') {
                    shouldDeleteFuture = confirm("앞으로의 모든 일정을 삭제하시겠습니까?\n(확인 시 오늘 이후의 모든 예약된 일정이 삭제됩니다.)");
                }

                const newStatus = actionStep === 'confirm_terminate' ? 'terminated' : 'paused';

                // 1. Update Client Status
                await onUpdate({ ...client, status: newStatus });

                // 2. Delete Schedules if confirmed
                if (shouldDeleteFuture) {
                    const today = new Date().toISOString().split('T')[0];
                    const { error } = await supabase
                        .from('schedules')
                        .delete()
                        .eq('client_id', client.id)
                        .gte('date', today);

                    if (!error) {
                        // Update local schedule state
                        setSchedules(prev => prev.filter(s => 
                            !(s.clientId === client.id && s.date >= today)
                        ));
                        showToast('상태 변경 및 미래 일정이 삭제되었습니다.');
                    } else {
                        showToast('상태는 변경되었으나 일정 삭제 중 오류가 발생했습니다.');
                    }
                } else {
                    showToast('상태가 변경되었습니다.');
                }
                
                setActionStep(null);
                setVerifyName('');
            };

            return (
                <div className="flex flex-col h-full bg-white animate-fade-in relative">
                    <div className="p-6 border-b flex justify-between items-center sticky top-0 bg-white z-10">
                        <div className="flex items-center gap-4">
                            <button onClick={onClose}><ChevronLeft/></button>
                            <div className="flex items-center gap-2">
                                <h2 className={`text-2xl font-black ${(client.status === 'terminated' || client.status === 'paused') ? 'text-gray-400' : 'text-slate-900'}`}>{client.name}</h2>
                                {client.status === 'terminated' && <span className="bg-gray-200 text-gray-500 text-xs px-2 py-1 rounded font-bold">수업종결</span>}
                                {client.status === 'paused' && <span className="bg-orange-100 text-orange-600 text-xs px-2 py-1 rounded font-bold">수업정지</span>}
                            </div>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={onEdit} className="bg-slate-100 px-3 py-1.5 rounded-lg text-sm font-bold hover:bg-slate-200">수정</button>
                            <button onClick={onClose} className="p-1.5 hover:bg-slate-100 rounded-lg"><X size={20}/></button>
                        </div>
                    </div>
                    <div className="flex border-b px-6">{tabs.map(t=><button key={t.id} onClick={()=>setActiveTab(t.id)} className={`px-6 py-4 font-bold border-b-2 ${activeTab===t.id?'border-[#FDE047]':'border-transparent text-slate-400'}`}>{t.l}</button>)}</div>
                    <div className="flex-1 overflow-y-auto p-8 pb-32">
                        {activeTab==='info' && (
                            <div className="space-y-6">
                                <div className="bg-slate-50 p-6 rounded-2xl space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><span className="text-xs text-slate-400 font-bold block">연락처</span><p className="font-bold">{client.contact || '-'}</p></div>
                                        <div><span className="text-xs text-slate-400 font-bold block">생년월일 (나이)</span><p>{client.dob} (만 {client.age}세)</p></div>
                                        <div><span className="text-xs text-slate-400 font-bold block">기본 수업 시간</span><p>{client.sessionTime || 50}분</p></div>
                                        <div className="col-span-2"><span className="text-xs text-slate-400 font-bold block">주소</span><p>{client.address || '-'}</p></div>
                                    </div>
                                    <div className="border-t border-slate-200 pt-4">
                                        <span className="text-xs text-slate-400 font-bold block mb-2">보호자 정보</span>
                                        {client.guardians && client.guardians.map((g, i) => (
                                            <div key={i} className="flex gap-2 text-sm mb-1"><span className="font-bold w-16">{g.name}</span><span className="text-slate-500 w-10">({g.relation})</span><span>{g.contact}</span></div>
                                        ))}
                                    </div>
                                </div>
                                <div className="bg-slate-50 p-6 rounded-2xl space-y-4">
                                    <div className="flex justify-between border-b pb-2"><span className="text-slate-400 text-sm font-bold">진단명</span><span className="font-bold">{client.diagnosis}</span></div>
                                    <div className="border-b pb-2"><span className="text-slate-400 text-sm font-bold block mb-1">초기 상담</span><p className="text-sm">{client.initialConsult}</p></div>
                                    {client.areas && Object.entries(client.areas).map(([k,v])=>v.length>0&&<div key={k} className="flex gap-2"><span className="font-bold text-sm w-10">{k}</span><div className="flex flex-wrap gap-1">{v.map(t=><span key={t} className="bg-white border px-2 rounded text-xs">{t}</span>)}</div></div>)}
                                    <div className="mt-4"><span className="text-slate-400 text-sm font-bold block mb-1">메모</span><p className="text-sm whitespace-pre-wrap">{client.memo}</p></div>
                                </div>

                                {/* Action Buttons Section - Fully custom UI, no window.confirm */}
                                <div className="pt-8 border-t border-slate-100">
                                    <div className="flex gap-2 items-center flex-wrap">
                                        {actionStep ? (
                                            <div className="flex items-center gap-2 w-full animate-fade-in bg-slate-50 p-2 rounded-lg border border-slate-200">
                                                <span className="text-sm font-bold text-slate-900 whitespace-nowrap">{getActionTitle()}</span>
                                                <input placeholder="이름 입력" value={verifyName} onChange={e=>setVerifyName(e.target.value)} className="border p-2 rounded-lg text-sm flex-1 min-w-[100px]" />
                                                <button onClick={handleActionConfirm} className="bg-slate-900 text-white px-4 py-2 rounded-lg font-bold text-sm hover:bg-slate-700">확인</button>
                                                <button onClick={()=>{setActionStep(null); setVerifyName('')}} className="bg-white border px-4 py-2 rounded-lg font-bold text-sm">취소</button>
                                            </div>
                                        ) : (
                                            <>
                                                <button onClick={()=>setActionStep('confirm_delete')} className="bg-red-100 text-red-700 px-4 py-2 rounded-lg font-bold text-sm hover:bg-red-200">삭제</button>
                                                {client.type === 'client' && (
                                                    <>
                                                        {client.status === 'paused' || client.status === 'terminated' ? (
                                                            <button onClick={handleResume} className="bg-green-100 text-green-700 px-4 py-2 rounded-lg font-bold text-sm hover:bg-green-200">수업 재개</button>
                                                        ) : (
                                                            <button onClick={()=>setActionStep('confirm_pause')} className="bg-orange-100 text-orange-700 px-4 py-2 rounded-lg font-bold text-sm hover:bg-orange-200">수업 정지</button>
                                                        )}
                                                        
                                                        {client.status !== 'terminated' && (
                                                            <button onClick={()=>setActionStep('confirm_terminate')} className="bg-slate-200 text-slate-700 px-4 py-2 rounded-lg font-bold text-sm hover:bg-slate-300">수업 종결</button>
                                                        )}
                                                    </>
                                                )}
                                                {client.type === 'reserve' && (
                                                    <button onClick={()=>onConvert(client)} className="bg-purple-100 text-purple-700 px-4 py-2 rounded-lg font-bold text-sm hover:bg-purple-200">정규 내담자로 등록</button>
                                                )}
                                            </>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                        
                        {activeTab==='history' && <div className="space-y-4">
                            {clientHistory.length === 0 ? <p className="text-center text-slate-400 py-10">수업 이력이 없습니다.</p> : 
                            clientHistory.map(h => (
                                <div key={h.id} className="border p-4 rounded-xl flex justify-between items-center">
                                    <div><span className={`text-xs font-bold px-2 py-0.5 rounded text-white mb-1 inline-block ${h.status==='completed'?'bg-green-500':h.status==='noshow'?'bg-red-500':'bg-slate-300'}`}>{h.status==='completed'?'출석':h.status==='noshow'?'결석':'예정'}</span><p className="font-bold">{h.date} {h.startTime}</p></div>
                                    {h.memo && <span className="text-sm text-slate-500">{h.memo}</span>}
                                </div>
                            ))}
                        </div>}
                    </div>

                    {/* Floating Action Button */}
                    {client.type === 'client' && client.status !== 'terminated' && client.status !== 'paused' && (
                        <button 
                            onClick={() => setShowStartModal(true)}
                            className="absolute bottom-10 right-8 bg-[#FDE047] text-slate-900 px-6 py-3 rounded-full font-bold shadow-xl flex items-center gap-2 hover:scale-105 transition z-20"
                        >
                            <Play size={20} fill="#1e293b"/> 수업 시작
                        </button>
                    )}

                    {/* Unscheduled Start Modal */}
                    {client.type === 'client' && showStartModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4" onClick={() => setShowStartModal(false)}>
                            <div className="bg-white rounded-2xl w-full max-w-[400px] p-6 shadow-2xl animate-fade-in text-center" onClick={e => e.stopPropagation()}>
                                <div className="w-12 h-12 bg-yellow-100 text-yellow-600 rounded-full flex items-center justify-center mx-auto mb-4"><Play size={24} fill="#ca8a04"/></div>
                                <h3 className="font-bold text-xl mb-2">수업 바로 시작</h3>
                                <p className="text-slate-500 text-sm mb-6">스케줄에 없는 수업을 시작하시겠습니까?<br/>확인 시 수업 이력에 자동으로 기록됩니다.</p>
                                <div className="flex gap-2">
                                    <button onClick={() => setShowStartModal(false)} className="flex-1 py-3 border rounded-xl font-bold text-slate-600">취소</button>
                                    <button onClick={handleUnscheduledStart} className="flex-1 py-3 bg-[#FDE047] rounded-xl font-bold text-slate-900">시작하기</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            )
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
