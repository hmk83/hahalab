        function CalendarManager({ schedules, setSchedules, clients, dragItem, setDragItem, currentTime, onStartSession, onAddClick, showToast, onConflict, user, onDeleteSchedule, onGoToHistory }) {
            const [viewMode, setViewMode] = useState('month');
            const [currentDate, setCurrentDate] = useState(new Date());
            const [selectedSchedule, setSelectedSchedule] = useState(null);
            // const [detailModalSchedule, setDetailModalSchedule] = useState(null); // REMOVED: Integrated into selectedSchedule
            const scrollRef = useRef(null);

            const todayStr = formatDateLocal(new Date());

            const upcomingSchedules = useMemo(() => {
                // [FIX] Defensive check - prevent crash if schedules is null/undefined
                if (!Array.isArray(schedules)) {
                    console.warn('CalendarManager: schedules is not an array:', schedules);
                    return [];
                }

                const allToday = schedules
                    .filter(s => s.date === todayStr && s.status !== 'deleted')
                    .sort((a, b) => a.startTime.localeCompare(b.startTime));

                // Status-based categorization
                const ongoing = allToday.filter(s => s.status === 'in-progress');
                // Ended: Completed or Noshow. Sorted by time ASC in allToday, so last() is most recent.
                const ended = allToday.filter(s => s.status === 'completed' || s.status === 'noshow');
                // Upcoming: Scheduled. Sorted by time ASC.
                const upcoming = allToday.filter(s => s.status === 'scheduled');

                const prev = ended.length > 0 ? ended[ended.length - 1] : null;
                const curr = ongoing.length > 0 ? ongoing[0] : null;
                const nexts = upcoming;

                let result = [];

                if (curr) {
                    // Scenario 1: Has In-Progress -> [Prev, Curr, Next]
                    if (prev) result.push(prev);
                    result.push(curr);
                    if (nexts.length > 0) result.push(nexts[0]);
                } else {
                    // Scenario 2: No In-Progress
                    if (prev) {
                        // [Prev, Next, Next]
                        result.push(prev);
                        result.push(...nexts.slice(0, 2));
                    } else {
                        // [Next, Next, Next]
                        result.push(...nexts.slice(0, 3));
                    }
                }

                return result;
            }, [schedules, todayStr]);

            const handleToday = () => setCurrentDate(new Date());

            const handleMoreClick = () => {
                setViewMode('day');
                setCurrentDate(new Date());
                setTimeout(() => {
                    if (scrollRef.current) {
                        const now = new Date();
                        const offset = (now.getHours() - 9) * 80;
                        scrollRef.current.scrollTop = Math.max(0, offset);
                    }
                }, 100);
            };

            const handleScheduleClick = (sch) => setSelectedSchedule(sch);

            const handleStatusChange = async (id, status, memo = '') => {
                const { error } = await supabase.from('schedules').update({ status, memo }).eq('id', id);
                if (!error) {
                    setSchedules(prev => prev.map(s => s.id === id ? { ...s, status, memo: memo || s.memo } : s));
                    setSelectedSchedule(null);
                }
            };

            const handleReschedule = async (id, date, time) => {
                const { error } = await supabase.from('schedules').update({ date, start_time: time }).eq('id', id);
                if (!error) {
                    setSchedules(prev => prev.map(s => s.id === id ? { ...s, date, startTime: time } : s));
                    setSelectedSchedule(null);
                }
            };

            const calculateEndTime = (start, duration) => {
                const [h, m] = start.split(':').map(Number);
                const d = new Date(); d.setHours(h, m + duration);
                return d.toTimeString().slice(0, 5);
            };

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape') {
                        setSelectedSchedule(null);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, []);

            const handleDrop = async (targetDate, targetTime) => {
                if (!dragItem || !dragItem.type) return; // [FIX] Validate dragItem existence

                if (!targetTime) {
                    // Month view drop (no time)
                    if (dragItem.type === 'schedule') {
                        // Preserve original time, update date only
                        targetTime = dragItem.data.startTime;
                    } else {
                        // New client drop, default to current time or 09:00
                        const now = new Date();
                        targetTime = now.toTimeString().slice(0, 5);
                    }
                }

                if (dragItem.type === 'client') {
                    const client = dragItem.data;
                    const newEndTime = calculateEndTime(targetTime, client.sessionTime || 50);

                    const conflicts = (Array.isArray(schedules) ? schedules : []).filter(s =>
                        s.date === targetDate && s.status !== 'deleted' && s.status !== 'noshow' &&
                        checkTimeOverlap(targetTime, newEndTime, s.startTime, s.endTime)
                    );

                    if (conflicts.length > 0) {
                        const newSch = {
                            clientId: client.id, clientName: client.name, type: client.type,
                            date: targetDate, startTime: targetTime, endTime: newEndTime, status: 'scheduled'
                        };
                        onConflict({ newSchedule: newSch, conflicts });
                    } else {
                        const payload = {
                            teacher_id: user.teacherId,
                            client_id: client.id, client_name: client.name, type: client.type,
                            date: targetDate, start_time: targetTime, end_time: newEndTime, status: 'scheduled'
                        };
                        const { data, error } = await supabase.from('schedules').insert([payload]).select();
                        if (!error) setSchedules(prev => [...prev, keysToCamel(data[0])]);
                    }
                } else if (dragItem.type === 'schedule') {
                    const schedule = dragItem.data;
                    const [oldH, oldM] = schedule.startTime.split(':').map(Number);
                    const [oldEH, oldEM] = schedule.endTime.split(':').map(Number);
                    const durationMins = (oldEH * 60 + oldEM) - (oldH * 60 + oldM);

                    const [newH, newM] = targetTime.split(':').map(Number);
                    const newEndDate = new Date(); newEndDate.setHours(newH, newM + durationMins);
                    const newEndTime = newEndDate.toTimeString().slice(0, 5);

                    const conflicts = schedules.filter(s =>
                        s.id !== schedule.id && s.date === targetDate && s.status !== 'deleted' && s.status !== 'noshow' &&
                        checkTimeOverlap(targetTime, newEndTime, s.startTime, s.endTime)
                    );

                    if (conflicts.length > 0) {
                        const newSch = { ...schedule, date: targetDate, startTime: targetTime, endTime: newEndTime };
                        onConflict({ newSchedule: newSch, conflicts, originalSchedule: schedule });
                    } else {
                        const { error } = await supabase.from('schedules').update({ date: targetDate, start_time: targetTime, end_time: newEndTime }).eq('id', schedule.id);
                        if (!error) setSchedules(prev => prev.map(s => s.id === schedule.id ? { ...s, date: targetDate, startTime: targetTime, endTime: newEndTime } : s));
                    }
                }
            };

            const handleViewChange = (mode, date) => {
                setViewMode(mode);
                if (date) setCurrentDate(date);
            };

            return (
                <div className="flex flex-col h-full animate-fade-in">
                    <div className="bg-slate-50 border-b border-slate-100 p-4 flex gap-4 overflow-x-auto shrink-0 items-stretch">
                        {upcomingSchedules.length === 0 && <div className="text-slate-400 font-medium p-4 flex items-center">금일 예정된 수업이 없습니다.</div>}
                        {upcomingSchedules.map(sch => (
                            <div
                                key={sch.id}
                                onClick={() => handleScheduleClick(sch)}
                                className={`bg-white rounded-xl shadow-sm p-4 min-w-[240px] border-l-4 relative group transition-all flex flex-col justify-center ${sch.status === 'noshow' ? 'border-red-400 opacity-80' : sch.status === 'completed' ? 'border-slate-400 bg-slate-50 cursor-pointer hover:shadow-md hover:-translate-y-0.5' : 'border-[#FDE047] cursor-pointer hover:shadow-md hover:-translate-y-0.5'}`}
                            >
                                <div className="flex justify-between items-start mb-2">
                                    <div className="flex-1">
                                        <p className={`text-xs font-bold mb-1 ${sch.status === 'noshow' ? 'text-red-500' : sch.status === 'completed' ? 'text-slate-400' : 'text-orange-500'}`}>{sch.status === 'noshow' ? '미출석' : sch.status === 'completed' ? '완료됨' : (sch.type === 'reserve' ? '상담' : 'TODAY')}</p>
                                        <div className="flex items-center gap-2">
                                            <p className={`font-black text-lg ${sch.status === 'completed' ? 'text-slate-400' : 'text-slate-900'}`}>{sch.clientName}</p>
                                            {sch.status === 'completed' && <span className="text-[10px] bg-green-100 text-green-600 px-2 py-0.5 rounded font-bold">{sch.type === 'reserve' ? '상담완료' : '수업완료'}</span>}
                                        </div>
                                    </div>
                                </div>
                                <p className={`text-xs font-mono ${sch.status === 'completed' ? 'text-slate-400' : 'text-slate-600'}`}>{sch.startTime} ~ {sch.endTime}</p>
                            </div>
                        ))}
                        <button onClick={handleMoreClick} className="bg-white rounded-xl shadow-sm p-4 min-w-[100px] flex flex-col items-center justify-center hover:bg-slate-100 transition"><CalendarDays size={24} className="text-slate-400 mb-1" /><span className="text-xs font-bold text-slate-500">더보기</span></button>
                    </div>

                    <div className="p-4 flex justify-between items-center bg-white border-b border-slate-100">
                        <div className="flex items-center gap-4">
                            <div className="flex bg-slate-100 rounded-lg p-1">
                                <button onClick={() => setCurrentDate(new Date(currentDate.setMonth(currentDate.getMonth() - 1)))} className="p-1 hover:bg-white rounded"><ChevronLeft size={20} /></button>
                                <button onClick={handleToday} className="px-3 text-xs font-bold hover:bg-white rounded">오늘</button>
                                <button onClick={() => setCurrentDate(new Date(currentDate.setMonth(currentDate.getMonth() + 1)))} className="p-1 hover:bg-white rounded"><ChevronRight size={20} /></button>
                            </div>
                            <h2 className="text-2xl font-black">{currentDate.getFullYear()}년 {currentDate.getMonth() + 1}월 {viewMode === 'day' && ` ${currentDate.getDate()}일`}</h2>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => onAddClick(new Date())} className="bg-[#FDE047] px-4 py-2 rounded-lg font-bold flex items-center gap-2 hover:bg-yellow-300 shadow-sm">
                                <Plus size={16} />
                                <span className="hidden md:inline">수업 등록</span>
                                <span className="md:hidden">수업</span>
                            </button>
                            <div className="flex bg-slate-100 p-1 rounded-lg">
                                {['month', 'week', 'day'].map(m => (<button key={m} onClick={() => setViewMode(m)} className={`px-4 py-1.5 rounded-md text-sm font-bold capitalize ${viewMode === m ? 'bg-white shadow' : 'text-slate-500'}`}>{m === 'month' ? '월간' : m === 'week' ? '주간' : '일간'}</button>))}
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 overflow-hidden relative flex flex-col">
                        {viewMode === 'month' ? (
                            <MonthView currentDate={currentDate} schedules={schedules} onCellClick={onAddClick} onScheduleClick={handleScheduleClick} onDrop={handleDrop} onViewChange={handleViewChange} setDragItem={setDragItem} onGoToHistory={onGoToHistory} />
                        ) : (
                            <TimeGridView mode={viewMode} currentDate={currentDate} schedules={schedules} onCellClick={onAddClick} onScheduleClick={handleScheduleClick} scrollRef={scrollRef} onDrop={handleDrop} setDragItem={setDragItem} onGoToHistory={onGoToHistory} /
                            >
                        )}
                    </div>

                    <footer className="bg-slate-50 border-t p-3 text-center text-xs text-slate-400 font-medium">© 2026 HAHA LAB Corp. All rights reserved.</footer>

                    {selectedSchedule && <ScheduleActionModal schedule={selectedSchedule} onClose={() => setSelectedSchedule(null)} onStart={() => { onStartSession(selectedSchedule); setSelectedSchedule(null); }} onNoShow={() => handleStatusChange(selectedSchedule.id, 'noshow')} onChange={handleReschedule} showToast={showToast} onDelete={() => onDeleteSchedule(selectedSchedule.id)} onGoToHistory={onGoToHistory} onStatusChange={handleStatusChange} />}

                </div>
            );
        }

        // Updated Month View
        function MonthView({ currentDate, schedules, onCellClick, onScheduleClick, onDrop, onViewChange, setDragItem }) {
            const { days, weeks } = useMemo(() => {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const first = new Date(year, month, 1);
                const last = new Date(year, month + 1, 0);
                const result = [];

                for (let i = 0; i < first.getDay(); i++) result.push({ date: null });
                for (let i = 1; i <= last.getDate(); i++) result.push({ date: new Date(year, month, i), isCurrent: true });

                const totalDays = result.length;
                const remaining = (7 - (totalDays % 7)) % 7;
                for (let i = 1; i <= remaining; i++) result.push({ date: null });

                const numWeeks = Math.ceil(result.length / 7);
                return { days: result, weeks: numWeeks };
            }, [currentDate]);

            const todayStr = formatDateLocal(new Date());

            return (
                <div className="flex-1 grid grid-cols-7 h-full" style={{ gridTemplateRows: `auto repeat(${weeks}, 1fr)` }}>
                    {['일', '월', '화', '수', '목', '금', '토'].map(d => (<div key={d} className="bg-slate-50 p-2 text-center text-xs font-bold text-slate-500 border-b border-r border-slate-200">{d}</div>))}
                    {days.map((day, idx) => {
                        if (!day.date) return <div key={idx} className="bg-slate-50/20 border-b border-r border-slate-100"></div>;

                        const dateStr = formatDateLocal(day.date);
                        const daySch = schedules
                            .filter(s => s.date === dateStr)
                            .sort((a, b) => a.startTime.localeCompare(b.startTime));
                        const isToday = dateStr === todayStr;
                        const displaySch = daySch.slice(0, 4);
                        const remaining = daySch.length - 4;

                        return (
                            <div
                                key={idx}
                                onDragOver={(e) => e.preventDefault()}
                                onDrop={() => onDrop(dateStr)}
                                onClick={() => onCellClick(day.date)}
                                className={`border-b border-r border-slate-100 p-1 relative hover:bg-yellow-50/30 transition-colors cursor-pointer flex flex-col bg-white ${isToday ? 'bg-yellow-50 ring-2 ring-inset ring-[#FDE047]' : ''}`}
                            >
                                <div className="flex justify-between items-start">
                                    <span className={`text-sm font-bold ml-1 mt-1 flex items-center justify-center w-6 h-6 rounded-full ${isToday ? 'bg-slate-900 text-[#FDE047]' : day.date.getDay() === 0 ? 'text-red-400' : ''}`}>{day.date.getDate()}</span>
                                    {isToday && <span className="text-[10px] font-bold text-slate-400 mr-1 mt-1">오늘</span>}
                                </div>
                                <div className="flex-1 overflow-hidden space-y-1 mt-1">
                                    {displaySch.map(s => (
                                        <div
                                            key={s.id}
                                            draggable
                                            onDragStart={(e) => {
                                                e.dataTransfer.setData('text/plain', JSON.stringify({ type: 'schedule', data: s }));
                                                setDragItem({ type: 'schedule', data: s });
                                            }}
                                            onClick={(e) => { e.stopPropagation(); onScheduleClick(s); }}
                                            className={`text-[10px] px-1 py-0.5 rounded truncate font-medium hover:scale-105 transition cursor-pointer ${s.status === 'completed' ? 'bg-slate-200 text-slate-500' : s.type === 'reserve' ? 'bg-purple-100 text-purple-800' : s.status === 'noshow' ? 'bg-red-100 text-red-800 line-through' : 'bg-yellow-100 text-slate-900'}`}
                                        >
                                            {s.startTime} {s.status === 'noshow' ? '미출석 ' : ''}{s.clientName}
                                        </div>
                                    ))}
                                    {remaining > 0 && (
                                        <div
                                            onClick={(e) => {
                                                e.stopPropagation();
                                                onViewChange('week', day.date);
                                            }}
                                            className="text-[10px] text-slate-400 font-bold px-1 hover:text-slate-600 cursor-pointer"
                                        >
                                            +{remaining}개 더보기
                                        </div>
                                    )}
                                </div>
                            </div>
                        );
                    })}
                </div>
            );
        }

        // Time Grid View
        function TimeGridView({ mode, currentDate, schedules, onCellClick, onScheduleClick, scrollRef, onDrop, onGoToHistory, setDragItem }) {
            // [MODIFIED] Display up to 24:00 (09:00 ~ 24:00)
            const hours = Array.from({ length: 16 }, (_, i) => i + 9);

            // [NEW] Auto-scroll to current time
            useEffect(() => {
                if (scrollRef.current) {
                    const now = new Date();
                    const h = now.getHours();
                    if (h >= 9) {
                        const rowHeight = 80; // h-20 (5rem) is usually 80px (16*5)
                        const offset = (h - 9) * rowHeight;
                        scrollRef.current.scrollTop = offset;
                    }
                }
            }, [mode]);

            const days = useMemo(() => {
                if (mode === 'day') return [currentDate];
                const start = new Date(currentDate);
                start.setDate(currentDate.getDate() - currentDate.getDay());
                return Array.from({ length: 7 }, (_, i) => {
                    const d = new Date(start);
                    d.setDate(start.getDate() + i);
                    return d;
                });
            }, [mode, currentDate]);

            const todayStr = formatDateLocal(new Date());

            return (
                <div className="flex-1 flex flex-col overflow-hidden h-full">
                    <div className="flex border-b border-slate-200">
                        <div className="w-16 shrink-0 bg-slate-50 border-r border-slate-200"></div>
                        {days.map((d, i) => {
                            const dateStr = formatDateLocal(d);
                            const isToday = dateStr === todayStr;
                            return (
                                <div key={i} className={`flex-1 text-center py-2 border-r border-slate-100 last:border-0 ${isToday ? 'bg-yellow-50' : 'bg-white'}`}>
                                    <div className={`text-xs font-bold ${d.getDay() === 0 ? 'text-red-500' : 'text-slate-500'}`}>{['일', '월', '화', '수', '목', '금', '토'][d.getDay()]}</div>
                                    <div className={`text-lg font-black ${isToday ? 'text-slate-900' : ''}`}>{d.getDate()}</div>
                                </div>
                            );
                        })}
                    </div>
                    <div className="flex-1 overflow-y-auto relative bg-white" ref={scrollRef}>
                        {hours.map(h => (
                            <div key={h} className="flex h-20 border-b border-slate-100">
                                <div className="w-16 shrink-0 bg-slate-50 border-r border-slate-200 text-xs text-slate-400 text-center pt-2">{h}:00</div>
                                {days.map((d, i) => {
                                    const dateStr = formatDateLocal(d);
                                    const timeStr = `${h.toString().padStart(2, '0')}:00`;
                                    return (
                                        <div
                                            key={i}
                                            className="flex-1 border-r border-slate-100 relative group"
                                            onClick={() => onCellClick(d)}
                                            onDragOver={(e) => e.preventDefault()}
                                            onDrop={() => onDrop(dateStr, timeStr)}
                                        >
                                            <div className="absolute top-1/2 w-full border-t border-slate-50 border-dashed"></div>
                                        </div>
                                    );
                                })}
                            </div>
                        ))}

                        {days.map((d, colIndex) => {
                            const dateStr = formatDateLocal(d);
                            const daySchedules = schedules.filter(s => s.date === dateStr);
                            return daySchedules.map(s => {
                                const [h, m] = s.startTime.split(':').map(Number);
                                const [eh, em] = s.endTime.split(':').map(Number);
                                if (h < 9 || h > 22) return null;
                                const top = ((h - 9) * 80) + (m / 60 * 80);
                                const durationMins = ((eh * 60) + em) - ((h * 60) + m);
                                const height = (durationMins / 60) * 80;
                                return (
                                    <div
                                        key={s.id}
                                        onClick={(e) => { e.stopPropagation(); s.status === 'completed' ? onGoToHistory(s) : onScheduleClick(s); }}
                                        draggable
                                        onDragStart={(e) => {
                                            e.dataTransfer.setData('text/plain', JSON.stringify({ type: 'schedule', data: s }));
                                            setDragItem({ type: 'schedule', data: s });
                                        }}
                                        className={`absolute mx-1 rounded p-1 text-[10px] font-bold shadow-sm border-l-4 overflow-hidden hover:z-10 hover:scale-105 transition cursor-pointer ${s.status === 'completed' ? 'bg-slate-200 border-slate-400 text-slate-500' : s.status === 'noshow' ? 'bg-red-100 border-red-500 text-red-900 opacity-70' : s.type === 'reserve' ? 'bg-purple-100 border-purple-500 text-purple-900' : 'bg-yellow-100 border-yellow-500 text-slate-900'}`}
                                        style={{ top: `${top}px`, height: `${height}px`, left: `calc(4rem + ${(100 - 4) / days.length * colIndex}%)`, width: `calc((100% - 4rem) / ${days.length} - 8px)` }}
                                    >
                                        {s.startTime} {s.clientName} {s.status === 'completed' ? (s.type === 'reserve' ? '(상담완료)' : '(수업완료)') : ''}
                                    </div>
                                );
                            });
                        })}
                    </div>
                </div>
            );
        }

        // Add Schedule Modal
        function AddScheduleModal({ clients, schedules, initialDate, defaultDuration, onClose, onSubmit, showToast, onConflict, prefilledData, user }) {
            const [targetType, setTargetType] = useState('client');
            const [targetId, setTargetId] = useState('');
            const [mode, setMode] = useState('single');
            const [singleDate, setSingleDate] = useState(initialDate ? formatDateLocal(initialDate) : formatDateLocal(new Date()));
            const [singleTime, setSingleTime] = useState('14:00');
            const [weekDays, setWeekDays] = useState({ 1: false, 2: false, 3: false, 4: false, 5: false, 6: false, 0: false });
            const [weekTimes, setWeekTimes] = useState({ 1: '14:00', 2: '14:00', 3: '14:00', 4: '14:00', 5: '14:00', 6: '14:00', 0: '14:00' });
            const [selectedDates, setSelectedDates] = useState([]);
            const [monthlyTime, setMonthlyTime] = useState('14:00');
            const [isRepeat, setIsRepeat] = useState(false);
            const [endDate, setEndDate] = useState('');

            // [MODIFIED] Use loose or string comparison for finding target client to handle type mismatch
            const targetClient = clients.find(c => String(c.id) === String(targetId));

            useEffect(() => {
                if (prefilledData) {
                    setTargetType(prefilledData.clientType || 'client');
                    setTargetId(prefilledData.clientId || '');
                    setMode('single');
                    if (prefilledData.date) setSingleDate(prefilledData.date);
                    if (prefilledData.startTime) setSingleTime(prefilledData.startTime);
                }
            }, [prefilledData]);

            const toggleDate = (dateStr) => {
                if (selectedDates.includes(dateStr)) setSelectedDates(selectedDates.filter(d => d !== dateStr));
                else setSelectedDates([...selectedDates, dateStr]);
            };

            const handleRegister = async () => {
                if (!targetId) { showToast('대상을 선택해주세요.'); return; }
                if (mode === 'single' && !singleDate) { showToast('날짜를 입력해주세요.'); return; }
                if (mode === 'weekly') {
                    const days = Object.keys(weekDays).filter(d => weekDays[d]);
                    if (days.length === 0) { showToast('요일을 하나 이상 선택해주세요.'); return; }
                }
                if (mode === 'monthly' && selectedDates.length === 0) { showToast('날짜를 선택해주세요.'); return; }

                const newSchedules = [];
                // Check if targetClient exists. Since we filter drop-down, it should exist, but safety first.
                if (!targetClient) { showToast('유효하지 않은 대상입니다.'); return; }

                const baseClient = { teacher_id: user.teacherId, client_id: targetClient.id, client_name: targetClient.name, type: targetClient.type };

                const createSch = (dStr, tStr) => {
                    const [h, m] = tStr.split(':').map(Number);
                    const endTimeDate = new Date(); endTimeDate.setHours(h, m + (targetClient.sessionTime || defaultDuration));
                    return {
                        ...baseClient, date: dStr, start_time: tStr, end_time: endTimeDate.toTimeString().slice(0, 5), status: 'scheduled',
                        actual_start_time: null, actual_end_time: null // Explicitly init as null
                    };
                };

                const generateList = [];

                if (mode === 'single') {
                    generateList.push({ d: singleDate, t: singleTime });
                    if (isRepeat) {
                        for (let i = 1; i <= 4; i++) {
                            const d = new Date(singleDate); d.setDate(d.getDate() + (i * 7));
                            const dStr = formatDateLocal(d);
                            if (endDate && d > new Date(endDate)) break;
                            generateList.push({ d: dStr, t: singleTime });
                        }
                    }
                } else if (mode === 'weekly') {
                    const days = Object.keys(weekDays).filter(d => weekDays[d]).map(Number);
                    const limit = isRepeat ? 30 : 7;
                    const start = new Date();
                    for (let i = 0; i < limit; i++) {
                        const d = new Date(start); d.setDate(d.getDate() + i);
                        if (endDate && d > new Date(endDate)) break;
                        if (days.includes(d.getDay())) {
                            generateList.push({ d: formatDateLocal(d), t: weekTimes[d.getDay()] });
                        }
                    }
                } else if (mode === 'monthly') {
                    selectedDates.forEach(dStr => {
                        generateList.push({ d: dStr, t: monthlyTime });
                        if (isRepeat) {
                            for (let i = 1; i <= 3; i++) {
                                const d = new Date(dStr); d.setMonth(d.getMonth() + i);
                                const nextDStr = formatDateLocal(d);
                                if (endDate && d > new Date(endDate)) break;
                                generateList.push({ d: nextDStr, t: monthlyTime });
                            }
                        }
                    });
                }

                // Insert to DB
                const { data, error } = await supabase.from('schedules').insert(generateList.map(item => createSch(item.d, item.t))).select();

                if (!error) {
                    onSubmit(keysToCamel(data));
                } else {
                    if (showToast) showToast("등록 실패: " + error.message);
                    else alert("등록 실패: " + error.message);
                }
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
                    <div className="bg-white rounded-2xl w-full max-w-[500px] p-6 shadow-2xl animate-fade-in max-h-[90vh] overflow-y-auto">
                        <div className="flex justify-between items-center mb-6"><h3 className="font-bold text-xl">수업 등록</h3><button onClick={onClose}><X size={20} /></button></div>
                        <div className="space-y-6">
                            <div className="bg-slate-50 p-4 rounded-xl">
                                <div className="flex gap-4 mb-3">
                                    <label className="flex items-center gap-2 cursor-pointer">
                                        <input
                                            type="radio"
                                            checked={targetType === 'client'}
                                            onChange={() => { setTargetType('client'); setTargetId(''); }}
                                            className="accent-slate-900"
                                        />
                                        <span className="text-sm font-bold">내담자</span>
                                    </label>
                                    <label className="flex items-center gap-2 cursor-pointer">
                                        <input
                                            type="radio"
                                            checked={targetType === 'reserve'}
                                            onChange={() => { setTargetType('reserve'); setTargetId(''); }}
                                            className="accent-slate-900"
                                        />
                                        <span className="text-sm font-bold">상담 예약자</span>
                                    </label>
                                </div>
                                <select className="w-full border p-2 rounded-lg bg-white" value={targetId} onChange={e => setTargetId(e.target.value)}>
                                    <option value="">대상을 선택하세요</option>
                                    {clients.filter(c => c.type === targetType && c.status !== 'terminated' && c.status !== 'paused').map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                </select>
                            </div>
                            <div className="flex bg-slate-100 p-1 rounded-lg">
                                {[{ id: 'single', l: '하루 수업' }, { id: 'weekly', l: '요일 반복' }, { id: 'monthly', l: '날짜 지정' }].map(m => <button key={m.id} onClick={() => setMode(m.id)} className={`flex-1 py-2 rounded-md text-sm font-bold transition ${mode === m.id ? 'bg-white shadow text-slate-900' : 'text-slate-400'}`}>{m.l}</button>)}
                            </div>
                            <div className="border p-4 rounded-xl">
                                {mode === 'single' && <div className="grid grid-cols-2 gap-4"><div><label className="text-xs font-bold text-slate-500 mb-1 block">날짜</label><input type="date" className="w-full border p-2 rounded-lg" value={singleDate} onChange={e => setSingleDate(e.target.value)} /></div><div><label className="text-xs font-bold text-slate-500 mb-1 block">시작 시간</label><input type="time" className="w-full border p-2 rounded-lg" value={singleTime} onChange={e => setSingleTime(e.target.value)} /></div></div>}
                                {mode === 'weekly' && <div className="space-y-3"><p className="text-xs font-bold text-slate-500">요일 선택 및 시간 설정</p>{['일', '월', '화', '수', '목', '금', '토'].map((d, i) => (<div key={i} className={`flex items-center gap-3 p-2 rounded-lg ${weekDays[i] ? 'bg-yellow-50 border border-yellow-200' : 'bg-slate-50'}`}><input type="checkbox" checked={weekDays[i]} onChange={e => setWeekDays({ ...weekDays, [i]: e.target.checked })} className="w-4 h-4 accent-slate-900" /><span className={`w-8 text-sm font-bold ${i === 0 ? 'text-red-500' : 'text-slate-700'}`}>{d}</span><input type="time" disabled={!weekDays[i]} value={weekTimes[i]} onChange={e => setWeekTimes({ ...weekTimes, [i]: e.target.value })} className="border p-1 rounded bg-white text-sm disabled:opacity-50" /></div>))}</div>}

                // Final check before submit (e.g. valid DOB year)
                // If only year is entered (from UI), dob might be 'YYYY-01-01'.

                onSubmit({ ...form, type });

            const addAreaTag = (area, value) => { if (!value.trim()) return; setForm(prev => ({ ...prev, areas: { ...prev.areas, [area]: [...prev.areas[area], value] } })); };

            return (

                    <div className="flex-1 overflow-y-auto p-8 max-w-4xl mx-auto w-full space-y-8">

                            <div className="flex gap-2">{['남', '여'].map(g => <button key={g} type="button" onClick={() => setForm({ ...form, gender: g })} className={`flex-1 border rounded-xl font-bold ${form.gender === g ? 'bg-[#FDE047]' : 'bg-white'}`}>{g}</button>)}</div>

                                <input

                                    placeholder="YYYY"

                                        const val = e.target.value;
                                        // If empty year, clear DOB
                                        if (!val) { setForm({ ...form, dob: '' }); return; }
                                        const parts = form.dob ? form.dob.split('-') : ['', '', ''];
                                        const m = parts[1] || '01'; // Default Month 01
                                        const d = parts[2] || '01'; // Default Day 01
                                        setForm({ ...form, dob: `${val}-${m}-${d}` });
                                    }}
                                />
                                <span className="text-slate-400 font-bold text-xs">년</span>
                                <select
                                    className="flex-1 border p-3 rounded-xl text-center outline-none focus:border-[#FDE047] appearance-none bg-white"
                                    value={form.dob ? parseInt(form.dob.split('-')[1] || 1) : ''}
                                    onChange={(e) => {
                                        const val = e.target.value.toString().padStart(2, '0');
                                        const parts = form.dob ? form.dob.split('-') : [new Date().getFullYear(), '01', '01'];
                                        const y = parts[0] || new Date().getFullYear();
                                        const d = parts[2] || '01';
                                        setForm({ ...form, dob: `${y}-${val}-${d}` });

                                >

                                    onChange={(e) => {
                                        const val = e.target.value.toString().padStart(2, '0');
                                        const parts = form.dob ? form.dob.split('-') : [new Date().getFullYear(), '01', '01'];
                                        const y = parts[0] || new Date().getFullYear();
                                        const m = parts[1] || '01';
                                        setForm({ ...form, dob: `${y}-${m}-${val}` });

                        <section>
                            <h3 className="font-bold text-lg mb-4">보호자 정보 (최대 3명)</h3>
                            <div className="bg-slate-50 p-6 rounded-2xl border border-slate-100 space-y-3">
                                {form.guardians.map((g, i) => (
                                    <div key={i} className="flex gap-2">
                                        <input placeholder="이름" className="flex-1 border p-2 rounded-lg" value={g.name} onChange={e => { const newG = [...form.guardians]; newG[i].name = e.target.value; setForm({ ...form, guardians: newG }) }} />
                                        <input placeholder="관계" className="w-20 border p-2 rounded-lg" value={g.relation} onChange={e => { const newG = [...form.guardians]; newG[i].relation = e.target.value; setForm({ ...form, guardians: newG }) }} />
                                        <input placeholder="연락처" className="flex-1 border p-2 rounded-lg" value={g.contact} onChange={e => { const newG = [...form.guardians]; newG[i].contact = e.target.value; setForm({ ...form, guardians: newG }) }} />
                                    </div>
                                ))}
                                {form.guardians.length < 3 && <button type="button" onClick={() => setForm({ ...form, guardians: [...form.guardians, { name: '', relation: '', contact: '' }] })} className="text-sm font-bold text-slate-500">+ 보호자 추가</button>}
                            </div>
                        </section>
                        <section><h3 className="font-bold text-lg mb-4">임상 정보</h3><div className="bg-slate-50 p-6 rounded-2xl space-y-4">
                            <input placeholder="진단명" className="w-full border p-3 rounded-xl" value={form.diagnosis} onChange={e => setForm({ ...form, diagnosis: e.target.value })} />
                            <textarea placeholder="초기 상담" className="w-full border p-3 rounded-xl h-24" value={form.initialConsult} onChange={e => setForm({ ...form, initialConsult: e.target.value })} />
                            <AreaInput label="언어" items={form.areas.lang} onAdd={v => addAreaTag('lang', v)} onDelete={i => { const n = [...form.areas.lang]; n.splice(i, 1); setForm({ ...form, areas: { ...form.areas, lang: n } }) }} />
                            <AreaInput label="인지" items={form.areas.cogn} onAdd={v => addAreaTag('cogn', v)} onDelete={i => { const n = [...form.areas.cogn]; n.splice(i, 1); setForm({ ...form, areas: { ...form.areas, cogn: n } }) }} />
                            <AreaInput label="행동" items={form.areas.behv} onAdd={v => addAreaTag('behv', v)} onDelete={i => { const n = [...form.areas.behv]; n.splice(i, 1); setForm({ ...form, areas: { ...form.areas, behv: n } }) }} />
                            {/* [RESTORED] Memo */}
                            <div className="mt-2">
                                <label className="text-xs font-bold text-slate-500 mb-1 block">특이사항/메모</label>
                                <textarea placeholder="특이사항을 입력하세요." className="w-full border p-3 rounded-xl h-24" value={form.memo} onChange={e => setForm({ ...form, memo: e.target.value })} />
                            </div>
                        </div></section>
                    </div>
                    <div className="p-6 border-t flex justify-end"><button onClick={handleSubmit} className="px-8 py-3 bg-[#FDE047] rounded-xl font-bold">{customButtonText ? customButtonText : (initialData ? '수정 완료' : '등록 완료')}</button></div>
                </div>
            )
        }

        function AreaInput({ label, items, onAdd, onDelete }) {
            const [val, setVal] = useState('');
            return (<div><label className="text-sm font-bold mb-1 block">{label}</label><div className="flex gap-2 mb-2"><input className="flex-1 border p-2 rounded text-sm" value={val} onChange={e => setVal(e.target.value)} onKeyDown={e => e.key === 'Enter' && (onAdd(val), setVal(''))} /><button type="button" onClick={() => { onAdd(val); setVal('') }} className="bg-slate-200 px-3 rounded font-bold text-sm">추가</button></div><div className="flex flex-wrap gap-1">{items.map((t, i) => <span key={i} className="bg-white border px-2 py-0.5 rounded text-xs flex items-center gap-1">{t}<button type="button" onClick={() => onDelete(i)}><X size={10} /></button></span>)}</div></div>);
        }

        /**
         * Growth Report Tab Component
         * 성장 리포트 - 9대 지표 추이, 비교 분석, 총괄 피드백
         */
        function GrowthReportTab({ client, user }) {
            const [gameSessions, setGameSessions] = useState([]);
            const [timeRange, setTimeRange] = useState(3); // 1, 3, or 12 months (changed from 6)
            const [expandedSession, setExpandedSession] = useState(null); // NEW: for detailed feedback
            const [loading, setLoading] = useState(true);
            const trendChartRef = useRef(null);
            const trendChartInstance = useRef(null);

            // Session Comparison State
            const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());
            const [selectedMonth, setSelectedMonth] = useState(new Date().getMonth() + 1);
            const [selectedSessionsForComparison, setSelectedSessionsForComparison] = useState([]);
            const [showSessionComparisonModal, setShowSessionComparisonModal] = useState(false);

            // Load game sessions from histories
            useEffect(() => {
                const fetchGameSessions = async () => {
                    try {
                        setLoading(true);
                        const { data, error } = await supabase
                            .from('histories')
                            .select('*')
                            .eq('client_id', client.id.toString())
                            .eq('category', 'session_history')
                            .eq('action', '게임 완료')
                            .order('event_datetime', { ascending: false });

                        if (error) {
                            console.error('[GrowthReport] Supabase error:', error);
                            setLoading(false);
                            return;
                        }

                        if (!data || data.length === 0) {
                            console.log('[GrowthReport] No sessions found for client:', client.id);
                            setGameSessions([]);
                            setLoading(false);
                            return;
                        }

                        // Parse details JSON with error handling
                        const sessions = data.map((h, index) => {
                            try {
                                const details = typeof h.details === 'string' ? JSON.parse(h.details) : h.details;
                                return {
                                    ...h,
                                    details,
                                    metrics: details?.metrics || {}
                                };
                            } catch (parseError) {
                                console.error(`[GrowthReport] Failed to parse session ${index}:`, parseError, h);
                                return null;
                            }
                        }).filter(s => s && s.details && s.details.game_id); // Only valid game sessions

                        console.log('[GrowthReport] Loaded sessions:', sessions.length);
                        setGameSessions(sessions);
                    } catch (err) {
                        console.error('[GrowthReport] Fatal error in fetchGameSessions:', err);
                    } finally {
                        setLoading(false);
                    }
                };
                fetchGameSessions();
            }, [client.id]);

            // Filter sessions by timeRange
            const filteredSessions = useMemo(() => {
                const cutoffDate = new Date();
                cutoffDate.setMonth(cutoffDate.getMonth() - timeRange);
                return gameSessions.filter(s => new Date(s.event_datetime) >= cutoffDate);
            }, [gameSessions, timeRange]);

            // Aggregate monthly metrics for trend chart
            const monthlyData = useMemo(() => {
                const grouped = {};
                filteredSessions.forEach(session => {
                    const month = session.event_datetime.substring(0, 7); // YYYY-MM
                    if (!grouped[month]) grouped[month] = [];
                    grouped[month].push(session.metrics);
                });

                return Object.keys(grouped).sort().map(month => {
                    const metrics = grouped[month];
                    const avg = (arr) => arr.reduce((a, b) => a + b, 0) / arr.length || 0;

                    return {
                        month,
                        avgRT: avg(metrics.map(m => m.avgRT || 0)),
                        accuracy: avg(metrics.map(m => m.accuracy || 0)) * 100,
                        iiv: avg(metrics.map(m => m.iiv || 0)),
                        sustainedAttention: avg(metrics.map(m => m.sustainedAttention || 0)) * 100
                    };
                });
            }, [filteredSessions]);

            // Render trend chart
            useEffect(() => {
                if (!trendChartRef.current || monthlyData.length === 0) return;

                // Destroy previous chart
                if (trendChartInstance.current) {
                    trendChartInstance.current.destroy();
                }

                const ctx = trendChartRef.current.getContext('2d');
                trendChartInstance.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: monthlyData.map(d => d.month),
                        datasets: [
                            {
                                label: '평균 반응시간 (ms)',
                                data: monthlyData.map(d => d.avgRT),
                                borderColor: 'rgb(255, 99, 132)',
                                backgroundColor: 'rgba(255, 99, 132, 0.1)',
                                tension: 0.3,
                                yAxisID: 'y'
                            },
                            {
                                label: '정확도 (%)',
                                data: monthlyData.map(d => d.accuracy),
                                borderColor: 'rgb(54, 162, 235)',
                                backgroundColor: 'rgba(54, 162, 235, 0.1)',
                                tension: 0.3,
                                yAxisID: 'y1'
                            },
                            {
                                label: '지속 주의력 (%)',
                                data: monthlyData.map(d => d.sustainedAttention),
                                borderColor: 'rgb(75, 192, 192)',
                                backgroundColor: 'rgba(75, 192, 192, 0.1)',
                                tension: 0.3,
                                yAxisID: 'y1'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            title: { display: true, text: '성장 추이 그래프', font: { size: 16, weight: 'bold' } },
                            legend: { position: 'bottom' }
                        },
                        scales: {
                            y: { type: 'linear', display: true, position: 'left', title: { display: true, text: '반응시간 (ms)' } },
                            y1: { type: 'linear', display: true, position: 'right', title: { display: true, text: '점수 (%)' }, grid: { drawOnChartArea: false } }
                        }
                    }
                });

                return () => {
                    if (trendChartInstance.current) trendChartInstance.current.destroy();
                };
            }, [monthlyData]);





            // Overall feedback generation
            const generateOverallFeedback = () => {
                if (filteredSessions.length === 0) return '데이터 부족';

                const firstSession = filteredSessions[filteredSessions.length - 1];
                const lastSession = filteredSessions[0];

                const rtImprovement = Math.abs(((firstSession.metrics.avgRT || 0) - (lastSession.metrics.avgRT || 0)) / (firstSession.metrics.avgRT || 1) * 100).toFixed(1);
                const accImprovement = Math.abs(((lastSession.metrics.accuracy || 0) - (firstSession.metrics.accuracy || 0)) / (firstSession.metrics.accuracy || 1) * 100).toFixed(1);

                return `총 ${filteredSessions.length}회 세션 동안 평균 반응시간이 ${rtImprovement}% 개선되었고, 정확도가 ${accImprovement}% 향상되었습니다. 지속적인 훈련을 통해 인지 기능이 꾸준히 발전하고 있습니다.`;
            };

            // NEW: Generate detailed feedback for a single session
            const generateDetailedFeedback = (session) => {
                const { metrics } = session;
                const strengths = [];
                const weaknesses = [];
                const recommendations = [];

                // Strengths analysis
                if (metrics.accuracy >= 0.85) strengths.push('높은 정확도 (85% 이상)');
                if (metrics.avgRT < 500) strengths.push('빠른 반응속도 (500ms 미만)');
                if (metrics.sustainedAttention >= 0.8) strengths.push('우수한 지속 주의력');
                if (metrics.iiv < 150) strengths.push('안정적인 반응 패턴');
                if (metrics.efficiency >= 0.8) strengths.push('높은 인지 효율성');
                if (metrics.lapseRate < 0.05) strengths.push('집중력 유지 탁월');

                // Weaknesses analysis
                if (metrics.accuracy < 0.7) weaknesses.push('정확도 개선 필요 (70% 미만)');
                if (metrics.avgRT > 700) weaknesses.push('반응속도 느림 (700ms 이상)');
                if (metrics.iiv > 200) weaknesses.push('반응시간 변동성 높음');
                if (metrics.anticipatoryRate > 0.12) weaknesses.push('충동 조절 개선 필요');
                if (metrics.fatigueIndex > 0.08) weaknesses.push('피로도 관리 필요');
                if (metrics.lapseRate > 0.1) weaknesses.push('주의력 집중 개선 필요');

                // Recommendations
                if (weaknesses.includes('정확도 개선 필요 (70% 미만)')) {
                    recommendations.push('난이도를 낮춰 정확도 향상에 집중해보세요.');
                }
                if (weaknesses.includes('반응속도 느림 (700ms 이상)')) {
                    recommendations.push('반응시간 단축 훈련을 추천합니다.');
                }
                if (weaknesses.includes('충동 조절 개선 필요')) {
                    recommendations.push('신중한 판단 연습이 필요합니다.');
                }
                if (weaknesses.includes('피로도 관리 필요')) {
                    recommendations.push('세션 중간에 짧은 휴식을 취해보세요.');
                }

                // Default feedback
                if (strengths.length === 0) strengths.push('꾸준한 훈련을 통해 발전 중');
                if (recommendations.length === 0) recommendations.push('현재 수준을 유지하며 꾸준히 훈련하세요.');

                const clinicalFeedback = strengths.length >= weaknesses.length
                    ? `이번 세션에서는 ${strengths.slice(0, 2).join(', ')} 등의 강점을 보였습니다. ${recommendations[0]}`
                    : `${weaknesses.slice(0, 2).join(', ')} 영역에서 개선의 여지가 있습니다. ${recommendations[0]}`;

                return {
                    strengths,
                    weaknesses,
                    recommendations,
                    clinicalFeedback
                };
            };

            if (loading) {
                return <div className="p-8 text-center"><div className="animate-spin rounded-full h-12 w-12 border-b-2 border-slate-900 mx-auto"></div><p className="mt-4 text-slate-600">로딩 중...</p></div>;
            }

            if (gameSessions.length === 0) {
                return (
                    <div className="p-8 text-center bg-slate-50 rounded-xl">
                        <p className="text-slate-600 mb-2">아직 플레이랩에 대한 데이터가 부족합니다.</p>
                        <p className="text-sm text-slate-500">데이터가 쌓이면 성장 리포트가 자동 생성됩니다.</p>
                    </div>
                );
            }

            return (
                <div className="space-y-6">
                    {/* Overall Feedback */}
                    <div className="bg-blue-50 border border-blue-200 rounded-xl p-4">
                        <h4 className="font-bold text-lg text-slate-800 mb-2">📊 총괄 피드백</h4>
                        <p className="text-slate-700 leading-relaxed text-sm">{generateOverallFeedback()}</p>
                    </div>

                    {/* Time Range Filter */}
                    <div className="flex gap-3">
                        <button onClick={() => setTimeRange(1)} className={`px-4 py-2 rounded-lg font-bold ${timeRange === 1 ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-700'}`}>1개월</button>
                        <button onClick={() => setTimeRange(3)} className={`px-4 py-2 rounded-lg font-bold ${timeRange === 3 ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-700'}`}>3개월</button>
                        <button onClick={() => setTimeRange(12)} className={`px-4 py-2 rounded-lg font-bold ${timeRange === 12 ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-700'}`}>1년</button>
                    </div>

                    {/* Trend Chart - Reduced Height */}
                    <div className="bg-white border rounded-xl p-4">
                        <canvas ref={trendChartRef} id="trendChart" style={{ maxHeight: '300px' }}></canvas>
                    </div>



                    {/* Session List with Detailed Feedback - NEW! */}
                    <div className="bg-white border rounded-xl p-6">
                        {/* Monthly Period Selector - Centered */}
                        <div className="flex items-center justify-center mb-6">
                            <button
                                onClick={() => {
                                    if (selectedMonth === 1) {
                                        setSelectedMonth(12);
                                        setSelectedYear(selectedYear - 1);
                                    } else {
                                        setSelectedMonth(selectedMonth - 1);
                                    }
                                }}
                                className="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg transition-all font-bold text-slate-700"
                            >
                                ←
                            </button>
                            <span className="mx-6 font-black text-xl text-slate-900">
                                {selectedYear}.{String(selectedMonth).padStart(2, '0')}
                            </span>
                            <button
                                onClick={() => {
                                    if (selectedMonth === 12) {
                                        setSelectedMonth(1);
                                        setSelectedYear(selectedYear + 1);
                                    } else {
                                        setSelectedMonth(selectedMonth + 1);
                                    }
                                }}
                                className="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg transition-all font-bold text-slate-700"
                            >
                                →
                            </button>
                        </div>

                        <h4 className="font-bold text-lg text-slate-800 mb-4">📜 세션별 상세 이력</h4>

                        <div className="space-y-3">
                            {(() => {
                                // Filter sessions by selected month/year
                                const monthlyFilteredSessions = gameSessions.filter(session => {
                                    const sessionDate = new Date(session.event_datetime);
                                    return sessionDate.getFullYear() === selectedYear &&
                                        (sessionDate.getMonth() + 1) === selectedMonth;
                                });

                                if (monthlyFilteredSessions.length === 0) {
                                    return (
                                        <div className="text-center py-10 bg-slate-50 rounded-xl border border-dashed border-slate-300">
                                            <p className="text-slate-400 mb-2">해당 기간의 세션이 없습니다.</p>
                                            <p className="text-xs text-slate-400">{selectedYear}년 {selectedMonth}월 활동이 없습니다.</p>
                                        </div>
                                    );
                                }

                                return monthlyFilteredSessions.map(session => {
                                    const feedback = generateDetailedFeedback(session);
                                    const isExpanded = expandedSession === session.id;
                                    const isSelectedForComparison = selectedSessionsForComparison.includes(session.id);

                                    return (
                                        <div key={session.id} className="border rounded-lg overflow-hidden">
                                            {/* Session Header - Compact Single Line */}
                                            <div className="px-3 py-2 bg-slate-50 hover:bg-slate-100 transition-colors">
                                                <div className="flex items-center gap-4">
                                                    {/* Checkbox */}
                                                    <label className="flex items-center gap-2 cursor-pointer" onClick={(e) => e.stopPropagation()}>
                                                        <input
                                                            type="checkbox"
                                                            checked={isSelectedForComparison}
                                                            onChange={() => {
                                                                if (isSelectedForComparison) {
                                                                    setSelectedSessionsForComparison(prev => prev.filter(id => id !== session.id));
                                                                } else {
                                                                    if (selectedSessionsForComparison.length >= 2) {
                                                                        alert('최대 2개까지 선택할 수 있습니다.');
                                                                        return;
                                                                    }
                                                                    setSelectedSessionsForComparison(prev => [...prev, session.id]);
                                                                }
                                                            }}
                                                            className="w-4 h-4 accent-slate-900"
                                                        />
                                                    </label>

                                                    {/* Session Info - All in one line */}
                                                    <div className="flex-1 flex items-center gap-3 text-sm cursor-pointer" onClick={() => setExpandedSession(isExpanded ? null : session.id)}>
                                                        <span className="font-bold text-slate-800 min-w-[120px]">{session.details.game_name}</span>
                                                        <span className="text-xs text-slate-500">{session.event_datetime.substring(0, 16).replace('T', ' ')}</span>
                                                        <span className="bg-white px-2 py-0.5 rounded border text-xs">Lv.{session.details.level}</span>
                                                        <span className="bg-green-50 text-green-700 px-2 py-0.5 rounded text-xs font-bold">{((session.metrics.accuracy || 0) * 100).toFixed(1)}%</span>
                                                        <span className="bg-blue-50 text-blue-700 px-2 py-0.5 rounded text-xs">{(session.metrics.avgRT || 0).toFixed(0)}ms</span>
                                                    </div>

                                                    {/* Expand Arrow */}
                                                    <button className="text-slate-400 px-2" onClick={() => setExpandedSession(isExpanded ? null : session.id)}>
                                                        {isExpanded ? '▲' : '▼'}
                                                    </button>
                                                </div>
                                            </div>

                                            {/* Detailed Feedback - Expandable */}
                                            {isExpanded && (
                                                <div className="p-6 bg-white border-t">
                                                    {/* Clinical Feedback */}
                                                    <div className="mb-4 p-4 bg-blue-50 border border-blue-200 rounded-lg">
                                                        <p className="text-sm font-bold text-blue-900 mb-1">🩺 임상 피드백</p>
                                                        <p className="text-slate-700 leading-relaxed">{feedback.clinicalFeedback}</p>
                                                    </div>

                                                    {/* 9대 지표 상세 */}
                                                    <div className="mb-4">
                                                        <p className="font-bold text-slate-800 mb-3">📊 9대 핵심 지표</p>
                                                        <div className="grid grid-cols-3 gap-3">
                                                            <div className="p-3 bg-slate-50 rounded">
                                                                <p className="text-xs text-slate-600">평균 반응시간</p>
                                                                <p className="font-bold text-lg">{(session.metrics.avgRT || 0).toFixed(0)}ms</p>
                                                            </div>
                                                            <div className="p-3 bg-slate-50 rounded">
                                                                <p className="text-xs text-slate-600">정확도</p>
                                                                <p className="font-bold text-lg">{((session.metrics.accuracy || 0) * 100).toFixed(1)}%</p>
                                                            </div>
                                                            <div className="p-3 bg-slate-50 rounded">
                                                                <p className="text-xs text-slate-600">지속 주의력</p>
                                                                <p className="font-bold text-lg">{((session.metrics.sustainedAttention || 0) * 100).toFixed(1)}%</p>
                                                            </div>
                                                            <div className="p-3 bg-slate-50 rounded">
                                                                <p className="text-xs text-slate-600">IIV (변동성)</p>
                                                                <p className="font-bold text-lg">{(session.metrics.iiv || 0).toFixed(0)}ms</p>
                                                            </div>
                                                            <div className="p-3 bg-slate-50 rounded">
                                                                <p className="text-xs text-slate-600">예측반응률</p>
                                                                <p className="font-bold text-lg">{((session.metrics.anticipatoryRate || 0) * 100).toFixed(1)}%</p>
                                                            </div>
                                                            <div className="p-3 bg-slate-50 rounded">
                                                                <p className="text-xs text-slate-600">오류후느려짐</p>
                                                                <p className="font-bold text-lg">{(session.metrics.postErrorSlowing || 0).toFixed(0)}ms</p>
                                                            </div>
                                                            <div className="p-3 bg-slate-50 rounded">
                                                                <p className="text-xs text-slate-600">피로도</p>
                                                                <p className="font-bold text-lg">{((session.metrics.fatigueIndex || 0) * 100).toFixed(1)}%</p>
                                                            </div>
                                                            <div className="p-3 bg-slate-50 rounded">
                                                                <p className="text-xs text-slate-600">효율성</p>
                                                                <p className="font-bold text-lg">{((session.metrics.efficiency || 0) * 100).toFixed(1)}%</p>
                                                            </div>
