<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlayLab: [게임명]</title>
    <link rel="icon" type="image/svg+xml" href="../images/hahalab-P.svg">

    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />

    <!-- PlayLab Framework -->
    <link rel="stylesheet" href="playlab-style.css">
    <script src="playlab-core.js"></script>

    <!-- Game Specific Styles -->
    <style>
        /* 게임 고유 스타일 작성 */
        /* 예: .custom-element { } */
    </style>
</head>

<body>
    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Main Game Container -->
    <div id="gameContainer" class="game-container">

        <!-- HUD Bar (자동 표시) -->
        <header
            class="bg-white/95 backdrop-blur-sm border-b border-slate-200 px-6 py-3 flex items-center justify-between shadow-sm">
            <div class="flex items-center gap-4">
                <h1 class="text-2xl font-black text-slate-800 tracking-tight font-title">[게임명]</h1>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-sm font-bold text-slate-600">LEVEL <span id="display-level"
                        class="text-teal-500">1</span></span>
                <span class="text-sm font-bold text-slate-600">ROUND <span id="display-round"
                        class="text-teal-500">1/10</span></span>
            </div>
            <div id="menu-gamepad-indicator" class="gamepad-badge">
                <span class="material-symbols-rounded text-lg">sports_esports</span>
                <span>GAMEPAD</span>
            </div>
        </header>

        <!-- Main Game Area -->
        <main>
            <!-- Menu Screen -->
            <div id="screen-menu" class="center-container">
                <div class="text-center mb-8">
                    <h1 class="text-4xl sm:text-6xl font-title font-bold text-slate-800 mb-2">[게임명]</h1>
                    <p class="text-lg text-slate-500 font-medium">[게임 설명]</p>
                </div>

                <!-- Intro Gamepad Indicator -->
                <div class="flex gap-2 mb-6">
                    <div id="intro-gamepad-icon" class="device-icon-wrapper inactive-gray">
                        <img src="../images/gamepad.svg" alt="Gamepad" class="device-icon" />
                    </div>
                </div>

                <!-- Level/Age Selection Grid -->
                <div id="level-list" class="grid grid-cols-2 gap-6 max-w-md">
                    <!-- Generated by renderMenu() -->
                </div>
            </div>

            <!-- Game Screen -->
            <div id="screen-game" class="hidden center-container">
                <div id="msg-center" class="text-3xl font-bold text-center mb-8" style="display: none;"></div>

                <!-- 게임 화면 작성 -->
                <div id="game-area">
                    <!-- 게임별 고유 UI 요소 -->
                </div>

                <div id="game-gamepad-indicator" class="hidden text-emerald-500 bg-emerald-50 rounded-full p-1">
                    <span class="material-symbols-rounded text-sm">sports_esports</span>
                </div>
            </div>

            <!-- Result Screen -->
            <div id="screen-result" class="hidden w-full h-full overflow-y-auto">
                <!-- Generated by generateReport() -->
            </div>
        </main>
    </div>

    <!-- Modal - Confirm Exit -->
    <div id="modal-confirm-home"
        class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-8 w-11/12 max-w-md shadow-2xl">
            <h2 id="modal-title" class="text-2xl font-black text-slate-800 mb-3">게임을 종료하시겠습니까?</h2>
            <p id="modal-desc" class="text-slate-600 mb-6">진행 중인 데이터는 저장되지 않습니다.</p>
            <div class="flex gap-3">
                <button id="btn-modal-cancel"
                    class="flex-1 py-3 bg-slate-100 text-slate-700 rounded-xl font-bold hover:bg-slate-200 transition">취소</button>
                <button id="btn-modal-confirm"
                    class="flex-1 py-3 bg-rose-500 text-white rounded-xl font-bold hover:bg-rose-600 transition">종료</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * 게임 설정
         */
        const gameConfig = {
            gameName: '[게임명]',
            gameId: '01-XXX',
            minLevel: 3,
            maxLevel: 9,
            roundsPerLevel: 10
        };

        /**
         * 게임 상태
         */
        let gameState = {
            screen: 'MENU',
            ageGroup: 'TODDLER',
            level: 3,
            round: 1,
            isPlaying: false
        };

        /**
         * PlayLab Framework 초기화
         */
        PlayLabCore.init(gameConfig);

        /**
         * 게임 초기화
         */
        function init() {
            renderMenu();
            setupModalButtons();
            requestAnimationFrame(gameLoop);
            setAgeGroup('TODDLER');
        }

        /**
         * 메뉴 렌더링
         */
        function renderMenu() {
            const list = document.getElementById('level-list');
            list.innerHTML = '';

            // Level Selection
            for (let i = gameConfig.minLevel; i <= gameConfig.maxLevel; i++) {
                const btn = document.createElement('div');
                btn.className = 'menu-item';
                btn.innerHTML = `<div class="text-3xl font-black mb-1">Lv.${i}</div>`;
                btn.onclick = () => startGame(i);
                list.appendChild(btn);
            }

            // Age Selection
            const ageBtn = document.createElement('div');
            ageBtn.className = 'menu-item';
            ageBtn.innerHTML = '<div class="text-lg font-bold">연령 선택</div>';
            // Add age selection logic here
            list.appendChild(ageBtn);
        }

        /**
         * 연령 그룹 설정
         */
        function setAgeGroup(group) {
            gameState.ageGroup = group;
            console.log('[Game] Age Group:', group);
        }

        /**
         * 게임 시작
         */
        function startGame(level) {
            gameState.level = level;
            gameState.round = 1;
            gameState.isPlaying = true;

            PlayLabCore.Analysis.reset();
            PlayLabCore.Audio.playProblem();

            showScreen('game');
            PlayLabCore.UI.updateHUD(level, 1, gameConfig.roundsPerLevel);

            // 게임 로직 시작
            startRound();
        }

        /**
         * 라운드 시작
         */
        function startRound() {
            PlayLabCore.UI.showMessage(`Round ${gameState.round}`, 1000);

            // 게임별 라운드 로직 작성
            setTimeout(() => {
                PlayLabCore.UI.hideMessage();
                // 실제 게임 시작
            }, 1000);
        }

        /**
         * 화면 전환
         */
        function showScreen(name) {
            gameState.screen = name.toUpperCase();
            document.getElementById('screen-menu').classList.toggle('hidden', name !== 'menu');
            document.getElementById('screen-game').classList.toggle('hidden', name !== 'game');
            document.getElementById('screen-result').classList.toggle('hidden', name !== 'result');
        }

        /**
         * 모달 버튼 설정
         */
        function setupModalButtons() {
            document.getElementById('btn-modal-cancel').onclick = () => {
                PlayLabCore.UI.hideModal();
            };
            document.getElementById('btn-modal-confirm').onclick = () => {
                PlayLabCore.UI.hideModal();
                showScreen('menu');
                gameState.isPlaying = false;
            };
        }

        /**
         * 게임 루프
         */
        function gameLoop() {
            const gamepad = PlayLabCore.Gamepad.poll();

            if (gamepad) {
                // EXIT 버튼 체크
                if (PlayLabCore.Gamepad.wasJustPressed(PlayLabCore.BUTTONS.EXIT)) {
                    if (gameState.screen === 'GAME' && gameState.isPlaying) {
                        PlayLabCore.UI.showExitModal(
                            () => {
                                showScreen('menu');
                                gameState.isPlaying = false;
                            },
                            () => {
                                // 취소 - do nothing
                            }
                        );
                    }
                }

                // 게임별 입력 처리
                if (gameState.screen === 'GAME' && gameState.isPlaying) {
                    handleGameInput(gamepad);
                }
            }

            requestAnimationFrame(gameLoop);
        }

        /**
         * 게임 입력 처리 (게임별로 구현)
         */
        function handleGameInput(gamepad) {
            // 게임별 입력 처리 로직 작성
            // 예: if (PlayLabCore.Gamepad.wasJustPressed(PlayLabCore.BUTTONS.RED)) { ... }
        }

        /**
         * 페이지 로드 시 초기화
         */
        window.onload = init;
    </script>
</body>

</html>
